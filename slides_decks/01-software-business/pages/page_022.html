

<!DOCTYPE html><html><head><meta charset="UTF-8"><title>软件交付简史之初代</title><style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:1600px;height:900px;overflow:hidden;margin:0;}
body{background:#F5F0E8;font-family:'Noto Sans SC','Source Han Sans SC',sans-serif;color:#1B3B6B;position:relative;}

.parchment-texture{position:absolute;top:0;left:0;width:1600px;height:900px;
background:
radial-gradient(ellipse at 20% 30%, rgba(139,115,85,0.03) 0%, transparent 50%),
radial-gradient(ellipse at 80% 70%, rgba(27,59,107,0.03) 0%, transparent 50%),
linear-gradient(135deg, #F5F0E8 0%, #F0EBE1 100%);}

/* Top geometric border */
.top-bar{position:absolute;top:0;left:0;width:1600px;height:6px;background:#1B3B6B;}
.top-bar-accent{position:absolute;top:6px;left:0;width:1600px;height:3px;background:#8B7355;}

/* Bauhaus geometric decorations - left side */
.geo-circle-1{position:absolute;top:80px;left:80px;width:180px;height:180px;border:3px solid #1B3B6B;border-radius:50%;}
.geo-circle-2{position:absolute;top:115px;left:115px;width:110px;height:110px;border:2px solid #8B7355;border-radius:50%;}
.geo-square{position:absolute;top:280px;left:80px;width:80px;height:80px;background:#1B3B6B;}
.geo-line-1{position:absolute;top:80px;left:280px;width:3px;height:380px;background:#1B3B6B;}
.geo-line-2{position:absolute;top:80px;left:270px;width:3px;height:200px;background:#8B7355;}
.geo-dot{position:absolute;top:475px;left:83px;width:8px;height:8px;background:#1B3B6B;border-radius:50%;}
.geo-dot-2{position:absolute;top:500px;left:128px;width:5px;height:5px;background:#8B7355;border-radius:50%;}
.geo-line-3{position:absolute;top:490px;left:200px;width:100px;height:2px;background:#555;}

/* Title area */
.section-num{position:absolute;top:80px;left:320px;font-family:'Noto Serif SC','Songti SC',serif;font-size:14px;color:#8B7355;letter-spacing:6px;font-weight:400;}
.main-title{position:absolute;top:115px;left:320px;font-family:'Noto Serif SC','Source Han Serif SC','Songti SC',serif;font-size:56px;color:#1B3B6B;font-weight:700;line-height:1.2;letter-spacing:2px;}
.title-underline{position:absolute;top:200px;left:320px;width:120px;height:4px;background:#1B3B6B;}
.subtitle{position:absolute;top:225px;left:320px;font-family:'Noto Serif SC',serif;font-size:20px;color:#8B7355;font-weight:400;letter-spacing:1px;font-style:italic;}

/* Bullet points */
.bullets{position:absolute;top:300px;left:320px;width:680px;}
.bullet{display:flex;align-items:flex-start;margin-bottom:22px;}
.bullet-marker{flex-shrink:0;width:18px;height:18px;background:#1B3B6B;margin-right:16px;margin-top:6px;}
.bullet-marker-square{background:#1B3B6B;}
.bullet-marker-copper{background:#8B7355;}
.bullet-marker-outline{background:transparent;border:2px solid #1B3B6B;}
.bullet-marker-dot{border-radius:50%;background:#1B3B6B;}
.bullet-marker-line{width:18px;height:2px;margin-top:14px;background:#1B3B6B;}
.bullet-text{font-family:'Noto Serif SC',serif;font-size:21px;color:#1B3B6B;line-height:1.5;font-weight:400;}
.bullet-text .accent{color:#8B7355;}
.bullet-text .em{font-weight:700;}

/* Visual metaphor area - right side - geometric record player */
.vp-area{position:absolute;top:80px;right:80px;width:460px;height:620px;}

/* Record player base (rectangular body) */
.player-base{position:absolute;top:130px;left:30px;width:400px;height:340px;background:#1B3B6B;border-radius:4px;}
.player-base-inner{position:absolute;top:160px;left:50px;width:360px;height:280px;background:#2A4A7A;border-radius:3px;}

/* Vinyl record (large circle) */
.vinyl-outer{position:absolute;top:170px;left:60px;width:260px;height:260px;border-radius:50%;background:#0D1F35;border:4px solid #1B3B6B;
box-shadow:inset 0 0 0 2px #2A4A7A, inset 0 0 0 6px #0D1F35, inset 0 0 0 8px #2A4A7A, inset 0 0 0 12px #0D1F35;}
.vinyl-label{position:absolute;top:235px;left:125px;width:130px;height:130px;border-radius:50%;background:#8B7355;display:flex;align-items:center;justify-content:center;}
.vinyl-label-inner{width:110px;height:110px;border-radius:50%;border:2px solid #F5F0E8;display:flex;align-items:center;justify-content:center;}
.vinyl-label-text{font-family:'Noto Serif SC',serif;font-size:11px;color:#F5F0E8;letter-spacing:2px;text-align:center;line-height:1.4;}
.vinyl-center{position:absolute;top:285px;left:175px;width:30px;height:30px;border-radius:50%;background:#1B3B6B;border:2px solid #F5F0E8;}

/* Tone arm */
.tone-arm-base{position:absolute;top:155px;left:340px;width:24px;height:24px;border-radius:50%;background:#8B7355;border:2px solid #F5F0E8;}
.tone-arm{position:absolute;top:165px;left:275px;width:90px;height:3px;background:#8B7355;transform-origin:right center;}
.tone-arm-head{position:absolute;top:160px;left:268px;width:12px;height:12px;background:#8B7355;border-radius:2px;}

/* Speaker grille */
.speaker{position:absolute;top:290px;left:340px;width:60px;height:80px;background:#2A4A7A;border:2px solid #F5F0E8;border-radius:3px;
background-image:repeating-linear-gradient(0deg, transparent 0, transparent 6px, #0D1F35 6px, #0D1F35 8px),
repeating-linear-gradient(90deg, transparent 0, transparent 6px, #0D1F35 6px, #0D1F35 8px);}

/* Knobs */
.knob-1{position:absolute;top:445px;left:70px;width:22px;height:22px;border-radius:50%;background:#F5F0E8;border:2px solid #8B7355;}
.knob-1::after{content:'';position:absolute;top:3px;left:9px;width:2px;height:8px;background:#1B3B6B;}
.knob-2{position:absolute;top:445px;left:110px;width:22px;height:22px;border-radius:50%;background:#F5F0E8;border:2px solid #8B7355;}
.knob-2::after{content:'';position:absolute;top:3px;left:9px;width:2px;height:8px;background:#1B3B6B;transform:rotate(60deg);}
.knob-3{position:absolute;top:445px;left:150px;width:22px;height:22px;border-radius:50%;background:#F5F0E8;border:2px solid #8B7355;}
.knob-3::after{content:'';position:absolute;top:3px;left:9px;width:2px;height:8px;background:#1B3B6B;transform:rotate(120deg);}

/* Speed indicator */
.speed-text{position:absolute;top:437px;left:195px;font-family:'Noto Serif SC',serif;font-size:14px;color:#8B7355;letter-spacing:3px;font-weight:700;}

/* Label under visual */
.vp-label{position:absolute;top:490px;left:0;width:460px;text-align:center;font-family:'Noto Serif SC','Songti SC',serif;font-size:14px;color:#555;letter-spacing:3px;font-style:italic;}

/* Bottom area */
.source{position:absolute;bottom:45px;left:320px;font-size:12px;color:#555;letter-spacing:1px;font-family:'Noto Sans SC',sans-serif;}
.source-bar{position:absolute;bottom:65px;left:320px;width:680px;height:1px;background:#8B7355;opacity:0.4;}

/* Footer geometric elements */
.footer-circle{position:absolute;bottom:50px;right:100px;width:40px;height:40px;border-radius:50%;background:#1B3B6B;}
.footer-circle-2{position:absolute;bottom:45px;right:80px;width:50px;height:50px;border-radius:50%;border:2px solid #8B7355;}
.footer-square{position:absolute;bottom:55px;right:170px;width:20px;height:20px;background:#8B7355;}

.page-num{position:absolute;bottom:45px;right:300px;font-family:'Noto Serif SC',serif;font-size:13px;color:#555;letter-spacing:2px;}

/* Right side decorative vertical line */
.right-line{position:absolute;top:80px;right:60px;width:2px;height:620px;background:#1B3B6B;opacity:0.3;}
</style></head><body>
<div class="parchment-texture"></div>
<div class="top-bar"></div>
<div class="top-bar-accent"></div>

<!-- Left decorative geometry -->
<div class="geo-circle-1"></div>
<div class="geo-circle-2"></div>
<div class="geo-square"></div>
<div class="geo-line-1"></div>
<div class="geo-line-2"></div>
<div class="geo-dot"></div>
<div class="geo-dot-2"></div>
<div class="geo-line-3"></div>

<!-- Right decorative line -->
<div class="right-line"></div>

<!-- Title -->
<div class="section-num">SECTION · Ⅰ</div>
<div class="main-title">软件交付简史<br/>之 初 代</div>
<div class="title-underline"></div>
<div class="subtitle">— 与硬件不可分割的时代</div>

<!-- Bullets -->
<div class="bullets">
<div class="bullet">
<div class="bullet-marker bullet-marker-square"></div>
<div class="bullet-text"><span class="em">和硬件不可分割</span>，软件是机器的延伸，非独立商品</div>
</div>
<div class="bullet">
<div class="bullet-marker bullet-marker-copper"></div>
<div class="bullet-text"><span class="em">大型机</span>屈指可数，分布于少数机构与政府</div>
</div>
<div class="bullet">
<div class="bullet-marker bullet-marker-outline"></div>
<div class="bullet-text"><span class="accent">定制</span>占了很大部分，一机一策，按需编写</div>
</div>
<div class="bullet">
<div class="bullet-marker bullet-marker-dot"></div>
<div class="bullet-text">安装调试像极了<span class="accent">化工机械厂</span>，重现场、重人力</div>
</div>
<div class="bullet">
<div class="bullet-marker bullet-marker-line"></div>
<div class="bullet-text">用户的需求<span class="em">高度不同</span>，标准化尚未成型</div>
</div>
</div>

<div class="source-bar"></div>
<div class="source">图片来源：IBM History / Mainframe Era · https://www.ibm.com/history/700</div>

<!-- Right visual metaphor: geometric record player -->
<div class="vp-area">
<div class="player-base"></div>
<div class="player-base-inner"></div>
<div class="vinyl-outer"></div>
<div class="vinyl-label">
<div class="vinyl-label-inner">
<div class="vinyl-label-text">SOFTWARE<br/>DELIVERY<br/>· 1960s ·</div>
</div>
</div>
<div class="vinyl-center"></div>
<div class="tone-arm-base"></div>
<div class="tone-arm"></div>
<div class="tone-arm-head"></div>
<div class="speaker"></div>
<div class="knob-1"></div>
<div class="knob-2"></div>
<div class="knob-3"></div>
<div class="speed-text">33⅓ · 45</div>
<div class="vp-label">模拟时代的仪式感 · 对比数字分发</div>
</div>

<!-- Footer -->
<div class="footer-circle"></div>
<div class="footer-circle-2"></div>
<div class="footer-square"></div>
<div class="page-num">01 / 初 代</div>
</body></html>
