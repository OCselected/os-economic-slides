

<!DOCTYPE html>
<html><!-- source_hash: 4c7623a2685bd521 -->
<head>
<meta charset="UTF-8">
<title>第 04 期 · 软件开发劳动力市场 — 讲座规则</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body, html {
  width: 1600px;
  height: 900px;
  overflow: hidden;
  margin: 0;
  background: #F5F0E8;
  font-family: 'Noto Sans SC', sans-serif;
  color: #1B3B6B;
}

.canvas {
  width: 1600px;
  height: 900px;
  position: relative;
  overflow: hidden;
}

/* Subtle parchment texture overlay */
.canvas::before {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 1600px; height: 900px;
  background: 
    radial-gradient(ellipse at 30% 20%, rgba(139,115,85,0.03) 0%, transparent 50%),
    radial-gradient(ellipse at 70% 80%, rgba(27,59,107,0.02) 0%, transparent 50%);
  pointer-events: none;
  z-index: 1;
}

/* Top bar */
.top-bar {
  position: absolute;
  top: 0; left: 0;
  width: 1600px;
  height: 3px;
  background: #1B3B6B;
  z-index: 10;
}

.top-bar-accent {
  position: absolute;
  top: 0; left: 0;
  width: 280px;
  height: 3px;
  background: #8B7355;
  z-index: 11;
}

/* Header */
.header {
  position: absolute;
  top: 40px;
  left: 80px;
  right: 80px;
  z-index: 10;
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
}

.header-left {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.deck-label {
  font-family: 'Noto Sans SC', sans-serif;
  font-size: 13px;
  letter-spacing: 3px;
  color: #8B7355;
  text-transform: uppercase;
}

.deck-title {
  font-family: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', serif;
  font-size: 15px;
  color: #555;
  letter-spacing: 1px;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 16px;
}

.slide-counter {
  font-family: 'Noto Serif SC', serif;
  font-size: 14px;
  color: #555;
  letter-spacing: 1px;
}

.slide-counter .num {
  font-size: 22px;
  color: #1B3B6B;
  font-weight: 700;
}

/* Main content area */
.main {
  position: absolute;
  top: 130px;
  left: 80px;
  right: 80px;
  bottom: 80px;
  z-index: 10;
  display: flex;
  gap: 60px;
}

/* Left panel - Visual metaphor */
.visual-panel {
  width: 520px;
  height: 100%;
  position: relative;
  flex-shrink: 0;
}

.visual-title {
  font-family: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', serif;
  font-size: 13px;
  letter-spacing: 4px;
  color: #8B7355;
  margin-bottom: 24px;
  text-transform: uppercase;
}

/* Geometric composition area */
.geo-composition {
  width: 520px;
  height: 460px;
  position: relative;
}

/* Downward diagonal line */
.diagonal-line {
  position: absolute;
  top: 40px;
  left: 30px;
  width: 460px;
  height: 2px;
  background: #1B3B6B;
  transform-origin: left center;
  transform: rotate(28deg);
}

/* Tilted large square (collapsing block) */
.collapsing-block {
  position: absolute;
  top: 60px;
  left: 80px;
  width: 140px;
  height: 140px;
  border: 3px solid #1B3B6B;
  background: rgba(27,59,107,0.06);
  transform: rotate(12deg);
}

/* Smaller block on edge */
.edge-block {
  position: absolute;
  top: 150px;
  left: 220px;
  width: 70px;
  height: 70px;
  background: #1B3B6B;
  transform: rotate(-8deg);
}

/* Circle - balancing point */
.balance-circle {
  position: absolute;
  top: 220px;
  left: 320px;
  width: 50px;
  height: 50px;
  border-radius: 50%;
  border: 3px solid #8B7355;
  background: rgba(139,115,85,0.1);
}

/* Filling circle */
.fill-circle-small {
  position: absolute;
  top: 300px;
  left: 160px;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: #8B7355;
}

/* Falling small square */
.falling-square {
  position: absolute;
  top: 340px;
  left: 380px;
  width: 24px;
  height: 24px;
  background: #555;
  transform: rotate(35deg);
  opacity: 0.6;
}

/* Another falling element */
.falling-square-2 {
  position: absolute;
  top: 380px;
  left: 440px;
  width: 16px;
  height: 16px;
  border: 2px solid #555;
  transform: rotate(52deg);
  opacity: 0.4;
}

/* Thin vertical support line */
.support-line {
  position: absolute;
  top: 180px;
  left: 260px;
  width: 2px;
  height: 180px;
  background: #8B7355;
  transform: rotate(-15deg);
  opacity: 0.7;
}

/* Large circle outline - representing wholeness/stability */
.wholeness-circle {
  position: absolute;
  top: 280px;
  left: 30px;
  width: 180px;
  height: 180px;
  border-radius: 50%;
  border: 2px solid rgba(27,59,107,0.2);
}

/* Horizontal grounding line */
.ground-line {
  position: absolute;
  top: 440px;
  left: 20px;
  width: 480px;
  height: 1.5px;
  background: rgba(85,85,85,0.4);
}

/* Tension line */
.tension-line {
  position: absolute;
  top: 100px;
  left: 200px;
  width: 2px;
  height: 120px;
  background: #1B3B6B;
  transform: rotate(20deg);
  opacity: 0.5;
}

/* Small dot accents */
.dot-accent {
  position: absolute;
  top: 370px;
  left: 80px;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #1B3B6B;
}

.dot-accent-2 {
  position: absolute;
  top: 310px;
  left: 420px;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #8B7355;
}

/* Quote below composition */
.composition-quote {
  margin-top: 20px;
  font-family: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', serif;
  font-size: 15px;
  color: #555;
  font-style: italic;
  line-height: 1.6;
  max-width: 420px;
  border-left: 2px solid #8B7355;
  padding-left: 16px;
}

/* Right panel - Content */
.content-panel {
  flex: 1;
  height: 100%;
  display: flex;
  flex-direction: column;
  padding-top: 10px;
}

.content-heading {
  font-family: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', serif;
  font-size: 36px;
  color: #1B3B6B;
  font-weight: 700;
  margin-bottom: 8px;
  line-height: 1.3;
}

.content-subheading {
  font-family: 'Noto Sans SC', sans-serif;
  font-size: 14px;
  color: #8B7355;
  letter-spacing: 2px;
  margin-bottom: 40px;
}

.rules-list {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.rule-item {
  display: flex;
  align-items: flex-start;
  gap: 18px;
  position: relative;
}

.rule-marker {
  flex-shrink: 0;
  width: 28px;
  height: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  margin-top: 2px;
}

.rule-marker .marker-square {
  width: 12px;
  height: 12px;
  background: #1B3B6B;
}

.rule-marker .marker-circle {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #8B7355;
}

.rule-marker .marker-outline-square {
  width: 12px;
  height: 12px;
  border: 2px solid #1B3B6B;
}

.rule-marker .marker-outline-circle {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  border: 2px solid #8B7355;
}

.rule-marker .marker-filled-circle {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #1B3B6B;
}

.rule-marker .marker-hollow-square {
  width: 12px;
  height: 12px;
  border: 2px solid #8B7355;
}

.rule-text {
  font-family: 'Noto Sans SC', sans-serif;
  font-size: 17px;
  color: #1B3B6B;
  line-height: 1.6;
}

.rule-text .highlight {
  font-weight: 700;
}

.rule-text .sub {
  font-size: 13px;
  color: #555;
  display: block;
  margin-top: 2px;
  letter-spacing: 0.5px;
}

/* Bottom decorative elements */
.bottom-line {
  position: absolute;
  bottom: 40px;
  left: 80px;
  right: 80px;
  height: 1px;
  background: rgba(27,59,107,0.15);
  z-index: 5;
}

.footer-left {
  position: absolute;
  bottom: 20px;
  left: 80px;
  font-size: 11px;
  color: #8B7355;
  letter-spacing: 2px;
  z-index: 10;
}

.footer-right {
  position: absolute;
  bottom: 20px;
  right: 80px;
  font-size: 11px;
  color: #8B7355;
  letter-spacing: 2px;
  z-index: 10;
}

/* Divider between panels */
.panel-divider {
  position: absolute;
  top: 130px;
  left: 660px;
  width: 1px;
  height: 690px;
  background: rgba(27,59,107,0.08);
  z-index: 5;
}

/* Geometric corner accents */
.corner-accent-tr {
  position: absolute;
  top: 50px;
  right: 120px;
  width: 40px;
  height: 40px;
  border-top: 2px solid #8B7355;
  border-right: 2px solid #8B7355;
  z-index: 5;
}

</style>
</head>
<body>
<div class="canvas">
  <div class="top-bar"></div>
  <div class="top-bar-accent"></div>
  
  <div class="corner-accent-tr"></div>
  
  <div class="header">
    <div class="header-left">
      <span class="deck-label">第 04 期</span>
      <span class="deck-title">软件开发劳动力市场</span>
    </div>
    <div class="header-right">
      <span class="slide-counter"><span class="num">07</span> / 26</span>
    </div>
  </div>

  <div class="panel-divider"></div>

  <div class="main">
    <!-- Left: Visual Metaphor -->
    <div class="visual-panel">
      <div class="visual-title">Visual Metaphor</div>
      <div class="geo-composition">
        <div class="diagonal-line"></div>
        <div class="collapsing-block"></div>
        <div class="edge-block"></div>
        <div class="support-line"></div>
        <div class="tension-line"></div>
        <div class="balance-circle"></div>
        <div class="fill-circle-small"></div>
        <div class="wholeness-circle"></div>
        <div class="falling-square"></div>
        <div class="falling-square-2"></div>
        <div class="dot-accent"></div>
        <div class="dot-accent-2"></div>
        <div class="ground-line"></div>
      </div>
      <div class="composition-quote">
        下行趋势中，于崩塌基石上<br>艰难维持平衡的挣扎。
      </div>
    </div>

    <!-- Right: Content -->
    <div class="content-panel">
      <h2 class="content-heading">讲座规则</h2>
      <p class="content-subheading">RULES OF ENGAGEMENT</p>
      
      <ul class="rules-list">
        <li class="rule-item">
          <div class="rule-marker"><div class="marker-square"></div></div>
          <div class="rule-text">
            <span class="highlight">随时交流或提问</span>
            <span class="sub">对话不是打断，是协作的起点</span>
          </div>
        </li>
        <li class="rule-item">
          <div class="rule-marker"><div class="marker-circle"></div></div>
          <div class="rule-text">
            <span class="highlight">指出错误有奖励</span>
            <span class="sub">纠错是最高形式的尊重</span>
          </div>
        </li>
        <li class="rule-item">
          <div class="rule-marker"><div class="marker-outline-square"></div></div>
          <div class="rule-text">
            <span class="highlight">个人的视角是有限的</span>
            <span class="sub">协作产生超越个体的认知</span>
          </div>
        </li>
        <li class="rule-item">
          <div class="rule-marker"><div class="marker-outline-circle"></div></div>
          <div class="rule-text">
            <span class="highlight">项目开始，就没有结束</span>
            <span class="sub">开源是无终点的持续共建</span>
          </div>
        </li>
        <li class="rule-item">
          <div class="rule-marker"><div class="marker-filled-circle"></div></div>
          <div class="rule-text">
            <span class="highlight">遵循「开源之道」</span>
            <span class="sub">透明 · 协作 · 共建 · 自由</span>
          </div>
        </li>
      </ul>
    </div>
  </div>

  <div class="bottom-line"></div>
  <div class="footer-left">OPEN SOURCE ECONOMICS LECTURES</div>
  <div class="footer-right">BAUHAUS GEOMETRIC COMPOSITION</div>
</div>
</body>
</html>
