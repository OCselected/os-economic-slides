

<!DOCTYPE html>
<html lang="zh-CN"><!-- source_hash: 0dccb5fddf0eb667 -->
<head>
<meta charset="UTF-8">
<title>软件的历史</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:1600px;height:900px;overflow:hidden;font-family:'Noto Sans SC',sans-serif;background:#F5F0E8;color:#1B3B6B;}
.slide{width:1600px;height:900px;position:relative;background:#F5F0E8;}

.deco-square-tr{position:absolute;top:0;right:0;width:72px;height:72px;background:#8B7355;}
.deco-circle-bl{position:absolute;bottom:0;left:0;width:56px;height:56px;border-radius:50%;background:#1B3B6B;}
.deco-square-bl{position:absolute;bottom:56px;left:0;width:56px;height:14px;background:#8B7355;}
.deco-circle-tr{position:absolute;top:72px;right:0;width:14px;height:56px;border-radius:0 0 7px 7px;background:#1B3B6B;}
.deco-line-top{position:absolute;top:160px;left:80px;width:1440px;height:2px;background:#1B3B6B;}
.deco-line-bot{position:absolute;top:640px;left:80px;width:1440px;height:1px;background:#1B3B6B;opacity:0.4;}

.title-zone{position:absolute;top:60px;left:80px;width:900px;}
.title-main{font-family:'Noto Serif SC',serif;font-size:54px;font-weight:700;color:#1B3B6B;letter-spacing:6px;}
.title-en{font-family:'Noto Serif SC',serif;font-size:15px;color:#8B7355;margin-top:10px;letter-spacing:8px;}
.title-underline{width:100px;height:4px;background:#8B7355;margin-top:18px;}

.tag-zone{position:absolute;top:72px;right:110px;text-align:right;}
.tag-num{font-family:'Noto Serif SC',serif;font-size:36px;color:#1B3B6B;font-weight:700;letter-spacing:2px;}
.tag-text{font-size:12px;color:#8B7355;margin-top:6px;letter-spacing:4px;}

.visual-zone{position:absolute;top:190px;left:80px;width:1440px;height:430px;}

.viz-frame{position:absolute;top:0;left:0;width:1440px;height:430px;}

.globe-area{position:absolute;left:60px;top:20px;width:420px;height:400px;}
.net-area{position:absolute;right:60px;top:20px;width:420px;height:400px;}

.mid-zone{position:absolute;left:500px;top:20px;width:440px;height:400px;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.mid-arrow{width:200px;height:3px;background:#1B3B6B;position:relative;}
.mid-arrow::after{content:"";position:absolute;right:-2px;top:-8px;width:0;height:0;border-left:14px solid #1B3B6B;border-top:9px solid transparent;border-bottom:9px solid transparent;}
.mid-label-top{font-family:'Noto Serif SC',serif;font-size:13px;color:#555;letter-spacing:4px;margin-bottom:16px;}
.mid-label-bot{font-family:'Noto Serif SC',serif;font-size:13px;color:#555;letter-spacing:4px;margin-top:16px;}
.mid-year{font-family:'Noto Serif SC',serif;font-size:11px;color:#8B7355;letter-spacing:3px;margin-top:8px;}

.globe-cap{position:absolute;bottom:-2px;left:0;width:100%;text-align:center;font-family:'Noto Serif SC',serif;font-size:13px;color:#8B7355;letter-spacing:3px;}
.net-cap{position:absolute;bottom:-2px;left:0;width:100%;text-align:center;font-family:'Noto Serif SC',serif;font-size:13px;color:#8B7355;letter-spacing:3px;}

.meta-caption{position:absolute;top:600px;left:80px;width:1440px;text-align:center;font-family:'Noto Serif SC',serif;font-size:13px;color:#555;letter-spacing:3px;font-style:italic;}

.bullets-zone{position:absolute;top:665px;left:80px;width:1440px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:auto auto;gap:22px 50px;}
.bullet{display:flex;align-items:flex-start;gap:16px;}
.bullet-num{font-family:'Noto Serif SC',serif;font-size:22px;font-weight:700;color:#8B7355;min-width:36px;line-height:1.4;}
.bullet-text{font-size:14px;color:#1B3B6B;line-height:1.7;font-family:'Noto Sans SC',sans-serif;}
.bullet-divider{width:24px;height:1px;background:#1B3B6B;opacity:0.3;align-self:center;margin-right:2px;}

<body>

    </div>
