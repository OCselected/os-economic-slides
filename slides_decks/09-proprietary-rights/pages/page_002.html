

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>第 09 期 · 排他权与容他权、比例原则与 copyleft</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1600px;height:900px;overflow:hidden;margin:0;font-family:'Noto Sans SC','Source Han Sans SC','Microsoft YaHei',sans-serif}
.slide{position:relative;width:1600px;height:900px;background:#1B3B6B;overflow:hidden}

/* subtle parchment texture via noise overlay */
.slide::before{
  content:'';position:absolute;width:1600px;height:900px;top:0;left:0;
  background:
    radial-gradient(ellipse at 20% 10%, rgba(139,115,85,0.06) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 90%, rgba(139,115,85,0.05) 0%, transparent 50%);
  pointer-events:none;
}

/* Top decorative bar */
.top-bar{position:absolute;top:0;left:0;width:1600px;height:6px;background:#8B7355}

/* Lecture number — large geometric element top-left */
.lecture-num{position:absolute;top:60px;left:70px;font-family:'Noto Serif SC','Source Han Serif SC',serif;font-size:140px;color:#F5F0E8;line-height:1;font-weight:400;letter-spacing:-4px}
.lecture-num-sub{position:absolute;top:210px;left:80px;font-size:13px;color:#8B7355;letter-spacing:6px;font-family:'Noto Sans SC',sans-serif}

/* Three pillars */
.pillar{position:absolute;bottom:120px;width:18px;background:#8B7355}
.pillar-1{left:280px;height:340px}
.pillar-2{left:380px;height:380px;background:#F5F0E8}
.pillar-3{left:480px;height:340px}

/* Pillar capitals */
.capital{position:absolute;width:44px;height:14px;background:#8B7355}
.capital-1{left:258px;bottom:456px}
.capital-2{left:358px;bottom:496px;background:#F5F0E8}
.capital-3{left:458px;bottom:456px}

/* Pillar bases */
.base{position:absolute;width:52px;height:16px;background:#8B7355;bottom:104px}
.base-1{left:254px}
.base-2{left:354px;background:#F5F0E8}
.base-3{left:454px}

/* Dome — semicircle */
.dome{position:absolute;top:100px;left:220px;width:340px;height:170px;border-radius:170px 170px 0 0;background:#F5F0E8;border:3px solid #8B7355}
.dome-inner{position:absolute;top:110px;left:245px;width:290px;height:150px;border-radius:150px 150px 0 0;border:1px solid #8B7355;background:transparent}
.dome-dot{position:absolute;top:155px;left:385px;width:14px;height:14px;border-radius:50%;background:#8B7355}

/* Ground line */
.ground{position:absolute;bottom:120px;left:0;width:1600px;height:2px;background:rgba(245,240,232,0.3)}

/* Small Bauhaus decorations */
.deco-circle{position:absolute;top:110px;left:110px;width:28px;height:28px;border-radius:50%;background:#8B7355}
.deco-square{position:absolute;top:160px;left:150px;width:18px;height:18px;background:#F5F0E8}
.deco-line-h{position:absolute;top:88px;left:150px;width:60px;height:2px;background:#F5F0E8}
.deco-circle-2{position:absolute;top:680px;left:200px;width:20px;height:20px;border-radius:50%;background:#F5F0E8}
.deco-square-2{position:absolute;top:720px;left:240px;width:14px;height:14px;background:#8B7355}
.deco-line-v{position:absolute;top:700px;left:280px;width:2px;height:60px;background:#F5F0E8}

/* Title area — right side */
.title-block{position:absolute;top:110px;left:640px;width:880px}
.title-kicker{font-size:12px;color:#8B7355;letter-spacing:8px;margin-bottom:24px}
.title-main{font-family:'Noto Serif SC','Source Han Serif SC','Songti SC',serif;font-size:48px;color:#F5F0E8;line-height:1.35;font-weight:400;letter-spacing:1px}
.title-underline{width:120px;height:4px;background:#8B7355;margin-top:28px}
.title-sub{font-size:15px;color:#F5F0E8;opacity:0.6;margin-top:20px;letter-spacing:2px;line-height:1.6}

/* Divider */
.divider{position:absolute;top:390px;left:640px;width:880px;height:1px;background:rgba(245,240,232,0.25)}

/* Bullet points */
.bullets{position:absolute;top:430px;left:640px;width:880px}
.bullet{display:flex;align-items:flex-start;margin-bottom:32px;gap:24px}
.bullet-num{font-family:'Noto Serif SC','Source Han Serif SC',serif;font-size:14px;color:#8B7355;letter-spacing:2px;min-width:36px;padding-top:4px}
.bullet-text{font-family:'Noto Serif SC','Source Han Serif SC',serif;font-size:22px;color:#F5F0E8;line-height:1.5;font-weight:400;flex:1}
.bullet-mark{width:8px;height:8px;background:#8B7355;min-width:8px;margin-top:12px}

/* Bottom info bar */
.bottom-bar{position:absolute;bottom:40px;left:70px;right:70px;display:flex;justify-content:space-between;align-items:center;padding-top:16px;border-top:1px solid rgba(139,115,85,0.3)}
.bottom-left{font-size:11px;color:rgba(245,240,232,0.5);letter-spacing:3px}
.bottom-right{font-size:11px;color:rgba(245,240,232,0.5);letter-spacing:3px;font-family:'Noto Serif SC',serif}

/* Vertical accent line on far right */
.v-accent{position:absolute;top:60px;right:40px;width:2px;height:780px;background:rgba(139,115,85,0.4)}
.v-accent-dot{position:absolute;right:32px;width:18px;height:18px;border-radius:50%;background:#F5F0E8;top:396px}

/* Decorative square near dome */
.deco-big-square{position:absolute;top:270px;left:60px;width:36px;height:36px;background:#8B7355}
</style>
</head>

  <div class="pillar pillar-1"></div>

  <div class="capital capital-2"></div>
  <div class="capital capital-3"></div>
  <div class="base base-1"></div>

  <div class="title-block">

  <div class="divider"></div>

  <div class="bullets">

    <div class="bullet">
      <div class="bullet-num">02</div>
      <div class="bullet-mark"></div>

    </div>
    <div class="bullet">

    </div>
    <div class="bullet">
      <div class="bullet-num">04</div>
      <div class="bullet-mark"></div>
      <div class="bullet-text">排他权与容他权是制度设计的核心张力</div>
    </div>
  </div>

  <!-- Right accent -->
  <div class="v-accent"></div>
  <div class="v-accent-dot"></div>

  <!-- Bottom bar -->
  <div class="bottom-bar">
    <div class="bottom-left">开源之道 · 新制度经济学视角</div>
    <div class="bottom-right">第 09 期 / 共 28 讲</div>
  </div>
</div>
