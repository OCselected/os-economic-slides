

<!DOCTYPE html>
<html lang="zh-CN"><!-- source_hash: 6553d668dad897b1 -->
<head>
<meta charset="UTF-8">
<title>科斯 · 生产的制度结构</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1600px; height: 900px; overflow: hidden; }
  body {
    background: #F5F0E8;
    font-family: 'Noto Sans SC', 'Source Han Sans SC', sans-serif;
    color: #1B3B6B;
    position: relative;
  }

  /* 微妙的羊皮纸纹理 */
  body::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background:
      repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(139,115,85,0.015) 2px, rgba(139,115,85,0.015) 4px),
      repeating-linear-gradient(90deg, transparent, transparent 3px, rgba(139,115,85,0.01) 3px, rgba(139,115,85,0.01) 6px);
    pointer-events: none;
    z-index: 0;
  }

  /* 几何构成装饰 */
  .geo { position: absolute; z-index: 1; }

  /* 右上角大圆 - 制度背景的隐喻 */
  .circle-main {
    top: -80px;
    right: -80px;
    width: 380px;
    height: 380px;
    border: 2px solid #1B3B6B;
    border-radius: 50%;
    opacity: 0.08;
  }

  /* 右上角内层圆 */
  .circle-inner {
    top: 60px;
    right: 60px;
    width: 200px;
    height: 200px;
    background: #1B3B6B;
    border-radius: 50%;
    opacity: 0.06;
  }

  /* 左下角圆 */
  .circle-bl {
    bottom: -60px;
    left: -60px;
    width: 240px;
    height: 240px;
    border: 1.5px solid #8B7355;
    border-radius: 50%;
    opacity: 0.12;
  }

  /* 左下角实心方块 */
  .square-bl {
    bottom: 120px;
    left: 180px;
    width: 70px;
    height: 70px;
    background: #8B7355;
    opacity: 0.1;
    transform: rotate(45deg);
  }

  /* 顶部装饰线 */
  .line-top {
    top: 72px;
    left: 100px;
    width: 120px;
    height: 1px;
    background: #1B3B6B;
    opacity: 0.3;
  }

  /* 顶部短竖线 */
  .line-top-v {
    top: 56px;
    left: 230px;
    width: 1px;
    height: 32px;
    background: #8B7355;
    opacity: 0.35;
  }

  /* 编号区域 */
  .slide-num {
    position: absolute;
    top: 60px;
    left: 100px;
    font-family: 'Noto Serif SC', 'Source Han Serif SC', serif;
    font-size: 14px;
    color: #8B7355;
    letter-spacing: 3px;
    opacity: 0.6;
    z-index: 2;
  }

  /* 右侧章节标记 */
  .section-mark {
    position: absolute;
    top: 60px;
    right: 100px;
    text-align: right;
    z-index: 2;
  }
  .section-mark .label {
    font-family: 'Noto Serif SC', 'Source Han Serif SC', serif;
    font-size: 11px;
    color: #8B7355;
    letter-spacing: 4px;
    opacity: 0.6;
  }
  .section-mark .num {
    font-family: 'Noto Serif SC', 'Source Han Serif SC', serif;
    font-size: 28px;
    color: #1B3B6B;
    opacity: 0.2;
    margin-top: 4px;
  }

  /* 引语标记 - 左侧大引号 */
  .quote-mark {
    position: absolute;
    top: 170px;
    left: 90px;
    font-family: 'Noto Serif SC', 'Source Han Serif SC', 'Georgia', serif;
    font-size: 160px;
    color: #1B3B6B;
    opacity: 0.07;
    line-height: 1;
    z-index: 1;
  }

  /* 引语主体容器 */
  .quote-container {
    position: absolute;
    top: 220px;
    left: 200px;
    right: 200px;
    z-index: 2;
  }

  /* 引语文本 */
  .quote-text {
    font-family: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', serif;
    font-size: 26px;
    line-height: 2.1;
    color: #1B3B6B;
    text-align: justify;
    font-weight: 500;
  }

  /* 关键词强调 */
  .quote-text em {
    font-style: normal;
    color: #8B7355;
    font-weight: 700;
  }

  /* 关键词下划线效果 */
  .underline-key {
    position: relative;
    display: inline;
  }
  .underline-key::after {
    content: '';
    position: absolute;
    bottom: -2px;
    left: 0;
    width: 100%;
    height: 2px;
    background: #1B3B6B;
    opacity: 0.2;
  }

  /* 署名 */
  .attribution {
    margin-top: 48px;
    text-align: right;
  }
  .attribution .line-deco {
    display: inline-block;
    width: 60px;
    height: 1px;
    background: #8B7355;
    opacity: 0.4;
    vertical-align: middle;
    margin-right: 16px;
  }
  .attribution .name {
    font-family: 'Noto Serif SC', 'Source Han Serif SC', serif;
    font-size: 18px;
    color: #8B7355;
    font-weight: 600;
    vertical-align: middle;
  }
  .attribution .work {
    font-family: 'Noto Serif SC', 'Source Han Serif SC', serif;
    font-size: 15px;
    color: #555;
    margin-top: 8px;
    opacity: 0.7;
    font-style: italic;
  }

  /* 底部几何装饰带 */
  .bottom-geo {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 100px;
    z-index: 0;
  }

  .bar-thin {
    position: absolute;
    bottom: 50px;
    left: 100px;
    width: 1400px;
    height: 1px;
    background: #1B3B6B;
    opacity: 0.1;
  }

  /* 底部几何元素组 */
  .geo-strip {
    position: absolute;
    bottom: 30px;
    left: 100px;
    display: flex;
    align-items: center;
    gap: 20px;
    z-index: 1;
  }

  .geo-strip .dot {
    width: 8px;
    height: 8px;
    background: #1B3B6B;
    border-radius: 50%;
    opacity: 0.25;
  }

  .geo-strip .sq {
    width: 8px;
    height: 8px;
    background: #8B7355;
    opacity: 0.25;
  }

  .geo-strip .line-d {
    width: 40px;
    height: 1px;
    background: #1B3B6B;
    opacity: 0.15;
  }

  /* 底部页脚 */
  .footer {
    position: absolute;
    bottom: 30px;
    right: 100px;
    font-size: 11px;
    color: #8B7355;
    opacity: 0.5;
    letter-spacing: 2px;
    z-index: 2;
    font-family: 'Noto Serif SC', serif;
  }

  /* 右侧垂直文字 */
  .vertical-text {
    position: absolute;
    right: 48px;
    top: 220px;
    writing-mode: vertical-rl;
    font-family: 'Noto Serif SC', 'Source Han Serif SC', serif;
    font-size: 12px;
    color: #8B7355;
    letter-spacing: 6px;
    opacity: 0.25;
    z-index: 1;
  }

  /* 左侧垂直短线组 */
  .left-bars {
    position: absolute;
    left: 60px;
    top: 300px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    z-index: 1;
  }
  .left-bars .bar {
    width: 1px;
    background: #1B3B6B;
    opacity: 0.12;
  }
  .left-bars .bar:nth-child(1) { height: 40px; }
  .left-bars .bar:nth-child(2) { height: 60px; }
  .left-bars .bar:nth-child(3) { height: 30px; }
  .left-bars .bar:nth-child(4) { height: 50px; }
  .left-bars .bar:nth-child(5) { height: 35px; }

  /* 右下角小方块装饰 */
  .corner-squares {
    position: absolute;
    bottom: 100px;
    right: 100px;
    display: flex;
    gap: 6px;
    z-index: 1;
  }
  .corner-squares .cs {
    width: 10px;
    height: 10px;
    border: 1px solid #1B3B6B;
    opacity: 0.15;
  }
  .corner-squares .cs.filled {
    background: #1B3B6B;
    opacity: 0.1;
  }

  /* 年份标记 */
  .year-mark {
    position: absolute;
    bottom: 140px;
    right: 100px;
    font-family: 'Noto Serif SC', 'Source Han Serif SC', serif;
    font-size: 11px;
    color: #8B7355;
    opacity: 0.35;
    letter-spacing: 3px;
    z-index: 1;
  }

  /* 顶部标题条 */
  .title-bar {
    position: absolute;
    top: 100px;
    left: 200px;
    right: 200px;
    z-index: 2;
  }
  .title-bar .lecture {
    font-family: 'Noto Serif SC', 'Source Han Serif SC', serif;
    font-size: 13px;
    color: #8B7355;
    opacity: 0.55;
    letter-spacing: 3px;
    margin-bottom: 12px;
  }
  .title-bar .theme {
    font-family: 'Noto Serif SC', 'Source Han Serif SC', serif;
    font-size: 15px;
    color: #1B3B6B;
    opacity: 0.35;
    letter-spacing: 1px;
  }

  /* 装饰圆环 */
  .ring-deco {
    position: absolute;
    top: 380px;
    right: 160px;
    width: 140px;
    height: 140px;
    border: 1px solid #1B3B6B;
    border-radius: 50%;
    opacity: 0.06;
    z-index: 0;
  }

  .ring-deco-2 {
    position: absolute;
    top: 420px;
    right: 200px;
    width: 60px;
    height: 60px;
    border: 1.5px solid #8B7355;
    border-radius: 50%;
    opacity: 0.08;
    z-index: 0;
  }
</style>
</head>
<body>

  <!-- 背景几何构成 -->
  <div class="geo circle-main"></div>
  <div class="geo circle-inner"></div>
  <div class="geo circle-bl"></div>
  <div class="geo square-bl"></div>
  <div class="geo ring-deco"></div>
  <div class="geo ring-deco-2"></div>

  <!-- 顶部装饰线 -->
  <div class="geo line-top"></div>
  <div class="geo line-top-v"></div>

  <!-- 编号 -->
  <div class="slide-num">Ⅳ · 04</div>

  <!-- 右侧章节标记 -->
  <div class="section-mark">
    <div class="label">CHAPTER · 04</div>
    <div class="num">04 / 04</div>
  </div>

  <!-- 大引号 -->
  <div class="quote-mark">"</div>

  <!-- 标题区域 -->
  <div class="title-bar">
    <div class="lecture">软件开发劳动力市场 · 制度经济学视角</div>
    <div class="theme">—— 交易的制度基础与生产的组织形式</div>
  </div>

  <!-- 左侧竖线组 -->
  <div class="left-bars">
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
  </div>

  <!-- 右侧垂直文字 -->
  <div class="vertical-text">制度分析 · 开源经济学 · 底层基础</div>

  <!-- 引语主体 -->
  <div class="quote-container">
    <div class="quote-text">
      由于交易赖以发生的<em>制度背景</em>会影响对<em>生产的激励</em>和<em>交易的成本</em>，因此，对经济学家而言，如果没有对<em>制度背景</em>进行具体说明就来讨论交换过程，则没有任何意义。
    </div>
    <div class="attribution">
      <div>
        <span class="line-deco"></span>
        <span class="name">罗纳德 · H · 科斯</span>
      </div>
      <div class="work">《生产的制度结构》（The Institutional Structure of Production）</div>
    </div>
  </div>

  <!-- 年份标记 -->
  <div class="year-mark">EST. 1988 · JEP</div>

  <!-- 右下角小方块 -->
  <div class="corner-squares">
    <div class="cs filled"></div>
    <div class="cs"></div>
    <div class="cs filled"></div>
    <div class="cs"></div>
  </div>

  <!-- 底部装饰线 -->
  <div class="bar-thin"></div>

  <!-- 底部几何条 -->
  <div class="geo-strip">
    <div class="dot"></div>
    <div class="sq"></div>
    <div class="dot"></div>
    <div class="line-d"></div>
    <div class="dot"></div>
  </div>

  <!-- 页脚 -->
  <div class="footer">「开源之道」 · 新制度经济学视角下的开源讲座</div>

</body>
