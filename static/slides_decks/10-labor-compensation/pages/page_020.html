

<!DOCTYPE html>
<html lang="zh-CN"><!-- source_hash: b21dcdb296ebcdfb -->
<head>
<meta charset="UTF-8">
<title>社会正义的视角 — 劳动报酬与财产分配</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1600px; height: 900px; overflow: hidden; margin: 0; }
body {
  background: #F5F0E8;
  font-family: 'Noto Sans SC', sans-serif;
  color: #1B3B6B;
  position: relative;
}

/* Subtle parchment texture */
body::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: 
    repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(139,115,85,0.015) 3px, rgba(139,115,85,0.015) 4px),
    repeating-linear-gradient(90deg, transparent, transparent 5px, rgba(27,59,107,0.01) 5px, rgba(27,59,107,0.01) 6px);
  pointer-events: none;
  z-index: 0;
}

/* Bauhaus geometric decorations */
.deco-circle-top {
  position: absolute;
  width: 180px; height: 180px;
  border-radius: 50%;
  border: 3px solid #8B7355;
  top: -50px; right: -50px;
  opacity: 0.2;
}
.deco-circle-bottom {
  position: absolute;
  width: 120px; height: 120px;
  border-radius: 50%;
  background: #1B3B6B;
  bottom: -30px; left: -30px;
  opacity: 0.08;
}
.deco-square {
  position: absolute;
  width: 80px; height: 80px;
  background: #8B7355;
  top: 80px; left: 60px;
  opacity: 0.06;
  transform: rotate(15deg);
}
.deco-line-h {
  position: absolute;
  width: 300px; height: 2px;
  background: #1B3B6B;
  top: 100px; right: 100px;
  opacity: 0.1;
}
.deco-line-v {
  position: absolute;
  width: 2px; height: 200px;
  background: #8B7355;
  bottom: 80px; right: 200px;
  opacity: 0.1;
}

/* Header */
.header {
  position: absolute;
  top: 50px;
  left: 80px;
  z-index: 10;
}
.slide-num {
  font-family: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', serif;
  font-size: 14px;
  color: #8B7355;
  letter-spacing: 3px;
  margin-bottom: 8px;
  text-transform: uppercase;
}
.slide-title {
  font-family: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', serif;
  font-size: 42px;
  color: #1B3B6B;
  font-weight: 700;
  line-height: 1.2;
}
.title-underline {
  width: 120px;
  height: 3px;
  background: #1B3B6B;
  margin-top: 16px;
}

/* Main content area */
.main-content {
  position: absolute;
  top: 180px;
  left: 80px;
  right: 80px;
  bottom: 80px;
  display: flex;
  align-items: stretch;
  gap: 60px;
  z-index: 10;
}

/* Left: Scale visual */
.scale-area {
  flex: 0 0 680px;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Scale structure */
.scale-container {
  position: relative;
  width: 600px;
  height: 520px;
}

/* Fulcrum triangle */
.fulcrum {
  position: absolute;
  bottom: 60px;
  left: 50%;
  transform: translateX(-50%);
  width: 0; height: 0;
  border-left: 40px solid transparent;
  border-right: 40px solid transparent;
  border-bottom: 65px solid #1B3B6B;
  opacity: 0.9;
}
.fulcrum-base {
  position: absolute;
  bottom: 50px;
  left: 50%;
  transform: translateX(-50%);
  width: 100px;
  height: 8px;
  background: #1B3B6B;
  opacity: 0.9;
}

/* Scale pole */
.scale-pole {
  position: absolute;
  bottom: 125px;
  left: 50%;
  transform: translateX(-50%);
  width: 4px;
  height: 120px;
  background: #1B3B6B;
  opacity: 0.9;
}

/* Scale beam - slightly tilted to show imbalance */
.scale-beam {
  position: absolute;
  bottom: 230px;
  left: 50%;
  transform: translateX(-50%) rotate(-5deg);
  transform-origin: center;
  width: 460px;
  height: 4px;
  background: #1B3B6B;
  opacity: 0.9;
}

/* Beam pivot dot */
.beam-pivot {
  position: absolute;
  bottom: 226px;
  left: 50%;
  transform: translateX(-50%);
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: #8B7355;
  border: 3px solid #1B3B6B;
  z-index: 5;
}

/* Left pan - coins side */
.pan-left {
  position: absolute;
  bottom: 175px;
  left: 85px;
  width: 140px;
  height: 60px;
}
.pan-left-plate {
  width: 140px;
  height: 6px;
  background: #8B7355;
  border-radius: 3px;
  margin-top: 40px;
}
.pan-left-strings {
  position: absolute;
  top: 0;
  left: 10px;
  width: 120px;
  height: 44px;
}
.string {
  position: absolute;
  width: 1px;
  height: 44px;
  background: #8B7355;
  opacity: 0.6;
}
.string-1 { left: 0; }
.string-2 { left: 59px; }
.string-3 { left: 118px; }

/* Coins */
.coin {
  position: absolute;
  border-radius: 50%;
  background: #8B7355;
  border: 2px solid #1B3B6B;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Noto Serif SC', serif;
  color: #F5F0E8;
  font-size: 11px;
  font-weight: 700;
}
.coin-1 { width: 32px; height: 32px; top: 5px; left: 30px; }
.coin-2 { width: 28px; height: 28px; top: 12px; left: 68px; }
.coin-3 { width: 24px; height: 24px; top: 20px; left: 20px; opacity: 0.8; }
.coin-4 { width: 26px; height: 26px; top: 8px; left: 100px; opacity: 0.85; }
.coin-5 { width: 20px; height: 20px; top: 24px; left: 90px; opacity: 0.7; }

/* Coin label */
.coins-label {
  position: absolute;
  top: -20px;
  left: 20px;
  font-family: 'Noto Serif SC', serif;
  font-size: 12px;
  color: #8B7355;
  letter-spacing: 1px;
}

/* Right pan - labor side (tilted down more) */
.pan-right {
  position: absolute;
  bottom: 130px;
  right: 55px;
  width: 140px;
  height: 60px;
}
.pan-right-plate {
  width: 140px;
  height: 6px;
  background: #1B3B6B;
  border-radius: 3px;
  margin-top: 40px;
}
.pan-right-strings {
  position: absolute;
  top: 0;
  left: 10px;
  width: 120px;
  height: 44px;
}

/* Human labor figures */
.labor-figures {
  position: absolute;
  top: -5px;
  left: 10px;
  width: 120px;
  height: 45px;
}
.figure {
  position: absolute;
}
.figure-head {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: #1B3B6B;
  margin: 0 auto;
}
.figure-body {
  width: 8px;
  height: 22px;
  background: #1B3B6B;
  margin: 2px auto 0;
}
.figure-1 { top: 8px; left: 15px; }
.figure-2 { top: 5px; left: 48px; }
.figure-3 { top: 10px; left: 80px; }
.figure-4 { top: 12px; left: 105px; }

/* Labor label */
.labor-label {
  position: absolute;
  top: -22px;
  right: 15px;
  font-family: 'Noto Serif SC', serif;
  font-size: 12px;
  color: #1B3B6B;
  letter-spacing: 1px;
  font-weight: 700;
}

/* Scale caption */
.scale-caption {
  position: absolute;
  bottom: 15px;
  left: 50%;
  transform: translateX(-50%);
  font-family: 'Noto Serif SC', serif;
  font-size: 13px;
  color: #8B7355;
  letter-spacing: 2px;
  font-style: italic;
}

/* Weight indicators */
.weight-indicator {
  position: absolute;
  bottom: 290px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 12px;
  font-family: 'Noto Serif SC', serif;
  font-size: 11px;
  color: #555;
  letter-spacing: 1px;
}
.weight-bar {
  width: 180px;
  height: 3px;
  background: linear-gradient(to right, #8B7355 65%, #1B3B6B 65%);
  position: relative;
}
.weight-marker {
  position: absolute;
  top: -4px;
  left: 65%;
  width: 11px;
  height: 11px;
  background: #1B3B6B;
  border-radius: 50%;
  border: 2px solid #F5F0E8;
}

/* Right side: bullets */
.content-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding-right: 20px;
}

.eyebrow {
  font-family: 'Noto Serif SC', serif;
  font-size: 13px;
  color: #8B7355;
  letter-spacing: 4px;
  margin-bottom: 20px;
  text-transform: uppercase;
}

.bullet-list {
  list-style: none;
  padding: 0;
}
.bullet-list li {
  position: relative;
  padding-left: 30px;
  margin-bottom: 28px;
  font-size: 17px;
  line-height: 1.6;
  color: #1B3B6B;
}
.bullet-list li::before {
  content: '';
  position: absolute;
  left: 0;
  top: 10px;
  width: 14px;
  height: 14px;
  background: #1B3B6B;
  opacity: 0.15;
}
.bullet-list li::after {
  content: '';
  position: absolute;
  left: 3px;
  top: 13px;
  width: 8px;
  height: 8px;
  background: #1B3B6B;
}
.bullet-list li:nth-child(2)::after { background: #8B7355; }
.bullet-list li:nth-child(3)::after { background: #8B7355; }
.bullet-list li:nth-child(4)::after { background: #555; }
.bullet-list li:nth-child(5)::after { background: #555; }

.bullet-list li:first-child {
  font-family: 'Noto Serif SC', serif;
  font-size: 20px;
  font-weight: 600;
  margin-bottom: 32px;
}

/* Footer */
.footer {
  position: absolute;
  bottom: 35px;
  left: 80px;
  right: 80px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  z-index: 10;
}
.footer-left {
  font-family: 'Noto Sans SC', sans-serif;
  font-size: 11px;
  color: #8B7355;
  letter-spacing: 2px;
}
.footer-right {
  font-family: 'Noto Serif SC', serif;
  font-size: 11px;
  color: #555;
  letter-spacing: 1px;
}

/* Decorative Bauhaus elements */
.bauhaus-accent-1 {
  position: absolute;
  width: 60px;
  height: 60px;
  border: 3px solid #1B3B6B;
  top: 450px;
  left: 30px;
  opacity: 0.08;
}
.bauhaus-accent-2 {
  position: absolute;
  width: 40px;
  height: 40px;
  background: #8B7355;
  top: 750px;
  right: 50px;
  opacity: 0.08;
  transform: rotate(45deg);
}
.bauhaus-accent-3 {
  position: absolute;
  width: 100px;
  height: 3px;
  background: #1B3B6B;
  top: 380px;
  right: 40px;
  opacity: 0.1;
}
</style>
</head>
<body>

<!-- Bauhaus geometric decorations -->
<div class="deco-circle-top"></div>
<div class="deco-circle-bottom"></div>
<div class="deco-square"></div>
<div class="deco-line-h"></div>
<div class="deco-line-v"></div>
<div class="bauhaus-accent-1"></div>
<div class="bauhaus-accent-2"></div>
<div class="bauhaus-accent-3"></div>

<!-- Header -->
<div class="header">
  <div class="slide-num">SLIDE 18 / 29 · 第 10 期</div>
  <div class="slide-title">社会正义的视角</div>
  <div class="title-underline"></div>
</div>

<!-- Main Content -->
<div class="main-content">
  
  <!-- Left: Balance Scale Visual -->
  <div class="scale-area">
    <div class="scale-container">
      
      <!-- Weight imbalance indicator -->
      <div class="weight-indicator">
        <span>经济回报</span>
        <div class="weight-bar">
          <div class="weight-marker"></div>
        </div>
        <span>人类付出</span>
      </div>

      <!-- Scale beam -->
      <div class="scale-beam"></div>
      <div class="beam-pivot"></div>

      <!-- Scale pole -->
      <div class="scale-pole"></div>

      <!-- Fulcrum -->
      <div class="fulcrum"></div>
      <div class="fulcrum-base"></div>

      <!-- Left pan: Digital Coins (higher = lighter) -->
      <div class="pan-left">
        <div class="pan-left-strings">
          <div class="string string-1"></div>
          <div class="string string-2"></div>
          <div class="string string-3"></div>
        </div>
        <div class="pan-left-plate"></div>
        <div class="coin coin-1">1</div>
        <div class="coin coin-2">0</div>
        <div class="coin coin-3">1</div>
        <div class="coin coin-4">0</div>
        <div class="coin coin-5">1</div>
        <div class="coins-label">数字回报</div>
      </div>

      <!-- Right pan: Human Labor (lower = heavier) -->
      <div class="pan-right">
        <div class="pan-right-strings">
          <div class="string string-1"></div>
          <div class="string string-2"></div>
          <div class="string string-3"></div>
        </div>
        <div class="pan-right-plate"></div>
        <div class="labor-figures">
          <div class="figure figure-1">
            <div class="figure-head"></div>
            <div class="figure-body"></div>
          </div>
          <div class="figure figure-2">
            <div class="figure-head"></div>
            <div class="figure-body"></div>
          </div>
          <div class="figure figure-3">
            <div class="figure-head"></div>
            <div class="figure-body"></div>
          </div>
          <div class="figure figure-4">
            <div class="figure-head"></div>
            <div class="figure-body"></div>
          </div>
        </div>
        <div class="labor-label">人类劳动</div>
      </div>

      <!-- Caption -->
      <div class="scale-caption">— 开源分配之天平 —</div>
    </div>
  </div>

  <!-- Right: Bullet Points -->
  <div class="content-area">
    <div class="eyebrow">分配正义 · DISTRIBUTIVE JUSTICE</div>
    <ul class="bullet-list">
      <li>开源的分配问题不仅是经济问题，也是社会正义问题</li>
      <li>谁从开源中获益？谁为开源付出？</li>
      <li>当前的制度安排是否公平？</li>
      <li>贡献者与使用者的权力结构长期失衡</li>
      <li>若不能解决分配问题，开源的可持续性将受到根本挑战</li>
    </ul>
  </div>

</div>

<!-- Footer -->
<div class="footer">
  <div class="footer-left">开源之道 · 新制度经济学视角</div>
  <div class="footer-right">第 10 期 · 劳动报酬与财产分配</div>
</div>

</body>
</html>
