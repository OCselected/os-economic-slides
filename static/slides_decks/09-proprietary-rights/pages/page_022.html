ition:absolute;top:120px;right:80px;width:840px;height:660px}.br-label-left{position:absolute;top:280px;left:80px;width:180px;text-align:center;font-size:12px;letter-spacing:4px;color:rgba(245,240,232,0.5);font-family:'Noto Serif SC',serif}.br-label-right{position:absolute;top:280px;right:80px;width:180px;text-align:center;font-size:12px;letter-spacing:4px;color:rgba(245,240,232,0.5);font-family:'Noto Serif SC',serif}.br-label-top{position:absolute;top:80px;left:50%;transform:translateX(-50%);font-size:11px;letter-spacing:5px;color:#C9A96E;font-family:'Noto Serif SC',serif}.br-deep-line{position:absolute;font-size:12px;letter-spacing:3px;color:rgba(201,169,110,0.7);font-family:'Noto Serif SC',serif;text-align:center;width:200px;left:50%;margin-left:-100px}</style></head><body><div class="slide"><!-- Header --><div class="header-bar"><span class="lecture-meta">开源之道 · 新制度经济学视角</span><span class="lecture-num">Lecture 09 / 28</span></div><!-- Main content text --><div class="main-content"><div class="kicker">CHAPTER · 09.3</div><h1 class="title">开源制度的<br>创新意义</h1><div class="title-underline"></div><ul class="bullets"><li>开源不是<strong>废除</strong>知识产权</li><li>而是<strong>重新设计</strong>知识产权的使用方式</li><li>容他权是知识产权的<strong>制度创新</strong></li><li>产权制度也可以<strong>服务于公共品生产</strong></li></ul></div><!-- Bauhaus geometric bridge composition --><svg class="composition" viewBox="0 0 840 660" xmlns="http://www.w3.org/2000/svg"><!-- Private territory: circle on the left --><circle cx="160" cy="440" r="130" fill="none" stroke="#C9A96E" stroke-width="2"/><circle cx="160" cy="440" r="130" fill="rgba(139,115,85,0.08)"/><text x="160" y="446" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="15" fill="rgba(245,240,232,0.7)" letter-spacing="2">私人领地</text><text x="160" y="468" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="10" fill="rgba(245,240,232,0.4)" letter-spacing="3">PRIVATE DOMAIN</text><!-- Public square: large square on the right --><rect x="560" y="3
