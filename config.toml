baseURL = "https://os-economic.opensourceway.blog/"
languageCode = "zh-CN"
title = "开源的经济学 · 12 讲"

[params]
description = "Open Source Economics — 12 lectures on the institutional economics of open source software"
prussian = "#1B3B6B"
cream = "#F5F0E8"
ink = "#1A1A1A"
copper = "#8B7355"
muted = "#555555"

[markup.goldmark.renderHooks]
[markup.goldmark.renderHooks.HTML]
  hardBreaks = true

[markup.goldmark]
[markup.goldmark.parser]
[markup.goldmark.parser.attribute]
  block = true
[markup.goldmark.renderer]
  unsafe = true

ignoreLogs = ['warning-goldmark-raw-html']

[outputs]
home = ["HTML"]