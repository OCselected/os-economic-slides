<style>
html, body {

/* Subtle parchment texture */
body::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: radial-gradient(ellipse at 30% 20%, rgba(255,255,255,0.3) 0%, transparent 50%),

}

/* Header area */
.slide-header {

  letter-spacing: 1px;
}
.slide-header .line {
  width: 40px;
  height: 1px;

}

/* Main title */
.main-title {
  position: absolute;
  top: 100px;
  left: 80px;
  font-family: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', serif;
  font-size: 48px;
  font-weight: 700;
  color: #1B3B6B;
  line-height: 1.3;
  max-width: 780px;
  letter-spacing: -0.5px;
}

.main-title .emphasis {
  color: #1B3B6B;

}

/* Right side geometric composition */
.geo-composition {
  position: absolute;
  top: 80px;
  right: 80px;
  width: 480px;
  height: 740px;
}

/* Large heavy square - representing pressure */
.heavy-square {
  position: absolute;
  top: 0;
  right: 40px;
  width: 220px;
  height: 220px;
  background: #1B3B6B;
}

.heavy-square::after {
  content: '';
  position: absolute;
  bottom: -15px;
  left: 0;
  right: 0;
  height: 15px;
  background: rgba(27,59,107,0.2);
}

/* Circle overlapping the square */
.overlap-circle {
  position: absolute;
  top: 60px;
  right: 180px;
  width: 140px;
  height: 140px;
  border-radius: 50%;
  background: #1B3B6B;
  opacity: 0.85;
}

/* Small copper accent circle */
.copper-dot {
  position: absolute;
  top: 240px;
  right: 60px;
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: #8B7355;
}

/* Descending diagonal line - weight/pull */
.descend-line {
  position: absolute;
  top: 270px;
  right: 200px;
  width: 280px;
  height: 2px;
  background: #1B3B6B;
  transform-origin: right center;
  transform: rotate(25deg);
}

/* Second descending line */
.descend-line-2 {
  position: absolute;
  top: 320px;
  right: 120px;
  width: 180px;
  height: 2px;
  background: #8B7355;
  opacity: 0.6;
  transform-origin: right center;
  transform: rotate(20deg);
}

/* Stack of squares - layered pressure */
.stack-square-1 {
  position: absolute;
  top: 400px;
  right: 40px;
  width: 100px;
  height: 100px;
  border: 2px solid #1B3B6B;
}

.stack-square-2 {

.stack-square-3 {

  top: 480px;
  right: 140px;
  width: 60px;
  height: 60px;
  background: #8B7355;
}

/* Vertical weight bar */
.weight-bar {
  position: absolute;
  top: 570px;
  right: 200px;
  width: 4px;
  height: 160px;

  right: 170px;

  font-size: 12px;

}

.content-list {
  position: absolute;
  top: 340px;

.list-item {
  display: flex;

  margin-bottom: 28px;

.list-item:nth-child(1) { animation-delay: 0.1s; }
.list-item:nth-child(2) { animation-delay: 0.2s; }
.list-item:nth-child(3) { animation-delay: 0.3s; }
.list-item:nth-child(4) { animation-delay: 0.4s; }
.list-item:nth-child(5) { animation-delay: 0.5s; }

.list-item .marker {

}

.list-item .marker.square {

}

.list-item .marker.circle {

}

.list-item .marker.outline {

}

.list-item .text {

  font-size: 24px;
  color: #1B3B6B;
  letter-spacing: 1px;
}

.list-item .sub {
  font-size: 14px;
  color: #555;
  margin-left: 12px;
  letter-spacing: 0.5px;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Bottom footer */
.footer {
  position: absolute;
  bottom: 40px;
  left: 80px;
  right: 80px;

.title-accent {

.question-accent {
