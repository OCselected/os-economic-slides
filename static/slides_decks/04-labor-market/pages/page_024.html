-inner"></div><div class="geo-line-h"></div><div class="geo-dot"></div><div class="geo-dot2"></div><div class="geo-dot3"></div></div><!-- Text Content --><div class="text-area"><div class="chapter-tag">EPILOGUE · 尾 声</div><div class="chapter-title">制度，是开源经济学的底层语法</div><div class="chapter-subtitle">Institutions as the Deep Structure of Open-Source Economics</div><div class="divider"></div><div class="quote-mark">&ldquo;</div><div class="quote-body">由于交易赖以发生的制度背景会影响对生产的激励和交易的成本，因此，对经济学家而言，如果没有对制度背景进行具体说明就来讨论交换过程，则没有任何意义。</div><div class="quote-attribution"><span class="attribution-line"></span><span class="attribution-text">—— 罗纳德·H·科斯&ensp;《生产的制度结构》</span></div><div class="closing-area"><div><div class="closing-question">那么，开源世界的制度背景，究竟由什么构成？</div><div class="closing-mark">— 思 考 题 —</div></div></div></div><div class="bottom-label"><span class="page-num">— 思考者 —</span><span class="footer-line"></span><span class="page-footer">开 源 之 道 &middot; 新 制 度 经 济 学 视 角</span><span class="footer-line"></span><span class="page-num">FIN.</span></div></body></html>
