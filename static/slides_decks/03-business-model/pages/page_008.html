

<!DOCTYPE html>
<html lang="zh-CN"><!-- source_hash: e78e07977b24ac7e -->
<head>
<meta charset="UTF-8">
<title>有形财产的交易</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 1600px;
  height: 900px;
  overflow: hidden;
  margin: 0;
  background: #F5F0E8;
  font-family: 'Noto Sans SC', sans-serif;
  color: #1B3B6B;
}

.canvas {
  position: relative;
  width: 1600px;
  height: 900px;
  overflow: hidden;
}

/* Parchment texture overlay */
.parchment {
  position: absolute;
  top: 0; left: 0;
  width: 1600px; height: 900px;
  background:
    repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(139,115,85,0.015) 2px,
      rgba(139,115,85,0.015) 3px
    ),
    repeating-linear-gradient(
      90deg,
      transparent,
      transparent 3px,
      rgba(139,115,85,0.01) 3px,
      rgba(139,115,85,0.01) 4px
    );
  pointer-events: none;
  z-index: 1;
}

/* Bauhaus geometric decorations */
.deco-circle-large {
  position: absolute;
  top: -120px;
  right: -120px;
  width: 400px;
  height: 400px;
  border-radius: 50%;
  border: 2px solid rgba(27,59,107,0.06);
  z-index: 0;
}

.deco-circle-medium {
  position: absolute;
  bottom: -80px;
  left: -80px;
  width: 280px;
  height: 280px;
  border-radius: 50%;
  border: 2px solid rgba(27,59,107,0.05);
  z-index: 0;
}

.deco-square {
  position: absolute;
  top: 60px;
  right: 60px;
  width: 60px;
  height: 60px;
  border: 2px solid rgba(27,59,107,0.1);
  transform: rotate(45deg);
  z-index: 0;
}

.deco-line-h {
  position: absolute;
  bottom: 50px;
  left: 0;
  width: 1600px;
  height: 1px;
  background: rgba(27,59,107,0.08);
  z-index: 0;
}

.deco-line-v {
  position: absolute;
  left: 50px;
  top: 0;
  width: 1px;
  height: 900px;
  background: rgba(27,59,107,0.04);
  z-index: 0;
}

.deco-dot-1 {
  position: absolute;
  top: 200px;
  left: 80px;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #8B7355;
  opacity: 0.3;
  z-index: 0;
}

.deco-dot-2 {
  position: absolute;
  top: 750px;
  right: 120px;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #1B3B6B;
  opacity: 0.2;
  z-index: 0;
}

.deco-square-small {
  position: absolute;
  bottom: 120px;
  left: 750px;
  width: 20px;
  height: 20px;
  border: 1.5px solid rgba(139,115,85,0.2);
  z-index: 0;
}

/* Header */
.header {
  position: absolute;
  top: 55px;
  left: 80px;
  z-index: 10;
}

.slide-num {
  font-family: 'Noto Serif SC', serif;
  font-size: 14px;
  color: #8B7355;
  letter-spacing: 3px;
  margin-bottom: 12px;
  font-weight: 400;
}

.title {
  font-family: 'Noto Serif SC', serif;
  font-size: 42px;
  font-weight: 700;
  color: #1B3B6B;
  line-height: 1.3;
  letter-spacing: 1px;
}

.title-accent {
  display: inline-block;
  width: 6px;
  height: 42px;
  background: #1B3B6B;
  margin-right: 20px;
  vertical-align: middle;
  margin-bottom: 4px;
}

/* Main content area */
.content-area {
  position: absolute;
  top: 180px;
  left: 80px;
  right: 80px;
  bottom: 80px;
  display: flex;
  z-index: 10;
  gap: 60px;
}

/* Left: Network visualization */
.network-panel {
  flex: 1;
  position: relative;
  background: rgba(27,59,107,0.02);
  border: 1px solid rgba(27,59,107,0.08);
  border-radius: 2px;
  overflow: hidden;
}

.network-label {
  position: absolute;
  top: 20px;
  left: 24px;
  font-family: 'Noto Serif SC', serif;
  font-size: 13px;
  color: #8B7355;
  letter-spacing: 2px;
  font-weight: 400;
  z-index: 5;
}

/* Network nodes */
.node {
  position: absolute;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  z-index: 4;
}

.node-circle {
  width: 72px;
  height: 72px;
  border-radius: 50%;
  background: #F5F0E8;
  border: 2.5px solid #1B3B6B;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Noto Serif SC', serif;
  font-size: 15px;
  font-weight: 700;
  color: #1B3B6B;
  box-shadow: 0 2px 8px rgba(27,59,107,0.08);
}

.node-square {
  width: 64px;
  height: 64px;
  background: #F5F0E8;
  border: 2.5px solid #1B3B6B;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Noto Serif SC', serif;
  font-size: 14px;
  font-weight: 700;
  color: #1B3B6B;
  box-shadow: 0 2px 8px rgba(27,59,107,0.08);
}

.node-diamond {
  width: 58px;
  height: 58px;
  background: #F5F0E8;
  border: 2.5px solid #8B7355;
  transform: rotate(45deg);
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 2px 8px rgba(139,115,85,0.08);
}

.node-diamond span {
  transform: rotate(-45deg);
  font-family: 'Noto Serif SC', serif;
  font-size: 13px;
  font-weight: 700;
  color: #8B7355;
}

.node-label {
  margin-top: 10px;
  font-family: 'Noto Sans SC', sans-serif;
  font-size: 13px;
  color: #555;
  font-weight: 400;
  letter-spacing: 1px;
}

.node-label-small {
  margin-top: 8px;
  font-family: 'Noto Sans SC', sans-serif;
  font-size: 11px;
  color: #8B7355;
  font-weight: 300;
  letter-spacing: 0.5px;
}

/* Node positions */
.node-supply { top: 80px; left: 60px; }
.node-demand { top: 80px; right: 60px; }
.node-intermediary { top: 200px; left: 140px; }
.node-property { top: 200px; right: 140px; }
.node-government { bottom: 100px; left: 50%; transform: translateX(-50%); }
.node-arbitration { bottom: 100px; right: 120px; }
.node-exchange { top: 310px; left: 50%; transform: translateX(-50%); }

/* SVG connections */
.connections {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 2;
}

/* Right: Bullet points */
.bullet-panel {
  width: 400px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 20px 0;
}

.bullet-section-label {
  font-family: 'Noto Serif SC', serif;
  font-size: 12px;
  color: #8B7355;
  letter-spacing: 4px;
  margin-bottom: 28px;
  font-weight: 400;
}

.bullet-item {
  display: flex;
  align-items: flex-start;
  margin-bottom: 24px;
  padding-left: 0;
}

.bullet-marker {
  width: 8px;
  height: 8px;
  background: #1B3B6B;
  margin-top: 8px;
  margin-right: 18px;
  flex-shrink: 0;
}

.bullet-marker-square {
  width: 8px;
  height: 8px;
  border: 1.5px solid #1B3B6B;
  margin-top: 8px;
  margin-right: 18px;
  flex-shrink: 0;
}

.bullet-marker-diamond {
  width: 7px;
  height: 7px;
  background: #8B7355;
  transform: rotate(45deg);
  margin-top: 7px;
  margin-right: 20px;
  flex-shrink: 0;
}

.bullet-text {
  font-family: 'Noto Sans SC', sans-serif;
  font-size: 17px;
  color: #1B3B6B;
  line-height: 1.6;
  font-weight: 500;
}

.bullet-subtext {
  font-family: 'Noto Sans SC', sans-serif;
  font-size: 13px;
  color: #555;
  font-weight: 300;
  margin-top: 3px;
  line-height: 1.5;
}

/* Emphasis box */
.emphasis-box {
  margin-top: 30px;
  padding: 18px 22px;
  border-left: 3px solid #1B3B6B;
  background: rgba(27,59,107,0.03);
}

.emphasis-box .label {
  font-family: 'Noto Serif SC', serif;
  font-size: 11px;
  color: #8B7355;
  letter-spacing: 2px;
  margin-bottom: 6px;
}

.emphasis-box .content {
  font-family: 'Noto Serif SC', serif;
  font-size: 18px;
  color: #1B3B6B;
  font-weight: 700;
  line-height: 1.5;
}

/* Flow arrows */
.flow-label {
  position: absolute;
  font-family: 'Noto Sans SC', sans-serif;
  font-size: 10px;
  color: #8B7355;
  letter-spacing: 1px;
  z-index: 5;
  font-weight: 300;
}

/* Bottom accent bar */
.bottom-bar {
  position: absolute;
  bottom: 30px;
  left: 80px;
  right: 80px;
  height: 1px;
  background: linear-gradient(to right, rgba(27,59,107,0.15), rgba(27,59,107,0.02));
  z-index: 10;
}

/* Footer */
.footer {
  position: absolute;
  bottom: 12px;
  left: 80px;
  font-family: 'Noto Sans SC', sans-serif;
  font-size: 11px;
  color: #8B7355;
  letter-spacing: 2px;
  opacity: 0.6;
  z-index: 10;
}

/* Small circle accents on network */
.mini-dot {
  position: absolute;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: #8B7355;
  opacity: 0.4;
  z-index: 3;
}

/* Encouragement indicator */
.encouragement {
  position: absolute;
  bottom: 38px;
  left: 24px;
  display: flex;
  align-items: center;
  gap: 8px;
  z-index: 5;
}

.encouragement-line {
  width: 30px;
  height: 1px;
  background: #1B3B6B;
}

.encouragement-text {
  font-family: 'Noto Sans SC', sans-serif;
  font-size: 10px;
  color: #1B3B6B;
  letter-spacing: 1px;
  font-weight: 400;
}

/* SVG line styles */
.conn-line {
  stroke: #1B3B6B;
  stroke-width: 1.2;
  fill: none;
  opacity: 0.2;
}

.conn-line-solid {
  stroke: #1B3B6B;
  stroke-width: 1.5;
  fill: none;
  opacity: 0.35;
}

.conn-line-dashed {
  stroke: #8B7355;
  stroke-width: 1;
  fill: none;
  opacity: 0.25;
  stroke-dasharray: 4 3;
}
</style>
</head>
<body>
<div class="canvas">
  <!-- Background decorations -->
  <div class="parchment"></div>
  <div class="deco-circle-large"></div>
  <div class="deco-circle-medium"></div>
  <div class="deco-square"></div>
  <div class="deco-line-h"></div>
  <div class="deco-line-v"></div>
  <div class="deco-dot-1"></div>
  <div class="deco-dot-2"></div>
  <div class="deco-square-small"></div>

  <!-- Header -->
  <div class="header">
    <div class="slide-num">03 / 30</div>
    <div class="title"><span class="title-accent"></span>有形财产的交易</div>
  </div>

  <!-- Main content -->
  <div class="content-area">
    <!-- Left: Network Visualization -->
    <div class="network-panel">
      <div class="network-label">交易网络 · SORTING NETWORK</div>

      <!-- SVG Connections -->
      <svg class="connections" viewBox="0 0 640 580" preserveAspectRatio="none">
        <!-- Supply to Intermediary -->
        <path class="conn-line-solid" d="M 130 120 Q 170 160 200 220" />
        <!-- Demand to Property -->
        <path class="conn-line-solid" d="M 510 120 Q 470 160 440 220" />
        <!-- Supply to Property -->
        <path class="conn-line" d="M 155 120 Q 320 150 415 210" />
        <!-- Demand to Intermediary -->
        <path class="conn-line" d="M 485 120 Q 320 150 225 210" />
        <!-- Intermediary to Exchange -->
        <path class="conn-line-solid" d="M 200 260 Q 280 310 310 350" />
        <!-- Property to Exchange -->
        <path class="conn-line-solid" d="M 440 260 Q 360 310 330 350" />
        <!-- Exchange to Government -->
        <path class="conn-line-dashed" d="M 310 395 Q 280 440 260 480" />
        <!-- Exchange to Arbitration -->
        <path class="conn-line-dashed" d="M 330 395 Q 380 440 420 480" />
        <!-- Intermediary to Government -->
        <path class="conn-line" d="M 200 260 Q 220 370 255 480" />
        <!-- Property to Arbitration -->
        <path class="conn-line" d="M 440 260 Q 420 370 425 480" />
        <!-- Supply to Demand (top arc) -->
        <path class="conn-line-dashed" d="M 155 105 Q 320 60 485 105" />
      </svg>

      <!-- Mini dots along paths -->
      <div class="mini-dot" style="top: 160px; left: 170px;"></div>
      <div class="mini-dot" style="top: 155px; left: 470px;"></div>
      <div class="mini-dot" style="top: 290px; left: 280px;"></div>
      <div class="mini-dot" style="top: 290px; left: 360px;"></div>
      <div class="mini-dot" style="top: 420px; left: 270px;"></div>
      <div class="mini-dot" style="top: 420px; left: 370px;"></div>
      <div class="mini-dot" style="top: 75px; left: 300px;"></div>

      <!-- Nodes -->
      <div class="node node-supply">
        <div class="node-circle">供应</div>
        <div class="node-label">需求方 / 供应方</div>
      </div>

      <div class="node node-demand">
        <div class="node-circle">需求</div>
        <div class="node-label">市场终端</div>
      </div>

      <div class="node node-intermediary">
        <div class="node-diamond"><span>中介</span></div>
        <div class="node-label-small">中介 · INTERMEDIARY</div>
      </div>

      <div class="node node-property">
        <div class="node-square">资产</div>
        <div class="node-label-small">土地 / 房屋</div>
      </div>

      <div class="node node-exchange">
        <div class="node-square" style="border-color: #1B3B6B; border-width: 2.5px; width: 80px; height: 48px; border-radius: 4px;">交易所</div>
        <div class="node-label-small" style="margin-top: 6px;">EXCHANGE</div>
      </div>

      <div class="node node-government">
        <div class="node-circle" style="border-color: #8B7355; width: 64px; height: 64px; font-size: 13px;">政府</div>
        <div class="node-label-small">立法 / 产权登记</div>
      </div>

      <div class="node node-arbitration">
        <div class="node-circle" style="border-color: #8B7355; width: 64px; height: 64px; font-size: 13px;">仲裁</div>
        <div class="node-label-small">争议解决</div>
      </div>

      <!-- Flow labels -->
      <div class="flow-label" style="top: 62px; left: 270px;">产权流转</div>
      <div class="flow-label" style="top: 445px; left: 215px;">监管</div>
      <div class="flow-label" style="top: 445px; left: 395px;">裁决</div>

      <!-- Encouragement indicator -->
      <div class="encouragement">
        <div class="encouragement-line"></div>
        <div class="encouragement-text">TRANSACTION ENCOURAGED</div>
        <div class="encouragement-line"></div>
      </div>
    </div>

    <!-- Right: Bullet Points -->
    <div class="bullet-panel">
      <div class="bullet-section-label">制度分析要点</div>

      <div class="bullet-item">
        <div class="bullet-marker"></div>
        <div>
          <div class="bullet-text">土地、房屋</div>
          <div class="bullet-subtext">有形财产的具体标的</div>
        </div>
      </div>

      <div class="bullet-item">
        <div class="bullet-marker-square"></div>
        <div>
          <div class="bullet-text">中介参与</div>
          <div class="bullet-subtext">降低信息不对称与交易成本</div>
        </div>
      </div>

      <div class="bullet-item">
        <div class="bullet-marker-diamond"></div>
        <div>
          <div class="bullet-text">政府与仲裁</div>
          <div class="bullet-subtext">产权界定、合同执行、争议裁决</div>
        </div>
      </div>

      <div class="bullet-item">
        <div class="bullet-marker"></div>
        <div>
          <div class="bullet-text">需求方与供应方</div>
          <div class="bullet-subtext">市场两侧的双向匹配</div>
        </div>
      </div>

      <div class="emphasis-box">
        <div class="label">制度特征</div>
        <div class="content">交易是被鼓励的</div>
      </div>
    </div>
  </div>

  <!-- Bottom bar -->
  <div class="bottom-bar"></div>
  <div class="footer">第 03 期 · 商业模式：规则下的具体操作</div>
</div>
</body>
</html>
