

<!DOCTYPE html>
<html lang="zh-CN"><!-- source_hash: 39698bbd5c1fb742 -->
<head>
<meta charset="UTF-8">
<title>「开源之道」·开源的经济学 — 第九期 信息规则与网络经济</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 1600px;
  height: 900px;
  overflow: hidden;
  margin: 0;
}
body {
  background: #F5F0E8;
  font-family: 'Noto Sans SC', sans-serif;
  position: relative;
}

/* Subtle parchment texture */
body::after {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background-image: 
    radial-gradient(circle at 20% 30%, rgba(139,115,85,0.03) 0%, transparent 50%),
    radial-gradient(circle at 80% 70%, rgba(27,59,107,0.02) 0%, transparent 50%);
  pointer-events: none;
  z-index: 100;
}

/* Bauhaus geometric background */
.geo-block-1 {
  position: absolute;
  width: 120px;
  height: 120px;
  background: #1B3B6B;
  opacity: 0.05;
  top: 60px;
  left: 60px;
  z-index: 2;
}

.geo-block-2 {
  position: absolute;
  width: 60px;
  height: 60px;
  background: #8B7355;
  opacity: 0.08;
  top: 200px;
  left: 180px;
  z-index: 2;
}

.geo-circle-bg {
  position: absolute;
  width: 300px;
  height: 300px;
  border-radius: 50%;
  border: 2px solid #1B3B6B;
  opacity: 0.04;
  right: -60px;
  top: 200px;
  z-index: 2;
}

.geo-circle-bg-2 {
  position: absolute;
  width: 180px;
  height: 180px;
  border-radius: 50%;
  background: #1B3B6B;
  opacity: 0.03;
  left: 100px;
  bottom: 120px;
  z-index: 2;
}

/* Deep blue cover panel */
.blue-panel {
  position: absolute;
  top: 120px;
  left: 100px;
  width: 820px;
  height: 560px;
  background: #1B3B6B;
  z-index: 5;
}

/* Gold stamp frame on blue panel */
.gold-frame-outer {
  position: absolute;
  top: 30px;
  left: 30px;
  width: 760px;
  height: 500px;
  border: 2px solid #C9A961;
  opacity: 0.5;
  z-index: 6;
}

/* Gold corner accents */
.gold-corner {
  position: absolute;
  width: 45px;
  height: 45px;
  border-color: #C9A961;
  border-style: solid;
  border-width: 0;
  z-index: 7;
}

.gc-tl { top: 22px; left: 22px; border-top-width: 4px; border-left-width: 4px; }
.gc-tr { top: 22px; right: 22px; border-top-width: 4px; border-right-width: 4px; }
.gc-bl { bottom: 22px; left: 22px; border-bottom-width: 4px; border-left-width: 4px; }
.gc-br { bottom: 22px; right: 22px; border-bottom-width: 4px; border-right-width: 4px; }

/* Content on blue panel */
.panel-content {
  position: absolute;
  top: 120px;
  left: 130px;
  width: 760px;
  z-index: 8;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* Series label */
.series-label {
  font-family: 'Noto Sans SC', sans-serif;
  font-size: 13px;
  letter-spacing: 10px;
  color: #C9A961;
  margin-bottom: 45px;
  opacity: 0.9;
}

/* Main title - gold stamped */
.main-title {
  font-family: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', serif;
  font-size: 88px;
  font-weight: 900;
  color: #C9A961;
  letter-spacing: 10px;
  margin-bottom: 12px;
  line-height: 1.2;
  text-shadow: 
    0 0 2px rgba(201,169,97,0.3),
    0 1px 0 rgba(0,0,0,0.1);
}

.main-title-sub {
  font-family: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', serif;
  font-size: 30px;
  color: #C9A961;
  letter-spacing: 6px;
  opacity: 0.7;
  margin-bottom: 50px;
  font-weight: 400;
}

/* Divider on panel */
.panel-divider {
  width: 80px;
  height: 2px;
  background: #C9A961;
  opacity: 0.6;
  margin-bottom: 40px;
}

/* Lecture info */
.lecture-info {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 18px;
}

.lecture-period {
  font-family: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', serif;
  font-size: 22px;
  color: #F5F0E8;
  letter-spacing: 4px;
  opacity: 0.85;
}

.lecture-name {
  font-family: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', serif;
  font-size: 44px;
  color: #F5F0E8;
  font-weight: 700;
  letter-spacing: 8px;
}

/* Lecture number decorative */
.lecture-num-bg {
  position: absolute;
  top: 180px;
  left: 160px;
  font-family: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', serif;
  font-size: 320px;
  color: #C9A961;
  opacity: 0.04;
  font-weight: 900;
  z-index: 5;
  line-height: 1;
}

/* Network node graph */
.network-graph {
  position: absolute;
  right: 60px;
  top: 100px;
  width: 460px;
  height: 520px;
  z-index: 15;
}

/* Vermillion seal stamp */
.seal-stamp {
  position: absolute;
  bottom: 60px;
  right: 80px;
  width: 130px;
  height: 130px;
  border: 4px solid #C0392B;
  border-radius: 50%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 20;
  transform: rotate(-5deg);
}

.seal-inner {
  width: 100px;
  height: 100px;
  border: 2px solid #C0392B;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
}

.seal-text {
  font-family: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', serif;
  font-size: 22px;
  color: #C0392B;
  font-weight: 900;
  line-height: 1.3;
  letter-spacing: 3px;
  text-align: center;
}

/* Footer */
.footer {
  position: absolute;
  bottom: 50px;
  left: 100px;
  z-index: 20;
  font-family: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', serif;
  font-size: 15px;
  color: #555;
  letter-spacing: 3px;
}

.footer-divider {
  display: inline-block;
  width: 24px;
  height: 1px;
  background: #8B7355;
  vertical-align: middle;
  margin: 0 10px;
}

/* Corner accent lines */
.accent-line-1 {
  position: absolute;
  top: 60px;
  right: 60px;
  width: 150px;
  height: 2px;
  background: #1B3B6B;
  opacity: 0.15;
  z-index: 3;
}

.accent-line-2 {
  position: absolute;
  bottom: 60px;
  left: 100px;
  width: 200px;
  height: 1px;
  background: #8B7355;
  opacity: 0.3;
  z-index: 3;
}

/* Small geometric accents near title */
.small-square {
  position: absolute;
  width: 14px;
  height: 14px;
  background: #C9A961;
  opacity: 0.5;
}

</style>
