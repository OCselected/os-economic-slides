  <div class="kicker">CHAPTER · IV / 第四章</div>
  <h1>光纤如瀑布<br>倾泻而下<span class="accent">——</span>许可的扩散</h1>
  <div class="title-rule"></div>
  <div class="subtitle">互联网时代信息高速传输与全球互联，重塑了开源协作的地理与制度边界。 Cathedral 模式在机构围墙内悄然成型。</div>

  <ul class="points">
    <li><span class="num">01</span>许可与软盘交换——知识仍在物理介质中流转</li>
    <li><span class="num">02</span>许可的出现与流行——制度工具进入开源语境</li>
    <li><span class="num">03</span>协作开始出现在校园和科研机构之间</li>
    <li><span class="num">04</span>主要工作发生地仍然在大型办公场所</li>
    <li><span class="num">05</span>大教堂式的开发模式——分层、分工、自上而下</li>
  </ul>
</div>
