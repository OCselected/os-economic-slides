.dot.small{width:14px;height:14px;opacity:0.7;}

.dot.tiny{width:11px;height:11px;opacity:0.55;}

.dot.orange-glow{width:28px;height:28px;background:#D9601A;box-shadow:0 0 0 5px rgba(217,96,26,0.2),0 0 0 12px rgba(217,96,26,0.1);}

/* Bauhaus geometric accent on visual */
.geo-accent{position:absolute;top:0;right:-40px;width:40px;height:480px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;}
.geo-accent .sq{width:20px;height:20px;background:#1B3B6B;}

.quote-panel{position:absolute;top:150px;left:720px;width:780px;height:640px;display:flex;flex-direction:column;}

.quote-text .em{color:#D9601A;font-weight:600;}
.quote-text .em2{background:linear-gradient(to bottom,transparent 70%,rgba(217,96,26,0.2) 70%);padding:0 2px;}

.quote-divider{width:80px;height:3px;background:#1B3B6B;margin-top:44px;margin-bottom:30px;}
.quote-attr{font-family:'Noto Serif SC',serif;font-size:18px;color:#1B3B6B;font-style:italic;letter-spacing:1px;}
.quote-book{font-size:14px;color:#8B7355;margin-top:8px;letter-spacing:2px;}
.quote-book .book-rule{display:inline-block;width:30px;height:1px;background:#8B7355;vertical-align:middle;margin-right:10px;}

/* Bauhaus decorative elements */
.deco-circle{position:absolute;top:110px;left:690px;width:30px;height:30px;border:2px solid #1B3B6B;border-radius:50%;}
.deco-square{position:absolute;top:140px;left:730px;width:18px;height:18px;background:#D9601A;}

.deco-line-h{position:absolute;bottom:120px;right:60px;width:200px;height:1px;background:#8B7355;}
.deco-circle-2{position:absolute;bottom:100px;right:80px;width:40px;height:40px;background:#1B3B6B;border-radius:50%;}
.deco-square-2{position:absolute;bottom:110px;right:140px;width:14px;height:14px;background:#D9601A;}

  <div class="deco-line-v"></div>

  <div class="deco-square-2"></div>

    <div class="visual-title">万黑丛中一点橙</div>

    <div class="visual-subtitle-en">A Single Spark in the Ecosystem</div>

    <div style="display:flex;gap:30px;align-items:flex-start;">
      <div class="dot-field" id="dotField"></div>
      <div class="geo-accent">

        <div class="sq orange"></div>
        <div class="line"></div>

      从根本上说，开源的成功是一个<span class="em2">政治故事</span>……然而，如果以工业时代的政治经济学逻辑考量的话，这种<span class="em">政治组织</span>就是非常陌生的。

</div>

<script>
(function(){
  var field = document.getElementById('dotField');
  var total = 16 * 16; // 256
  // orange position: row 8 col 9 (center-ish)
  var orangeRow = 8, orangeCol = 8;
  var nearOrangeRows = [7,8,9], nearOrangeCols = [7,8,9,10];

  for(var i=0;i<total;i++){
    var row = Math.floor(i/16);
    var col = i%16;
    var dot = document.createElement('div');
    dot.className = 'dot';

    if(row===orangeRow && col===orangeCol){
      dot.className = 'dot orange-glow';
    } else if(nearOrangeRows.indexOf(row)>=0 && nearOrangeCols.indexOf(col)>=0){
      dot.className = 'dot';
      dot.style.background = '#3A5A80';
      dot.style.opacity = '0.6';
      dot.style.width='15px';
      dot.style.height='15px';
    } else {
      // vary sizes for texture
      var r = (i*7+col*3+row*5)%5;
      if(r===0) dot.className='dot tiny';
      else if(r===1) dot.className='dot small';
      else if(r===2) dot.className='dot med';
      else dot.className='dot';
    }
    field.appendChild(dot);
  }
})();
</script>
