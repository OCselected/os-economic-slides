

<!DOCTYPE html>
<html lang="zh-CN"><!-- source_hash: d5c9fc3c822670bf -->
<head>
<meta charset="UTF-8">
<title>参与开源的动机</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 1600px;
  height: 900px;
  overflow: hidden;
  background: #F5F0E8;
  font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  color: #1B3B6B;
  position: relative;
}

.slide {
  width: 1600px;
  height: 900px;
  position: relative;
  overflow: hidden;
}

/* Background texture overlay */
.slide::before {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 1600px;
  height: 900px;
  background:
    radial-gradient(ellipse at 20% 30%, rgba(27,59,107,0.03) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 70%, rgba(139,115,85,0.04) 0%, transparent 50%);
  pointer-events: none;
  z-index: 0;
}

/* Top accent line */
.top-line {
  position: absolute;
  top: 48px;
  left: 80px;
  width: 80px;
  height: 4px;
  background: #1B3B6B;
}

/* Lecture number */
.lecture-num {
  position: absolute;
  top: 40px;
  left: 180px;
  font-family: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', serif;
  font-size: 18px;
  color: #8B7355;
  letter-spacing: 3px;
}

/* Slide counter */
.slide-counter {
  position: absolute;
  top: 40px;
  right: 80px;
  font-size: 14px;
  color: #8B7355;
  letter-spacing: 2px;
  font-family: 'Noto Serif SC', serif;
}

/* ===== CRUMPLED PAPER VISUAL ===== */
.paper-area {
  position: absolute;
  left: 80px;
  top: 120px;
  width: 560px;
  height: 680px;
}

/* Ball 1 - main crumpled paper */
.ball-main {
  position: absolute;
  left: 60px;
  top: 100px;
  width: 320px;
  height: 320px;
}

.ball-main .facet {
  position: absolute;
  background: #E8E0D4;
  border: 1.5px solid #D4C8B8;
}

.ball-main .f1 {
  width: 130px; height: 130px;
  top: 0; left: 40px;
  transform: rotate(15deg);
  background: #EDE6DB;
}
.ball-main .f2 {
  width: 100px; height: 100px;
  top: 30px; left: 140px;
  transform: rotate(-25deg);
  background: #E4DACC;
}
.ball-main .f3 {
  width: 120px; height: 110px;
  top: 100px; left: 30px;
  transform: rotate(8deg);
  background: #F0EAE0;
}
.ball-main .f4 {
  width: 90px; height: 90px;
  top: 120px; left: 160px;
  transform: rotate(35deg);
  background: #DFD4C2;
}
.ball-main .f5 {
  width: 110px; height: 100px;
  top: 180px; left: 50px;
  transform: rotate(-12deg);
  background: #E8E0D4;
}
.ball-main .f6 {
  width: 80px; height: 80px;
  top: 200px; left: 170px;
  transform: rotate(20deg);
  background: #E2D8C8;
}

/* Ball 2 - smaller */
.ball-small {
  position: absolute;
  left: 300px;
  top: 380px;
  width: 180px;
  height: 180px;
}

.ball-small .facet {
  position: absolute;
  background: #E4DACC;
  border: 1.5px solid #D4C8B8;
}

.ball-small .f1 {
  width: 75px; height: 75px;
  top: 0; left: 20px;
  transform: rotate(-20deg);
  background: #EDE6DB;
}
.ball-small .f2 {
  width: 60px; height: 60px;
  top: 15px; left: 80px;
  transform: rotate(30deg);
  background: #E0D5C4;
}
.ball-small .f3 {
  width: 70px; height: 65px;
  top: 60px; left: 10px;
  transform: rotate(10deg);
  background: #EAE2D5;
}
.ball-small .f4 {
  width: 55px; height: 55px;
  top: 80px; left: 90px;
  transform: rotate(-15deg);
  background: #D8CCB8;
}
.ball-small .f5 {
  width: 65px; height: 60px;
  top: 110px; left: 30px;
  transform: rotate(25deg);
  background: #E4DACC;
}

/* Ball 3 - tiny */
.ball-tiny {
  position: absolute;
  left: 100px;
  top: 480px;
  width: 90px;
  height: 90px;
}

.ball-tiny .facet {
  position: absolute;
  background: #E4DACC;
  border: 1.5px solid #D4C8B8;
}

.ball-tiny .f1 {
  width: 40px; height: 40px;
  top: 0; left: 10px;
  transform: rotate(15deg);
  background: #EDE6DB;
}
.ball-tiny .f2 {
  width: 35px; height: 35px;
  top: 10px; left: 40px;
  transform: rotate(-20deg);
  background: #E0D5C4;
}
.ball-tiny .f3 {
  width: 38px; height: 35px;
  top: 35px; left: 5px;
  transform: rotate(5deg);
  background: #E8E0D4;
}
.ball-tiny .f4 {
  width: 32px; height: 32px;
  top: 45px; left: 40px;
  transform: rotate(30deg);
  background: #D8CCB8;
}

/* Scattered lines suggesting scribbles/cross-outs */
.scribble-line {
  position: absolute;
  background: #8B7355;
  opacity: 0.35;
}

.sl1 { width: 60px; height: 1px; top: 280px; left: 220px; transform: rotate(25deg); }
.sl2 { width: 40px; height: 1px; top: 300px; left: 250px; transform: rotate(-15deg); }
.sl3 { width: 50px; height: 1px; top: 420px; left: 160px; transform: rotate(40deg); }
.sl4 { width: 35px; height: 1px; top: 520px; left: 280px; transform: rotate(-30deg); }
.sl5 { width: 45px; height: 1px; top: 580px; left: 200px; transform: rotate(10deg); }

/* Geometric accents */
.geo-circle {
  position: absolute;
  border-radius: 50%;
  background: #1B3B6B;
  opacity: 0.08;
}

.geo-circle-1 { width: 200px; height: 200px; top: 200px; left: 380px; }
.geo-circle-2 { width: 80px; height: 80px; top: 450px; left: 200px; opacity: 0.05; }
.geo-circle-3 { width: 50px; height: 50px; top: 350px; left: 420px; opacity: 0.06; }

.geo-square {
  position: absolute;
  background: #1B3B6B;
  opacity: 0.05;
}

.geo-square-1 { width: 60px; height: 60px; top: 580px; left: 360px; }
.geo-square-2 { width: 40px; height: 40px; top: 180px; left: 500px; opacity: 0.04; }

/* Copper accent bar */
.copper-bar {
  position: absolute;
  top: 600px;
  left: 80px;
  width: 3px;
  height: 180px;
  background: #8B7355;
}

/* ===== RIGHT SIDE CONTENT ===== */
.content-area {
  position: absolute;
  right: 80px;
  top: 120px;
  width: 720px;
  height: 680px;
}

.section-label {
  font-family: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', serif;
  font-size: 14px;
  color: #8B7355;
  letter-spacing: 4px;
  margin-bottom: 16px;
  text-transform: uppercase;
}

.slide-title {
  font-family: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', serif;
  font-size: 42px;
  color: #1B3B6B;
  font-weight: 700;
  line-height: 1.3;
  margin-bottom: 8px;
}

.slide-subtitle {
  font-family: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', serif;
  font-size: 18px;
  color: #8B7355;
  font-weight: 400;
  line-height: 1.5;
  margin-bottom: 36px;
  font-style: italic;
}

.divider-line {
  width: 60px;
  height: 3px;
  background: #1B3B6B;
  margin-bottom: 32px;
}

.motivations {
  list-style: none;
}

.motivations li {
  position: relative;
  padding-left: 32px;
  margin-bottom: 18px;
  font-size: 19px;
  line-height: 1.6;
  color: #1B3B6B;
}

.motivations li::before {
  content: '';
  position: absolute;
  left: 0;
  top: 9px;
  width: 14px;
  height: 14px;
  border: 2px solid #1B3B6B;
}

.motivations li.copper::before {
  background: #1B3B6B;
}

.motivations li.accent::before {
  width: 14px;
  height: 14px;
  background: #8B7355;
  border: 2px solid #8B7355;
}

.motivations li em {
  font-style: italic;
  color: #8B7355;
  font-family: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', serif;
  font-size: 15px;
  display: block;
  margin-top: 2px;
  opacity: 0.8;
}

/* Bottom Bauhaus geometric composition */
.bottom-geo {
  position: absolute;
  bottom: 60px;
  right: 80px;
  width: 200px;
  height: 60px;
}

.bottom-geo .shape {
  position: absolute;
}

.bg-circle {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: #1B3B6B;
  opacity: 0.12;
  right: 0;
  top: 12px;
}

.bg-square {
  width: 36px;
  height: 36px;
  background: #8B7355;
  opacity: 0.15;
  right: 50px;
  top: 12px;
}

.bg-line {
  width: 50px;
  height: 2px;
  background: #1B3B6B;
  opacity: 0.2;
  left: 0;
  top: 30px;
}

.bg-triangle {
  width: 0;
  height: 0;
  border-left: 18px solid transparent;
  border-right: 18px solid transparent;
  border-bottom: 30px solid #1B3B6B;
  opacity: 0.1;
  left: 60px;
  top: 6px;
}

/* Footer */
.footer {
  position: absolute;
  bottom: 24px;
  left: 80px;
  font-size: 12px;
  color: #8B7355;
  letter-spacing: 2px;
  font-family: 'Noto Serif SC', serif;
}

.footer .dot {
  display: inline-block;
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: #8B7355;
  vertical-align: middle;
  margin: 0 8px;
  opacity: 0.6;
}

/* Large index number as watermark */
.index-num {
  position: absolute;
  left: 60px;
  bottom: 60px;
  font-family: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', serif;
  font-size: 160px;
  color: #1B3B6B;
  opacity: 0.04;
  font-weight: 700;
  line-height: 1;
}
</style>
</head>
<body>
<div class="slide">

  <!-- Top header -->
  <div class="top-line"></div>
  <div class="lecture-num">第 04 期 · 软件开发劳动力市场</div>
  <div class="slide-counter">10 / 26</div>

  <!-- Crumpled paper area -->
  <div class="paper-area">
    <div class="ball-main">
      <div class="facet f1"></div>
      <div class="facet f2"></div>
      <div class="facet f3"></div>
      <div class="facet f4"></div>
      <div class="facet f5"></div>
      <div class="facet f6"></div>
    </div>
    <div class="ball-small">
      <div class="facet f1"></div>
      <div class="facet f2"></div>
      <div class="facet f3"></div>
      <div class="facet f4"></div>
      <div class="facet f5"></div>
    </div>
    <div class="ball-tiny">
      <div class="facet f1"></div>
      <div class="facet f2"></div>
      <div class="facet f3"></div>
      <div class="facet f4"></div>
    </div>

    <!-- Scribble lines -->
    <div class="scribble-line sl1"></div>
    <div class="scribble-line sl2"></div>
    <div class="scribble-line sl3"></div>
    <div class="scribble-line sl4"></div>
    <div class="scribble-line sl5"></div>

    <!-- Geometric accents -->
    <div class="geo-circle geo-circle-1"></div>
    <div class="geo-circle geo-circle-2"></div>
    <div class="geo-circle geo-circle-3"></div>
    <div class="geo-square geo-square-1"></div>
    <div class="geo-square geo-square-2"></div>

    <!-- Copper accent bar -->
    <div class="copper-bar"></div>
  </div>

  <!-- Large index watermark -->
  <div class="index-num">10</div>

  <!-- Content area -->
  <div class="content-area">
    <div class="section-label">MOTIVATIONS</div>
    <div class="slide-title">参与开源的动机</div>
    <div class="slide-subtitle">揉皱的纸团——被废弃的灵感与反复修改</div>
    <div class="divider-line"></div>

    <ul class="motivations">
      <li class="copper">学习技能，积累实践经验</li>
      <li class="accent">解决自身面临的问题</li>
      <li>获得声誉或社会资本</li>
      <li>炫技，展示技术能力</li>
      <li>寻找认可与工作机会</li>
      <li class="copper">匠人精神，黑客文化——<em>以解决问题本身为 Fun</em></li>
      <li>道德诉求与社会公平</li>
    </ul>
  </div>

  <!-- Bottom Bauhaus geometric composition -->
  <div class="bottom-geo">
    <div class="shape bg-circle"></div>
    <div class="shape bg-square"></div>
    <div class="shape bg-line"></div>
    <div class="shape bg-triangle"></div>
  </div>

  <!-- Footer -->
  <div class="footer">
    开源经济学讲座 <span class="dot"></span> 第 04 期
  </div>

</div>
</body>
</html>
