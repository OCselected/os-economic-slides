

<!DOCTYPE html>
<html lang="zh-CN"><!-- source_hash: cca11d75394bb576 -->
<head>
<meta charset="UTF-8">
<title>Business is just business</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 1600px;
  height: 900px;
  overflow: hidden;
  margin: 0;
  background: #F5F0E8;
  font-family: 'Noto Sans SC', 'Source Han Sans SC', sans-serif;
  color: #1B3B6B;
  position: relative;
}

/* Subtle parchment texture */
body::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: 
    repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(139,115,85,0.01) 2px, rgba(139,115,85,0.01) 4px),
    repeating-linear-gradient(90deg, transparent, transparent 3px, rgba(139,115,85,0.008) 3px, rgba(139,115,85,0.008) 5px);
  pointer-events: none;
  z-index: 0;
}

/* Header area */
.header {
  position: absolute;
  top: 50px;
  left: 80px;
  display: flex;
  align-items: baseline;
  gap: 24px;
}

.lecture-num {
  font-family: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', serif;
  font-size: 14px;
  color: #8B7355;
  letter-spacing: 2px;
  text-transform: uppercase;
}

.divider-line {
  width: 60px;
  height: 1px;
  background: #8B7355;
}

.header-sub {
  font-size: 12px;
  color: #8B7355;
  letter-spacing: 1px;
}

/* Main content area */
.content-left {
  position: absolute;
  top: 120px;
  left: 80px;
  width: 720px;
}

.main-title {
  font-family: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', serif;
  font-size: 52px;
  font-weight: 700;
  color: #1B3B6B;
  line-height: 1.2;
  margin-bottom: 12px;
}

.subtitle-cn {
  font-family: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', serif;
  font-size: 18px;
  color: #8B7355;
  margin-bottom: 50px;
  letter-spacing: 1px;
}

.list-container {
  position: relative;
}

.list-item {
  display: flex;
  align-items: flex-start;
  margin-bottom: 18px;
  gap: 16px;
}

.list-marker {
  flex-shrink: 0;
  width: 10px;
  height: 10px;
  margin-top: 8px;
}

.marker-square {
  background: #1B3B6B;
}

.marker-circle {
  background: #1B3B6B;
  border-radius: 50%;
}

.marker-line {
  width: 14px;
  height: 2px;
  background: #8B7355;
  margin-top: 14px;
}

.list-text {
  font-family: 'Noto Sans SC', 'Source Han Sans SC', sans-serif;
  font-size: 19px;
  line-height: 1.6;
  color: #333;
}

.list-text .keyword {
  font-family: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', serif;
  font-weight: 600;
  color: #1B3B6B;
}

/* Right visual area */
.visual-area {
  position: absolute;
  top: 100px;
  right: 80px;
  width: 620px;
  height: 700px;
}

/* Key visual */
.key-group {
  position: absolute;
  top: 60px;
  left: 40px;
}

.key-bow {
  width: 100px;
  height: 100px;
  border-radius: 50%;
  border: 8px solid #1B3B6B;
  position: relative;
  margin-left: 60px;
}

.key-bow-inner {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: #F5F0E8;
  border: 4px solid #1B3B6B;
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
}

.key-shaft {
  width: 14px;
  height: 180px;
  background: #1B3B6B;
  margin-left: 103px;
  margin-top: -4px;
  position: relative;
}

.key-notch1 {
  position: absolute;
  right: -8px;
  top: 40px;
  width: 22px;
  height: 14px;
  background: #1B3B6B;
}

.key-notch2 {
  position: absolute;
  right: -14px;
  top: 75px;
  width: 28px;
  height: 14px;
  background: #1B3B6B;
}

.key-notch3 {
  position: absolute;
  right: -6px;
  top: 110px;
  width: 18px;
  height: 12px;
  background: #1B3B6B;
}

/* Door frame */
.door-group {
  position: absolute;
  top: 300px;
  left: 120px;
  width: 220px;
  height: 320px;
}

.door-frame {
  width: 200px;
  height: 300px;
  border: 6px solid #1B3B6B;
  border-radius: 100px 100px 0 0;
  position: relative;
  margin-left: 10px;
}

.door-frame::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 6px;
  background: #1B3B6B;
}

/* Heart house inside the door */
.heart-house {
  position: absolute;
  bottom: 50px;
  left: 50%;
  transform: translateX(-50%);
  width: 140px;
  height: 160px;
}

.house-body {
  width: 140px;
  height: 100px;
  background: #8B7355;
  margin: 0 auto;
  position: relative;
}

.house-roof {
  width: 0;
  height: 0;
  border-left: 80px solid transparent;
  border-right: 80px solid transparent;
  border-bottom: 60px solid #1B3B6B;
  margin: 0 auto;
  margin-bottom: -4px;
  position: relative;
}

.heart-shape {
  position: absolute;
  top: 25px;
  left: 50%;
  transform: translateX(-50%);
  width: 50px;
  height: 46px;
}

.heart-left {
  position: absolute;
  top: 0;
  left: 0;
  width: 25px;
  height: 40px;
  background: #F5F0E8;
  border-radius: 25px 25px 0 0;
  transform: rotate(-45deg);
}

.heart-right {
  position: absolute;
  top: 0;
  right: 0;
  width: 25px;
  height: 40px;
  background: #F5F0E8;
  border-radius: 25px 25px 0 0;
  transform: rotate(45deg);
}

.heart-bottom {
  position: absolute;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 0;
  height: 0;
  border-left: 22px solid transparent;
  border-right: 22px solid transparent;
  border-top: 30px solid #F5F0E8;
}

/* Lock on door */
.door-lock {
  position: absolute;
  right: 20px;
  top: 160px;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #8B7355;
  border: 2px solid #1B3B6B;
}

/* Decorative geometric elements */
.deco-circle-large {
  position: absolute;
  width: 300px;
  height: 300px;
  border-radius: 50%;
  border: 2px solid rgba(27, 59, 107, 0.08);
  top: -50px;
  right: -80px;
}

.deco-square-1 {
  position: absolute;
  width: 80px;
  height: 80px;
  background: rgba(27, 59, 107, 0.06);
  bottom: 30px;
  left: 20px;
}

.deco-square-2 {
  position: absolute;
  width: 40px;
  height: 40px;
  border: 2px solid rgba(139, 115, 85, 0.2);
  top: 40px;
  right: 60px;
  transform: rotate(45deg);
}

.deco-line-h {
  position: absolute;
  bottom: 50px;
  left: 80px;
  width: 1440px;
  height: 1px;
  background: rgba(139, 115, 85, 0.2);
}

.deco-line-v {
  position: absolute;
  top: 100px;
  left: 620px;
  width: 1px;
  height: 700px;
  background: rgba(27, 59, 107, 0.08);
}

/* Footer */
.footer {
  position: absolute;
  bottom: 20px;
  left: 80px;
  right: 80px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.footer-left {
  font-size: 11px;
  color: #8B7355;
  letter-spacing: 1px;
}

.footer-right {
  font-size: 11px;
  color: #8B7355;
  letter-spacing: 1px;
}

/* Connecting elements between key and door */
.chain-dots {
  position: absolute;
  top: 270px;
  left: 168px;
}

.chain-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #8B7355;
  margin-bottom: 12px;
}

/* Bottom decorative bar */
.bottom-bar {
  position: absolute;
  bottom: 60px;
  left: 80px;
  display: flex;
  align-items: center;
  gap: 12px;
}

.bottom-bar .bar-segment {
  width: 40px;
  height: 4px;
  background: #1B3B6B;
}

.bottom-bar .bar-segment.thin {
  width: 20px;
  height: 2px;
  background: #8B7355;
}

.bottom-bar .bar-segment.short {
  width: 12px;
  height: 2px;
  background: #8B7355;
}

/* Label for metaphor */
.metaphor-label {
  position: absolute;
  bottom: 80px;
  right: 100px;
  font-family: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', serif;
  font-size: 13px;
  color: #8B7355;
  font-style: italic;
  text-align: right;
  line-height: 1.6;
  max-width: 260px;
}

/* Value indicators near heart house */
.value-arrow {
  position: absolute;
  width: 60px;
  height: 2px;
  background: #8B7355;
}

.value-arrow::after {
  content: '';
  position: absolute;
  right: 0;
  top: -4px;
  width: 0;
  height: 0;
  border-top: 5px solid transparent;
  border-bottom: 5px solid transparent;
  border-left: 8px solid #8B7355;
}

.arrow-1 {
  top: 360px;
  left: 340px;
}

.arrow-2 {
  top: 400px;
  left: 360px;
}

.arrow-3 {
  top: 440px;
  left: 380px;
}

.value-label {
  position: absolute;
  font-size: 12px;
  color: #8B7355;
  font-family: 'Noto Sans SC', sans-serif;
  letter-spacing: 1px;
}

.label-1 { top: 350px; left: 410px; }
.label-2 { top: 390px; left: 430px; }
.label-3 { top: 430px; left: 450px; }

/* Large decorative circle behind visual */
.bg-circle {
  position: absolute;
  width: 380px;
  height: 380px;
  border-radius: 50%;
  border: 1px solid rgba(27, 59, 107, 0.06);
  top: 120px;
  left: 120px;
}

.bg-circle-2 {
  position: absolute;
  width: 250px;
  height: 250px;
  border-radius: 50%;
  background: rgba(139, 115, 85, 0.03);
  top: 200px;
  left: 185px;
}

/* Page number */
.page-num {
  position: absolute;
  bottom: 20px;
  right: 80px;
  font-family: 'Noto Serif SC', serif;
  font-size: 12px;
  color: #8B7355;
}
</style>
</head>

<div class="footer">
