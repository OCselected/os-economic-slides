

<!DOCTYPE html>
<html lang="zh-CN"><!-- source_hash: b5464da3f99bac3f -->
<head>
<meta charset="UTF-8">
<title>第 03 期 · 商业模式：规则下的具体操作</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 1600px;
  height: 900px;
  overflow: hidden;
  margin: 0;
  background: #F5F0E8;
}
body {
  position: relative;
  font-family: 'Noto Sans SC', 'PingFang SC', sans-serif;
  color: #1B3B6B;
}

/* Subtle parchment texture */
.parchment-overlay {
  position: absolute;
  top: 0; left: 0;
  width: 1600px; height: 900px;
  background: 
    radial-gradient(ellipse at 20% 30%, rgba(139,115,85,0.03) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 70%, rgba(27,59,107,0.02) 0%, transparent 50%);
  pointer-events: none;
}

/* Geometric decorations */
.deco-circle-large {
  position: absolute;
  width: 400px; height: 400px;
  border-radius: 50%;
  border: 1.5px solid rgba(139,115,85,0.15);
  top: -80px; right: -120px;
}
.deco-circle-small {
  position: absolute;
  width: 120px; height: 120px;
  border-radius: 50%;
  background: rgba(139,115,85,0.06);
  bottom: 80px; left: 100px;
}
.deco-square-rotated {
  position: absolute;
  width: 60px; height: 60px;
  border: 1.5px solid rgba(27,59,107,0.12);
  transform: rotate(45deg);
  top: 120px; left: 80px;
}
.deco-line-h {
  position: absolute;
  height: 1px;
  background: rgba(139,115,85,0.2);
  top: 100px;
  left: 60px;
  width: 200px;
}
.deco-line-v {
  position: absolute;
  width: 1px;
  background: rgba(27,59,107,0.1);
  bottom: 60px;
  right: 200px;
  height: 150px;
}
.deco-line-v2 {
  position: absolute;
  width: 1px;
  background: rgba(139,115,85,0.15);
  bottom: 40px;
  right: 160px;
  height: 100px;
}

/* Header area */
.header {
  position: absolute;
  top: 48px;
  left: 80px;
  right: 80px;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
}
.header-left {
  max-width: 600px;
}
.slide-counter {
  font-size: 13px;
  letter-spacing: 2px;
  color: #8B7355;
  text-transform: uppercase;
  margin-bottom: 12px;
  font-weight: 300;
}
.main-title {
  font-family: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', serif;
  font-size: 36px;
  font-weight: 700;
  color: #1B3B6B;
  line-height: 1.3;
  letter-spacing: 1px;
}
.subtitle {
  font-size: 14px;
  color: #8B7355;
  margin-top: 10px;
  letter-spacing: 1px;
  font-weight: 300;
}

/* Central visual metaphor: Blue cup with colorful straws */
.visual-container {
  position: absolute;
  top: 200px;
  left: 80px;
  width: 520px;
  height: 600px;
  display: flex;
  align-items: flex-end;
  justify-content: center;
}
.cup-group {
  position: relative;
  width: 280px;
  height: 480px;
}

/* The cup - a blue cylinder/rank */
.cup-body {
  position: absolute;
  bottom: 0;
  left: 50px;
  width: 180px;
  height: 200px;
  background: #1B3B6B;
  border-radius: 4px 4px 12px 12px;
}
.cup-rim {
  position: absolute;
  bottom: 196px;
  left: 42px;
  width: 196px;
  height: 14px;
  background: #234a80;
  border-radius: 7px;
}

/* Straws - colorful sticks emerging from cup */
.straw {
  position: absolute;
  bottom: 180px;
  width: 8px;
  border-radius: 4px;
  transform-origin: bottom center;
}
.straw-1 {
  left: 70px;
  height: 220px;
  background: #C4553B;
  transform: rotate(-18deg);
}
.straw-2 {
  left: 95px;
  height: 260px;
  background: #D4944A;
  transform: rotate(-8deg);
}
.straw-3 {
  left: 120px;
  height: 290px;
  background: #4A8B6B;
  transform: rotate(-2deg);
}
.straw-4 {
  left: 145px;
  height: 270px;
  background: #8B5A8B;
  transform: rotate(4deg);
}
.straw-5 {
  left: 170px;
  height: 240px;
  background: #B8860B;
  transform: rotate(12deg);
}
.straw-6 {
  left: 195px;
  height: 210px;
  background: #3A6B8B;
  transform: rotate(20deg);
}

/* Straw tops - circles */
.straw-top {
  position: absolute;
  width: 12px;
  height: 12px;
  border-radius: 50%;
}
.straw-top-1 { top: -6px; left: -2px; background: #C4553B; }
.straw-top-2 { top: -6px; left: -2px; background: #D4944A; }
.straw-top-3 { top: -6px; left: -2px; background: #4A8B6B; }
.straw-top-4 { top: -6px; left: -2px; background: #8B5A8B; }
.straw-top-5 { top: -6px; left: -2px; background: #B8860B; }
.straw-top-6 { top: -6px; left: -2px; background: #3A6B8B; }

/* Geometric accents around the cup */
.accent-dot-1 {
  position: absolute;
  width: 14px; height: 14px;
  border-radius: 50%;
  background: #C4553B;
  top: 40px;
  right: 20px;
}
.accent-square-1 {
  position: absolute;
  width: 20px; height: 20px;
  background: #4A8B6B;
  bottom: 100px;
  right: 0;
}
.accent-line-1 {
  position: absolute;
  width: 60px;
  height: 2px;
  background: #D4944A;
  top: 80px;
  left: 0;
}
.accent-line-2 {
  position: absolute;
  width: 2px;
  height: 40px;
  background: #8B5A8B;
  bottom: 60px;
  left: 10px;
}

/* Right content panel */
.content-panel {
  position: absolute;
  top: 190px;
  left: 680px;
  right: 80px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.panel-label {
  font-size: 12px;
  letter-spacing: 3px;
  color: #8B7355;
  text-transform: uppercase;
  margin-bottom: 8px;
  font-weight: 400;
}
.panel-title {
  font-family: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', serif;
  font-size: 28px;
  font-weight: 700;
  color: #1B3B6B;
  margin-bottom: 36px;
  line-height: 1.4;
  letter-spacing: 0.5px;
}
.divider {
  width: 60px;
  height: 3px;
  background: #1B3B6B;
  margin-bottom: 32px;
}

.question-item {
  display: flex;
  align-items: flex-start;
  margin-bottom: 22px;
}
.q-number {
  font-family: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', serif;
  font-size: 16px;
  font-weight: 700;
  color: #8B7355;
  min-width: 32px;
  padding-top: 2px;
  letter-spacing: 1px;
}
.q-text {
  font-size: 17px;
  line-height: 1.7;
  color: #1B3B6B;
  font-weight: 400;
}
.q-highlight {
  color: #C4553B;
  font-weight: 600;
}

/* Bottom bar */
.bottom-bar {
  position: absolute;
  bottom: 36px;
  left: 80px;
  right: 80px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.bottom-left {
  display: flex;
  align-items: center;
  gap: 12px;
}
.bottom-line {
  width: 40px;
  height: 1px;
  background: #8B7355;
}
.bottom-text {
  font-size: 12px;
  color: #8B7355;
  letter-spacing: 1.5px;
}
.bottom-right {
  font-size: 12px;
  color: #8B7355;
  letter-spacing: 1.5px;
  font-weight: 300;
}

/* Decorative triangle */
.deco-triangle {
  position: absolute;
  bottom: 140px;
  left: 50px;
  width: 0;
  height: 0;
  border-left: 20px solid transparent;
  border-right: 20px solid transparent;
  border-bottom: 34px solid rgba(139,115,85,0.12);
}
</style>
</head>
<body>

<div class="parchment-overlay"></div>

<!-- Geometric background decorations -->
<div class="deco-circle-large"></div>
<div class="deco-circle-small"></div>
<div class="deco-square-rotated"></div>
<div class="deco-line-h"></div>
<div class="deco-line-v"></div>
<div class="deco-line-v2"></div>

<!-- Header -->
<div class="header">
  <div class="header-left">
    <div class="slide-counter">Lecture 03 · 商业模式</div>
    <div class="main-title">规则下的具体操作</div>
    <div class="subtitle">包豪斯几何构成（Bauhaus geometric composition）</div>
  </div>
</div>

<!-- Central Visual Metaphor: Blue Cup with Colorful Straws -->
<div class="visual-container">
  <div class="cup-group">
    <!-- Straws with tops -->
    <div class="straw straw-1">
      <div class="straw-top straw-top-1"></div>
    </div>
    <div class="straw straw-2">
      <div class="straw-top straw-top-2"></div>
    </div>
    <div class="straw straw-3">
      <div class="straw-top straw-top-3"></div>
    </div>
    <div class="straw straw-4">
      <div class="straw-top straw-top-4"></div>
    </div>
    <div class="straw straw-5">
      <div class="straw-top straw-top-5"></div>
    </div>
    <div class="straw straw-6">
      <div class="straw-top straw-top-6"></div>
    </div>

    <!-- Cup -->
    <div class="cup-rim"></div>
    <div class="cup-body"></div>

    <!-- Accent elements -->
    <div class="accent-dot-1"></div>
    <div class="accent-square-1"></div>
    <div class="accent-line-1"></div>
    <div class="accent-line-2"></div>
  </div>
</div>

<div class="deco-triangle"></div>

<!-- Right Content Panel -->
<div class="content-panel">
  <div class="panel-label">本期核心问题</div>
  <div class="panel-title">价值捕获与分配的重构</div>
  <div class="divider"></div>

  <div class="question-item">
    <div class="q-number">01</div>
    <div class="q-text">当许可费被放弃，<span class="q-highlight">价值如何被捕获？</span></div>
  </div>
  <div class="question-item">
    <div class="q-number">02</div>
    <div class="q-text">Red Hat、MySQL、WordPress 的案例<br>告诉我们什么？</div>
  </div>
  <div class="question-item">
    <div class="q-number">03</div>
    <div class="q-text">商业模式的本质：在开源规则框架下，<br><span class="q-highlight">重新设计价值的分配方式</span></div>
  </div>
</div>

<!-- Bottom bar -->
<div class="bottom-bar">
  <div class="bottom-left">
    <div class="bottom-line"></div>
    <div class="bottom-text">开源之道 · 新制度经济学视角</div>
  </div>
  <div class="bottom-right">03 / 30</div>
</div>

</body>
</html>
