  <div class="slide-title">平台即<em>闸门</em>：谁掌控开源的<em>基础设施</em>？</div>
</div>

<div class="left-col">
  <div class="col-label">— 表层叙事 —</div>
  <p class="bullet">GitHub 让开源协作变得前所未有的简单：<strong>fork、PR、review</strong> 一键完成</p>
  <p class="bullet">但平台的"便利性"背后是对<em>生产资料的控制</em></p>
  <p class="bullet">代码仓库平台在开源世界中占据了"<strong>基础设施管理者</strong>"的位置</p>
</div>

<div class="right-col">
  <div class="col-label">— 深层结构 —</div>
  <p class="bullet">这与云厂商的问题<strong>同构</strong>：谁拥有生产资料，谁就拥有<em>分配权</em></p>
  <p class="bullet">与第6期 Williamson OLR 框架呼应：GitHub 是 <strong>R（规则）层面</strong>的制度装置</p>
  <p class="bullet">同时是 <strong>O（组织）层面</strong>的权力集中——平台取代了部分社区治理功能</p>
</div>
