

<!DOCTYPE html><html><head><meta charset="UTF-8"><title>第11期：文化作为不可替代的驱动力</title><style>
*{margin:0;padding:0;box-sizing:border-box}

.parchment{position:absolute;top:0;left:0;width:1600px;height:900px;background:#F5F0E8}

.square-accent-2{position:absolute;top:560px;left:155px;width:60px;height:60px;background:#F5F0E8;border:3px solid #1B3B6B}

.h-bar{position:absolute;top:640px;left:60px;width:500px;height:4px;background:#1B3B6B}
.v-bar{position:absolute;top:40px;left:60px;width:4px;height:50px;background:#8B7355}

.divider{width:120px;height:3px;background:#1B3B6B;margin-bottom:36px}
.divider-thin{width:120px;height:1px;background:#8B7355;margin-bottom:36px}

.bullets{list-style:none;padding:0;margin:0}
.bullets li{font-family:'Noto Serif SC',serif;font-size:22px;line-height:1.9;color:#1B3B6B;padding-left:36px;position:relative;letter-spacing:1px;font-weight:400}
.bullets li::before{content:'';position:absolute;left:0;top:16px;width:16px;height:2px;background:#8B7355}

.bullets li:nth-child(4)::before{top:17px;width:22px;height:2px}

.sparkle{position:absolute;background:#1B3B6B;border-radius:50%}

/* Vertical accent line right */
.v-accent{position:absolute;top:110px;right:70px;width:2px;height:750px;background:#1B3B6B;opacity:0.1}

/* Geometric triangle accent */
.triangle{position:absolute;top:600px;left:240px;width:0;height:0;border-left:30px solid transparent;border-right:30px solid transparent;border-bottom:52px solid #8B7355}
