

<!DOCTYPE html><html><head><meta charset="UTF-8"><title>第2期：软件开发劳动力市场</title><style>

/* main title area */
.title-block{position:absolute;top:120px;left:80px;width:720px;z-index:10}
.main-title{font-family:'Noto Serif SC','Source Han Serif SC','Songti SC',serif;font-size:60px;font-weight:700;color:#1B3B6B;line-height:1.15;letter-spacing:2px}
.main-subtitle{font-family:'Noto Serif SC',serif;font-size:22px;color:#8B7355;margin-top:20px;letter-spacing:6px;font-weight:500}
.title-rule{width:120px;height:3px;background:#1B3B6B;margin-top:28px}
/* question list */
.questions{position:absolute;top:410px;left:80px;width:720px;z-index:10}
.q-title{font-family:'Noto Serif SC',serif;font-size:18px;color:#1B3B6B;letter-spacing:4px;margin-bottom:28px;font-weight:600}
.q-item{display:flex;align-items:baseline;gap:20px;margin-bottom:22px}
.q-num{font-family:'Noto Serif SC',serif;font-size:16px;color:#8B7355;min-width:36px;letter-spacing:2px}
.q-text{font-size:18px;color:#1B3B6B;line-height:1.6;font-weight:400;letter-spacing:0.5px}
.q-dot{width:6px;height:6px;background:#8B7355;display:inline-block;margin-right:14px;transform:translateY(-3px)}
/* globe visual */
.globe-wrap{position:absolute;top:90px;right:60px;width:760px;height:760px;z-index:5}
.globe-canvas{width:760px;height:760px;position:absolute;top:0;left:0}
/* bottom bar */
.bottom-bar{position:absolute;bottom:40px;left:80px;right:80px;display:flex;justify-content:space-between;align-items:center;z-index:10}
.bottom-left{display:flex;align-items:center;gap:16px}
.bottom-square{width:10px;height:10px;background:#1B3B6B}

/* bauhaus decorative elements */
.deco-circle-1{position:absolute;top:-60px;right:-60px;width:200px;height:200px;border:2px solid #1B3B6B;opacity:0.15;border-radius:50%;z-index:1}
.deco-square-1{position:absolute;bottom:60px;right:380px;width:24px;height:24px;background:#8B7355;opacity:0.4;z-index:6}
.deco-line-1{position:absolute;top:60px;left:80px;width:1px;height:50px;background:#1B3B6B;opacity:0.3;z-index:2}
.deco-line-2{position:absolute;bottom:60px;left:80px;width:1px;height:50px;background:#1B3B6B;opacity:0.3;z-index:2}
</style></head><body>
<div class="slide">
  <div class="deco-circle-1"></div>
  <div class="deco-line-1"></div>
  <div class="deco-line-2"></div>
  <div class="deco-square-1"></div>

  <div class="top-bar">
    <div style="display:flex;align-items:center;gap:20px">
      <span class="series-line"></span>
      <span class="series-num">NEW INSTITUTE OF OPEN SOURCE ECONOMICS</span>
    </div>
    <span class="series-meta">EPISODE · 02</span>
  </div>

  <div class="title-block">
    <div class="main-title">软件开发<br>劳动力市场</div>
    <div class="main-subtitle">SOFTWARE LABOR MARKET</div>
    <div class="title-rule"></div>
  </div>

  <div class="questions">
    <div class="q-title">—— 核心追问 ——</div>
    <div class="q-item">
      <span class="q-num">01</span>
      <span class="q-text"><span class="q-dot"></span>是什么激励着开源开发者？</span>
    </div>
    <div class="q-item">
      <span class="q-num">02</span>

    <div class="q-item">
      <span class="q-num">04</span>
      <span class="q-text"><span class="q-dot"></span>马斯洛的金字塔模型能解释吗？</span>

    <div class="q-item">

  <div class="globe-wrap">
    <canvas class="globe-canvas" id="globeCanvas" width="760" height="760"></canvas>
  </div>

  <div class="bottom-bar">
    <div class="bottom-left">
      <span class="bottom-square"></span>
      <span class="bottom-text">LABOR · INCENTIVE · GOVERNANCE</span>
    </div>
    <span class="bottom-right">第 02 期 / 12 · 劳动力市场</span>
  </div>
</div>

<script>
(function(){
  const cvs = document.getElementById('globeCanvas');
  const ctx = cvs.getContext('2d');
  const W = 760, H = 760;
  const cx = W/2, cy = H/2;
  const R = 280;

  function draw(){
    ctx.clearRect(0,0,W,H);

    // outer faint ring
    ctx.beginPath();
    ctx.arc(cx,cy,R+30,0,Math.PI*2);
    ctx.strokeStyle='rgba(27,59,107,0.08)';
    ctx.lineWidth=1;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(cx,cy,R+60,0,Math.PI*2);
    ctx.strokeStyle='rgba(27,59,107,0.05)';
    ctx.lineWidth=1;
    ctx.stroke();

    // globe sphere outline
    ctx.beginPath();
    ctx.arc(cx,cy,R,0,Math.PI*2);
    ctx.strokeStyle='rgba(27,59,107,0.55)';
    ctx.lineWidth=1.5;
    ctx.stroke();

    // globe fill subtle
    ctx.beginPath();
    ctx.arc(cx,cy,R,0,Math.PI*2);
    ctx.fillStyle='rgba(27,59,107,0.03)';
    ctx.fill();

    // latitude lines
    for(let i=1;i<=4;i++){
      const y1 = cy - R*(i/5);
      const y2 = cy + R*(i/5);
      const hw1 = Math.sqrt(Math.max(0,R*R - (y1-cy)*(y1-cy)));
      const hw2 = Math.sqrt(Math.max(0,R*R - (y2-cy)*(y2-cy)));
      ctx.beginPath();
      ctx.ellipse(cx,cy, hw1, hw1*0.15, 0, 0, Math.PI*2);
      ctx.strokeStyle='rgba(27,59,107,0.12)';
      ctx.lineWidth=0.8;
      ctx.stroke();
      ctx.beginPath();
      ctx.ellipse(cx,cy, hw2, hw2*0.15, 0, 0, Math.PI*2);
      ctx.strokeStyle='rgba(27,59,107,0.12)';
      ctx.stroke();
    }

    // longitude lines
    for(let i=1;i<=5;i++){
      const angle = Math.PI*i/6;
      const rx = R*Math.abs(Math.cos(angle));
      ctx.beginPath();
      ctx.ellipse(cx,cy, rx, R, 0, 0, Math.PI*2);
      ctx.strokeStyle='rgba(27,59,107,0.10)';
      ctx.lineWidth=0.8;
      ctx.stroke();
    }

    // golden arcs across globe - network data flow
    const arcPairs = [
      [Math.PI*0.15, Math.PI*0.85],
      [Math.PI*0.35, Math.PI*1.15],
      [Math.PI*0.55, Math.PI*1.35],
      [Math.PI*0.70, Math.PI*0.05+Math.PI*2],
      [Math.PI*0.40, Math.PI*1.50],
      [Math.PI*0.80, Math.PI*1.70],
    ];

    ctx.lineCap='round';
    for(let p=0;p<arcPairs.length;p++){
      const [a1,a2] = arcPairs[p];
      const x1 = cx + Math.cos(a1)*R*0.85;
      const y1 = cy + Math.sin(a1)*R*0.85;
      const x2 = cx + Math.cos(a2)*R*0.85;
      const y2 = cy + Math.sin(a2)*R*0.85;

      const mx = (x1+x2)/2 + (Math.random()*40-20);
      const my = (y1+y2)/2 - Math.abs(Math.sin(a1)*R*0.4 - Math.sin(a2)*R*0.4)*0.3 - 60 - p*15;

      // glow
      ctx.beginPath();
      ctx.moveTo(x1,y1);
      ctx.quadraticCurveTo(mx,my,x2,y2);
      ctx.strokeStyle='rgba(198,163,80,0.10)';
      ctx.lineWidth=6;
      ctx.stroke();

      // mid line
      ctx.beginPath();
      ctx.moveTo(x1,y1);
      ctx.quadraticCurveTo(mx,my,x2,y2);
      ctx.strokeStyle='rgba(198,163,80,0.35)';
      ctx.lineWidth=2;
      ctx.stroke();

      // bright core
      ctx.beginPath();
      ctx.moveTo(x1,y1);
      ctx.quadraticCurveTo(mx,my,x2,y2);
      ctx.strokeStyle='rgba(230,195,120,0.7)';
      ctx.lineWidth=1;
      ctx.stroke();
    }

    // network nodes
    const nodes = [
      [Math.PI*0.15, 0.55],[Math.PI*0.85, 0.55],
      [Math.PI*0.35, 0.7],[Math.PI*1.15, 0.7],
      [Math.PI*0.55, 0.4],[Math.PI*1.35, 0.4],
      [Math.PI*0.70, 0.6],[Math.PI*0.05+Math.PI*2, 0.6],
      [Math.PI*0.40, 0.5],[Math.PI*1.50, 0.5],
      [Math.PI*0.80, 0.75],[Math.PI*1.70, 0.75],
    ];

    for(const [angle, dist] of nodes){
      const nx = cx + Math.cos(angle)*R*0.85*dist;
      const ny = cy + Math.sin(angle)*R*0.85*dist;

      ctx.beginPath();
      ctx.arc(nx,ny,8,0,Math.PI*2);
      ctx.fillStyle='rgba(198,163,80,0.12)';
      ctx.fill();

      ctx.beginPath();
      ctx.arc(nx,ny,4,0,Math.PI*2);
      ctx.fillStyle='rgba(198,163,80,0.6)';
      ctx.fill();

      ctx.beginPath();
      ctx.arc(nx,ny,2,0,Math.PI*2);
      ctx.fillStyle='#F0C870';
      ctx.fill();
    }

    // bauhaus geometric accents
    // top-left small circle
    ctx.beginPath();
    ctx.arc(cx-R-40, cy-R-20, 18, 0, Math.PI*2);
    ctx.fillStyle='rgba(27,59,107,0.15)';
    ctx.fill();
    ctx.strokeStyle='rgba(27,59,107,0.4)';
    ctx.lineWidth=1;
    ctx.stroke();

    // bottom-right small square
    ctx.fillStyle='rgba(139,115,85,0.35)';
    ctx.fillRect(cx+R+20, cy+R+20, 22, 22);

    // right vertical line
    ctx.beginPath();
    ctx.moveTo(cx+R+60, cy-R-30);
    ctx.lineTo(cx+R+60, cy+R+30);
    ctx.strokeStyle='rgba(27,59,107,0.25)';
    ctx.lineWidth=1;
    ctx.stroke();

    // top horizontal line
    ctx.beginPath();
    ctx.moveTo(cx-40, cy-R-60);
    ctx.lineTo(cx+R+90, cy-R-60);
    ctx.strokeStyle='rgba(139,115,85,0.25)';
    ctx.lineWidth=1;
    ctx.stroke();

    // center label
    ctx.font='500 13px "Noto Serif SC",serif';
    ctx.fillStyle='rgba(139,115,85,0.6)';
    ctx.textAlign='center';
    ctx.fillText('GLOBAL · OPEN · SOURCE', cx, cy+R+80);
    ctx.textAlign='left';
  }

  draw();
})();
</script>
</body></html>
