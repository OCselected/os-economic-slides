<head>
<meta charset="UTF-8">
<title>第 11 期 · 文化的重要作用 — 开源运动的理论基础</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 1600px;
  height: 900px;
  overflow: hidden;
  margin: 0;
}

body {
  background: #F5F0E8;
  position: relative;
  font-family: 'Noto Sans SC', sans-serif;
  color: #1B3B6B;
}

/* Subtle parchment texture */
.texture {
  position: absolute;
  top: 0; left: 0;
  width: 1600px; height: 900px;
  background: 
    radial-gradient(ellipse at 20% 80%, rgba(139,115,85,0.04) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 20%, rgba(27,59,107,0.03) 0%, transparent 50%);
  pointer-events: none;
}

/* Header bar */
.header {
  position: absolute;
  top: 0; left: 0;
  width: 1600px; height: 72px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 80px;
  border-bottom: 1px solid rgba(27,59,107,0.15);
}

.header-left {
  display: flex;
  align-items: center;
  gap: 16px;
}

.header-num {
  width: 36px; height: 36px;
  background: #1B3B6B;
  color: #F5F0E8;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Noto Serif SC', serif;
  font-weight: 700;
  font-size: 18px;
}

.header-title {
  font-family: 'Noto Serif SC', serif;
  font-size: 14px;
  font-weight: 400;
  color: #8B7355;
  letter-spacing: 2px;
}

.header-right {
  font-family: 'Noto Sans SC', sans-serif;
  font-size: 12px;
  color: #8B7355;
  letter-spacing: 1px;
}

/* Slide number */
.slide-indicator {
  position: absolute;
  bottom: 40px;
  right: 80px;
  font-family: 'Noto Serif SC', serif;
  font-size: 13px;
  color: #8B7355;
  letter-spacing: 1px;
}

/* Main title area */
.title-block {
  position: absolute;
  top: 110px;
  left: 80px;
}

.slide-title {
  font-family: 'Noto Serif SC', serif;
  font-size: 44px;
  font-weight: 700;
  color: #1B3B6B;
  line-height: 1.3;
  letter-spacing: 2px;
}

.slide-subtitle {
  font-family: 'Noto Serif SC', serif;
  font-size: 18px;
  font-weight: 400;
  color: #8B7355;
  margin-top: 14px;
  letter-spacing: 3px;
  line-height: 1.6;
}

.title-underline {
  width: 80px;
  height: 3px;
  background: #1B3B6B;
  margin-top: 20px;
}

/* Central geometric composition - Roundabout */
.roundabout-container {
  position: absolute;
  top: 180px;
  right: 100px;
  width: 580px;
  height: 580px;
}

/* Concentric circles */
.ring {
  position: absolute;
  border-radius: 50%;
  border: 1px solid rgba(27,59,107,0.12);
}

.ring-1 {
  width: 580px; height: 580px;
  top: 0; left: 0;
  border-width: 2px;
  border-color: rgba(27,59,107,0.2);
}

.ring-2 {
  width: 440px; height: 440px;
  top: 70px; left: 70px;
  border-width: 1px;
}

.ring-3 {
  width: 300px; height: 300px;
  top: 140px; left: 140px;
  border-width: 1px;
  border-color: rgba(139,115,85,0.2);
}

.ring-4 {
  width: 160px; height: 160px;
  top: 210px; left: 210px;
  border-width: 2px;
  border-color: rgba(27,59,107,0.25);
}

/* Center core */
.core {
  position: absolute;
  width: 80px; height: 80px;
  top: 250px; left: 250px;
  background: #1B3B6B;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
}

.core-inner {
  width: 32px; height: 32px;
  background: #F5F0E8;
  border-radius: 50%;
}

/* Radial lines */
.radial-line {
  position: absolute;
  top: 290px;
  left: 290px;
  width: 1px;
  height: 220px;
  background: rgba(27,59,107,0.15);
  transform-origin: 0 0;
}

.rl-1 { transform: rotate(0deg); }
.rl-2 { transform: rotate(51.4deg); }
.rl-3 { transform: rotate(102.8deg); }
.rl-4 { transform: rotate(154.3deg); }
.rl-5 { transform: rotate(205.7deg); }
.rl-6 { transform: rotate(257.1deg); }
.rl-7 { transform: rotate(308.6deg); }

/* Orbit dots */
.orbit-dot {
  position: absolute;
  border-radius: 50%;
  background: #1B3B6B;
}

/* Domain labels positioned around the roundabout */
.domain-label {
  position: absolute;
  width: 110px;
  text-align: center;
}

.domain-dot {
  width: 10px; height: 10px;
  background: #1B3B6B;
  border-radius: 50%;
  margin: 0 auto 8px;
}

.domain-dot-copper {
  background: #8B7355;
}

.domain-name {
  font-family: 'Noto Serif SC', serif;
  font-size: 16px;
  font-weight: 600;
  color: #1B3B6B;
  letter-spacing: 3px;
}

.domain-en {
  font-family: 'Noto Sans SC', sans-serif;
  font-size: 10px;
  color: #8B7355;
  letter-spacing: 1px;
  margin-top: 3px;
}

/* Bottom content - description */
.bottom-content {
  position: absolute;
  bottom: 90px;
  left: 80px;
  width: 520px;
}

.bottom-label {
  font-family: 'Noto Serif SC', serif;
  font-size: 13px;
  color: #8B7355;
  letter-spacing: 4px;
  margin-bottom: 14px;
  font-weight: 400;
}

.bottom-text {
  font-family: 'Noto Sans SC', sans-serif;
  font-size: 15px;
  line-height: 2;
  color: #1B3B6B;
  font-weight: 300;
}

.bottom-text .highlight {
  font-weight: 500;
  color: #1B3B6B;
}

/* Decorative geometric elements */
.deco-square {
  position: absolute;
  width: 12px; height: 12px;
  background: #8B7355;
}

.deco-square-hollow {
  position: absolute;
  width: 14px; height: 14px;
  border: 1.5px solid #1B3B6B;
  background: transparent;
}

.deco-line-v {
  position: absolute;
  width: 1px;
  background: rgba(27,59,107,0.1);
}

.deco-line-h {
  position: absolute;
  height: 1px;
  background: rgba(139,115,85,0.12);
}

/* Arrow indicators on the ring */
.flow-arrow {
  position: absolute;
  width: 0; height: 0;
}

/* Domain positioning - using the roundabout container coordinate system */
/* Angles: each domain is spaced around 360/7 ≈ 51.4 degrees */
/* Using trigonometry with center at 290,290 and radius ~265 */

/* 0°: top (科研) */
.dom-1 { top: 18px; right: 235px; }
/* 51.4° */
.dom-2 { top: 82px; right: 65px; }
/* 102.8° */
.dom-3 { top: 310px; right: 8px; }
/* 154.3° */
.dom-4 { bottom: 100px; right: 82px; }
/* 205.7° */
.dom-5 { bottom: 30px; left: 215px; }
/* 257.1° */
.dom-6 { top: 310px; left: 10px; }
/* 308.6° */
.dom-7 { top: 82px; left: 80px; }

/* Light trail arcs - simulated with border */
.light-arc {
  position: absolute;
  border-radius: 50%;
  border-style: solid;
  border-color: transparent;
}

.arc-1 {
  width: 500px; height: 500px;
  top: 40px; left: 40px;
  border-width: 2px;
  border-top-color: rgba(27,59,107,0.25);
  border-right-color: transparent;
  transform: rotate(30deg);
}

.arc-2 {
  width: 380px; height: 380px;
  top: 100px; left: 100px;
  border-width: 1.5px;
  border-bottom-color: rgba(139,115,85,0.2);
  border-left-color: transparent;
  transform: rotate(150deg);
}

/* Left vertical accent line */
.left-accent {
  position: absolute;
  top: 110px;
  left: 60px;
  width: 2px;
  height: 640px;
  background: linear-gradient(to bottom, transparent, rgba(27,59,107,0.2) 20%, rgba(27,59,107,0.2) 80%, transparent);
}

/* Bottom-left decorative element */
.geo-cluster {
  position: absolute;
  bottom: 80px;
  left: 640px;
  display: flex;
  align-items: center;
  gap: 12px;
}

.geo-circle-sm {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: #1B3B6B;
}

.geo-circle-md {
  width: 14px; height: 14px;
  border-radius: 50%;
  border: 2px solid #8B7355;
}

.geo-bar {
  width: 40px; height: 2px;
  background: #1B3B6B;
}
</style>
