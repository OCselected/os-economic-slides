<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {

  /* parchment texture via layered gradients */
  .parchment {

    overflow: hidden;
    pointer-events: none;
  }

  /* Large blue circle top-right */
  .geo-circle-large {
    position: absolute;
    width: 380px; height: 380px;
    border-radius: 50%;
    background: #1B3B6B;
    top: -80px; right: -60px;
    opacity: 0.92;
  }

  /* Smaller copper circle */
  .geo-circle-copper {
    position: absolute;
    width: 160px; height: 160px;
    border-radius: 50%;
    background: #8B7355;
    top: 200px; right: 180px;
    opacity: 0.85;
  }

  /* White circle on top (cutout effect) */
  .geo-circle-white {
    position: absolute;
    width: 90px; height: 90px;
    border-radius: 50%;
    background: #F5F0E8;
    top: 100px; right: 240px;
    opacity: 0.95;
  }

  /* Blue square bottom-left */
  .geo-square-blue {
    position: absolute;
    width: 180px; height: 180px;
    background: #1B3B6B;
    bottom: -40px; left: 60px;
    opacity: 0.88;
    transform: rotate(0deg);
  }

  /* Copper square outline */
  .geo-square-outline {
    position: absolute;
    width: 120px; height: 120px;
    border: 3px solid #8B7355;
    bottom: 120px; left: 200px;
    opacity: 0.6;
  }

  /* Small blue circle bottom */

    position: absolute;
    width: 50px; height: 50px;
    border-radius: 50%;
    background: #1B3B6B;

    height: 2px;

    transform: rotate(-30deg);
    transform-origin: left center;

    width: 0; height: 0;
    border-left: 30px solid transparent;
    border-right: 30px solid transparent;
