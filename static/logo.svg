<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 56" font-family="'Source Serif 4', 'Noto Serif SC', Georgia, serif">
  <!-- 几何徽标 -->
  <g transform="translate(0,28)">
    <!-- 同心圆环 -->
    <circle cx="20" cy="0" r="16" fill="none" stroke="#D4A853" stroke-width="1.5" opacity="0.4"/>
    <circle cx="20" cy="0" r="10" fill="none" stroke="#D4A853" stroke-width="1.5" opacity="0.6"/>
    <circle cx="20" cy="0" r="4" fill="#D4A853"/>
    <!-- 45度旋转方块 -->
    <rect x="10.5" y="-9.5" width="19" height="19" fill="none" stroke="#8B7355" stroke-width="1" transform="rotate(45 20 0)" opacity="0.5"/>
  </g>
  <!-- 分隔线 -->
  <line x1="52" y1="10" x2="52" y2="46" stroke="#D4A853" stroke-width="1" opacity="0.3"/>
  <!-- 文字主标题 -->
  <text x="66" y="24" font-size="14" font-weight="700" fill="#F5F0E8" letter-spacing="0.5">「开源之道」</text>
  <text x="66" y="42" font-size="12" font-weight="400" fill="#D4A853" font-style="italic" letter-spacing="1">开源的经济学</text>
  <!-- 英文副标 -->
  <text x="252" y="46" font-size="7" font-weight="400" fill="#8B7355" letter-spacing="2" text-anchor="end">ECON OF OS</text>
</svg>