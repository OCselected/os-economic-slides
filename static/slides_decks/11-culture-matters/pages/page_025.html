

<!DOCTYPE html>
<html><!-- source_hash: cd557e0f9a8e0d07 -->
<head>
<meta charset="UTF-8">
<title>文化的重要作用 · 我们该如何做？</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 1600px;
  height: 900px;
  overflow: hidden;
  background: #F5F0E8;
}

body {
  position: relative;
  font-family: 'Noto Sans SC', sans-serif;
  color: #1B3B6B;
}

/* Subtle parchment texture */
.bg-texture {
  position: absolute;
  top: 0; left: 0;
  width: 1600px; height: 900px;
  background: 
    repeating-linear-gradient(
      0deg,
      transparent,
      transparent 3px,
      rgba(139, 115, 85, 0.015) 3px,
      rgba(139, 115, 85, 0.015) 4px
    );
  pointer-events: none;
  z-index: 0;
}

/* Header */
.lecture-header {
  position: absolute;
  top: 44px;
  left: 80px;
  display: flex;
  align-items: center;
  gap: 16px;
  z-index: 10;
}

.lecture-num {
  font-family: 'Noto Serif SC', serif;
  font-size: 13px;
  font-weight: 700;
  color: #8B7355;
  letter-spacing: 3px;
}

.lecture-line {
  width: 50px;
  height: 1px;
  background: #8B7355;
  opacity: 0.6;
}

.lecture-title {
  font-family: 'Noto Sans SC', sans-serif;
  font-size: 12px;
  color: #555;
  letter-spacing: 1px;
  opacity: 0.8;
}

/* ===== RIGHT SIDE: INTERWEAVING GEOMETRIC COMPOSITION ===== */
.geo-composition {
  position: absolute;
  top: 0;
  right: 0;
  width: 680px;
  height: 900px;
  z-index: 2;
}

/* Large background filled circle - blue */
.bg-circle-blue {
  position: absolute;
  width: 520px;
  height: 520px;
  border-radius: 50%;
  background: #1B3B6B;
  opacity: 0.04;
  top: 140px;
  right: 60px;
}

/* Interwoven ring - blue large */
.ring-blue-outer {
  position: absolute;
  width: 380px;
  height: 380px;
  border-radius: 50%;
  border: 2.5px solid #1B3B6B;
  opacity: 0.18;
  top: 200px;
  right: 100px;
}

/* Interwoven ring - gold large */
.ring-gold-outer {
  position: absolute;
  width: 340px;
  height: 340px;
  border-radius: 50%;
  border: 2.5px solid #8B7355;
  opacity: 0.28;
  top: 300px;
  right: 40px;
}

/* Inner blue ring */
.ring-blue-inner {
  position: absolute;
  width: 240px;
  height: 240px;
  border-radius: 50%;
  border: 3px solid #1B3B6B;
  opacity: 0.15;
  top: 260px;
  right: 200px;
}

/* Inner gold ring */
.ring-gold-inner {
  position: absolute;
  width: 180px;
  height: 180px;
  border-radius: 50%;
  border: 3px solid #8B7355;
  opacity: 0.22;
  top: 320px;
  right: 140px;
}

/* Solid blue circle */
.dot-blue-1 {
  position: absolute;
  width: 70px;
  height: 70px;
  border-radius: 50%;
  background: #1B3B6B;
  opacity: 0.07;
  top: 480px;
  right: 320px;
}

.dot-blue-2 {
  position: absolute;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: #1B3B6B;
  opacity: 0.15;
  top: 180px;
  right: 400px;
}

/* Solid gold circle */
.dot-gold-1 {
  position: absolute;
  width: 50px;
  height: 50px;
  border-radius: 50%;
  background: #8B7355;
  opacity: 0.12;
  top: 600px;
  right: 240px;
}

.dot-gold-2 {
  position: absolute;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: #8B7355;
  opacity: 0.2;
  top: 160px;
  right: 120px;
}

/* Geometric shapes */
.square-blue-rotated {
  position: absolute;
  width: 90px;
  height: 90px;
  border: 2px solid #1B3B6B;
  opacity: 0.1;
  top: 520px;
  right: 80px;
  transform: rotate(45deg);
}

.square-gold-solid {
  position: absolute;
  width: 56px;
  height: 56px;
  background: #8B7355;
  opacity: 0.07;
  top: 120px;
  right: 280px;
}

/* Diagonal lines for interweaving effect */
.line-d1 {
  position: absolute;
  width: 1px;
  height: 300px;
  background: #8B7355;
  opacity: 0.15;
  top: 160px;
  right: 380px;
  transform: rotate(30deg);
  transform-origin: top center;
}

.line-d2 {
  position: absolute;
  width: 1px;
  height: 260px;
  background: #1B3B6B;
  opacity: 0.12;
  top: 300px;
  right: 60px;
  transform: rotate(-25deg);
  transform-origin: top center;
}

.line-d3 {
  position: absolute;
  width: 1px;
  height: 180px;
  background: #8B7355;
  opacity: 0.1;
  top: 500px;
  right: 400px;
  transform: rotate(60deg);
  transform-origin: top center;
}

/* Thick accent bar */
.accent-bar {
  position: absolute;
  width: 6px;
  height: 140px;
  background: #1B3B6B;
  opacity: 0.08;
  top: 280px;
  right: 2px;
}

.accent-bar-gold {
  position: absolute;
  width: 4px;
  height: 100px;
  background: #8B7355;
  opacity: 0.15;
  top: 620px;
  right: 14px;
}

/* ===== LEFT CONTENT ===== */
.content-area {
  position: absolute;
  top: 110px;
  left: 80px;
  width: 760px;
  z-index: 5;
}

.question {
  font-family: 'Noto Serif SC', serif;
  font-size: 54px;
  font-weight: 900;
  color: #1B3B6B;
  line-height: 1.2;
  margin-bottom: 52px;
  position: relative;
  padding-left: 24px;
}

.question::before {
  content: '';
  position: absolute;
  left: 0;
  top: 6px;
  width: 5px;
  height: calc(100% - 12px);
  background: #8B7355;
}

/* Bullet list */
.bullet-list {
  list-style: none;
  padding: 0;
}

.bullet-item {
  display: flex;
  align-items: flex-start;
  gap: 18px;
  margin-bottom: 30px;
}

.marker-square {
  flex-shrink: 0;
  width: 10px;
  height: 10px;
  background: #1B3B6B;
  margin-top: 9px;
}

.marker-circle {
  flex-shrink: 0;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #8B7355;
  margin-top: 9px;
}

.marker-ring {
  flex-shrink: 0;
  width: 10px;
  height: 10px;
  border: 2px solid #1B3B6B;
  border-radius: 50%;
  margin-top: 9px;
}

.bullet-text {
  font-family: 'Noto Sans SC', sans-serif;
  font-size: 20px;
  line-height: 1.6;
  color: #1B3B6B;
  font-weight: 500;
}

.bullet-subtext {
  display: block;
  font-size: 15px;
  color: #555;
  font-weight: 300;
  margin-top: 4px;
  line-height: 1.6;
}

/* Bottom quote */
.bottom-quote {
  position: absolute;
  bottom: 68px;
  left: 80px;
  width: 640px;
  display: flex;
  align-items: center;
  gap: 16px;
  z-index: 5;
}

.quote-line {
  flex-shrink: 0;
  width: 48px;
  height: 1px;
  background: #8B7355;
  opacity: 0.6;
}

.quote-text {
  font-family: 'Noto Serif SC', serif;
  font-size: 19px;
  color: #8B7355;
  font-weight: 700;
  line-height: 1.5;
  letter-spacing: 0.5px;
}

/* Slide info */
.slide-number {
  position: absolute;
  bottom: 44px;
  right: 80px;
  font-family: 'Noto Sans SC', sans-serif;
  font-size: 11px;
  color: #555;
  letter-spacing: 1px;
  opacity: 0.5;
  z-index: 10;
}

/* Corner accents */
.corner-tl {
  position: absolute;
  top: 0; left: 0;
  width: 50px; height: 50px;
  border-top: 1.5px solid #8B7355;
  border-left: 1.5px solid #8B7355;
  opacity: 0.25;
  z-index: 3;
}

.corner-br {
  position: absolute;
  bottom: 0; right: 0;
  width: 50px; height: 50px;
  border-bottom: 1.5px solid #8B7355;
  border-right: 1.5px solid #8B7355;
  opacity: 0.25;
  z-index: 3;
}

/* Divider between content and geometry */
.divider {
  position: absolute;
  top: 120px;
  left: 830px;
  width: 1px;
  height: 520px;
  background: linear-gradient(to bottom, rgba(27,59,107,0.12) 0%, rgba(27,59,107,0) 100%);
  z-index: 3;
}
</style>
</head>
<body>
  <div class="bg-texture"></div>
  <div class="corner-tl"></div>
  <div class="corner-br"></div>

  <!-- Header -->
  <div class="lecture-header">
    <span class="lecture-num">LECTURE XI</span>
    <div class="lecture-line"></div>
    <span class="lecture-title">文化的重要作用</span>
  </div>

  <!-- Right side: interweaving geometric composition -->
  <div class="geo-composition">
    <div class="bg-circle-blue"></div>
    <div class="ring-blue-outer"></div>
    <div class="ring-gold-outer"></div>
    <div class="ring-blue-inner"></div>
    <div class="ring-gold-inner"></div>
    <div class="dot-blue-1"></div>
    <div class="dot-blue-2"></div>
    <div class="dot-gold-1"></div>
    <div class="dot-gold-2"></div>
    <div class="square-blue-rotated"></div>
    <div class="square-gold-solid"></div>
    <div class="line-d1"></div>
    <div class="line-d2"></div>
    <div class="line-d3"></div>
    <div class="accent-bar"></div>
    <div class="accent-bar-gold"></div>
  </div>

  <div class="divider"></div>

  <!-- Left content -->
  <div class="content-area">
    <div class="question">我们该如何做？</div>

    <ul class="bullet-list">
      <li class="bullet-item">
        <div class="marker-square"></div>
        <div class="bullet-text">
          文化建构
          <span class="bullet-subtext">需要文化的塑造者和传播者</span>
        </div>
      </li>
      <li class="bullet-item">
        <div class="marker-circle"></div>
        <div class="bullet-text">
          环境的改造
          <span class="bullet-subtext">法律、经济、社会——制度层面的成本与收益</span>
        </div>
      </li>
      <li class="bullet-item">
        <div class="marker-ring"></div>
        <div class="bullet-text">
          个人该如何处置？
          <span class="bullet-subtext">认知、理性、制度——三者的交互作用</span>
        </div>
      </li>
    </ul>
  </div>

  <!-- Bottom statement -->
  <div class="bottom-quote">
    <div class="quote-line"></div>
    <div class="quote-text">如果是文明的一种形式，那么一切都值得。</div>
  </div>

  <!-- Slide number -->
  <div class="slide-number">11 / 28</div>
</body>
</html>
