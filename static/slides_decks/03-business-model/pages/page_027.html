

<!DOCTYPE html>
<html><!-- source_hash: 5aa9240fcb38698d -->
<head>
<meta charset="UTF-8">
<title>第 03 期 · 商业模式：规则下的具体操作</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 1600px;
  height: 900px;
  overflow: hidden;
  margin: 0;
}

body {
  background: #F5F0E8;
  position: relative;
  font-family: 'Noto Sans SC', sans-serif;
}

/* Subtle parchment texture overlay */
body::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: repeating-linear-gradient(
    90deg,
    transparent,
    transparent 2px,
    rgba(139, 115, 85, 0.015) 2px,
    rgba(139, 115, 85, 0.015) 4px
  );
  pointer-events: none;
  z-index: 1;
}

/* Header area */
.header {
  position: absolute;
  top: 48px;
  left: 72px;
  z-index: 10;
}

.slide-label {
  font-size: 13px;
  letter-spacing: 3px;
  color: #8B7355;
  text-transform: uppercase;
  margin-bottom: 8px;
  font-family: 'Noto Sans SC', sans-serif;
}

.slide-title {
  font-family: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', serif;
  font-size: 32px;
  color: #1B3B6B;
  font-weight: 700;
  line-height: 1.3;
}

.slide-subtitle {
  font-family: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', serif;
  font-size: 16px;
  color: #555;
  margin-top: 6px;
  font-style: italic;
}

/* Geometric composition - broken/collapsing blocks */
.geo-container {
  position: absolute;
  top: 0;
  left: 0;
  width: 1600px;
  height: 900px;
  z-index: 2;
}

/* Right side geometric art */
.right-art {
  position: absolute;
  top: 100px;
  right: 72px;
  width: 420px;
  height: 620px;
  z-index: 3;
}

/* Cracked pillar - representing unstable foundation */
.pillar-base {
  position: absolute;
  bottom: 40px;
  right: 60px;
  width: 180px;
  height: 20px;
  background: #1B3B6B;
}

.pillar-base-right {
  position: absolute;
  bottom: 40px;
  right: 0px;
  width: 80px;
  height: 20px;
  background: #1B3B6B;
}

.pillar-gap {
  position: absolute;
  bottom: 40px;
  right: 240px;
  width: 30px;
  height: 20px;
  border-bottom: 3px solid #8B7355;
}

/* Tilted block - collapse */
.block-tilted {
  position: absolute;
  top: 260px;
  right: 40px;
  width: 100px;
  height: 60px;
  background: #8B7355;
  transform: rotate(-8deg);
  opacity: 0.7;
}

.block-tilted-2 {
  position: absolute;
  top: 340px;
  right: 160px;
  width: 80px;
  height: 45px;
  background: #1B3B6B;
  transform: rotate(5deg);
  opacity: 0.5;
}

/* Downward arrow as geometric shape */
.arrow-down {
  position: absolute;
  top: 140px;
  right: 150px;
  width: 0;
  height: 0;
  border-left: 40px solid transparent;
  border-right: 40px solid transparent;
  border-top: 70px solid #1B3B6B;
  opacity: 0.12;
}

/* Large circle - knowledge/idea */
.circle-large {
  position: absolute;
  top: 60px;
  right: 60px;
  width: 140px;
  height: 140px;
  border-radius: 50%;
  border: 3px solid #1B3B6B;
  opacity: 0.15;
}

.circle-large::after {
  content: '';
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 60px;
  height: 60px;
  border-radius: 50%;
  background: #1B3B6B;
  opacity: 0.3;
}

/* Fragments - broken foundation pieces */
.fragment-1 {
  position: absolute;
  top: 480px;
  right: 80px;
  width: 45px;
  height: 45px;
  background: #8B7355;
  transform: rotate(15deg);
  opacity: 0.6;
}

.fragment-2 {
  position: absolute;
  top: 530px;
  right: 180px;
  width: 35px;
  height: 35px;
  background: #1B3B6B;
  transform: rotate(-20deg);
  opacity: 0.4;
}

.fragment-3 {
  position: absolute;
  top: 560px;
  right: 120px;
  width: 28px;
  height: 28px;
  background: #555;
  transform: rotate(30deg);
  opacity: 0.5;
}

/* Downward trend line */
.trend-line {
  position: absolute;
  top: 200px;
  right: 20px;
  width: 350px;
  height: 400px;
}

.trend-line-inner {
  position: absolute;
  top: 40px;
  right: 80px;
  width: 0;
  border-left: 3px solid #8B7355;
  height: 280px;
  transform: rotate(20deg);
  transform-origin: top right;
  opacity: 0.4;
}

/* Horizontal lines suggesting ground/foundation */
.ground-line-1 {
  position: absolute;
  bottom: 30px;
  right: 0;
  width: 400px;
  height: 2px;
  background: #1B3B6B;
  opacity: 0.3;
}

.ground-line-2 {
  position: absolute;
  bottom: 25px;
  right: 0;
  width: 300px;
  height: 1px;
  background: #8B7355;
  opacity: 0.4;
}

/* Small decorative circle top-left */
.deco-circle-tl {
  position: absolute;
  top: 60px;
  left: 580px;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: #1B3B6B;
  opacity: 0.6;
}

/* Content area */
.content-area {
  position: absolute;
  top: 195px;
  left: 72px;
  width: 720px;
  z-index: 5;
}

.content-section-title {
  font-family: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', serif;
  font-size: 22px;
  color: #1B3B6B;
  margin-bottom: 24px;
  padding-bottom: 10px;
  border-bottom: 2px solid #8B7355;
  display: inline-block;
}

.bullet-list {
  list-style: none;
  padding: 0;
}

.bullet-list li {
  font-family: 'Noto Sans SC', sans-serif;
  font-size: 17px;
  color: #333;
  line-height: 1.8;
  margin-bottom: 12px;
  padding-left: 28px;
  position: relative;
}

.bullet-list li::before {
  content: '';
  position: absolute;
  left: 0;
  top: 10px;
  width: 10px;
  height: 10px;
  background: #8B7355;
}

.bullet-list li:nth-child(even)::before {
  background: #1B3B6B;
  border-radius: 50%;
}

.bullet-list li em {
  font-style: normal;
  color: #1B3B6B;
  font-weight: 600;
}

/* Footer */
.footer {
  position: absolute;
  bottom: 32px;
  left: 72px;
  right: 72px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  z-index: 10;
}

.footer-left {
  font-size: 12px;
  color: #8B7355;
  letter-spacing: 1px;
}

.footer-right {
  font-size: 12px;
  color: #8B7355;
  letter-spacing: 1px;
}

.footer-line {
  position: absolute;
  bottom: 60px;
  left: 72px;
  width: 1456px;
  height: 1px;
  background: #8B7355;
  opacity: 0.25;
  z-index: 5;
}

/* Section number */
.section-num {
  position: absolute;
  top: 52px;
  right: 72px;
  font-family: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', serif;
  font-size: 90px;
  color: #1B3B6B;
  opacity: 0.06;
  font-weight: 700;
  z-index: 1;
}

/* Additional geometric accents */
.geo-square {
  position: absolute;
  top: 180px;
  left: 560px;
  width: 6px;
  height: 6px;
  background: #1B3B6B;
  opacity: 0.4;
  z-index: 4;
}

.geo-square-2 {
  position: absolute;
  top: 200px;
  left: 580px;
  width: 6px;
  height: 6px;
  background: #8B7355;
  opacity: 0.4;
  z-index: 4;
}

/* Diagonal accent lines */
.diagonal-1 {
  position: absolute;
  top: 620px;
  left: 50px;
  width: 200px;
  height: 1px;
  background: #1B3B6B;
  opacity: 0.1;
  transform: rotate(-30deg);
  z-index: 2;
}

/* Visual metaphor label */
.metaphor-label {
  position: absolute;
  bottom: 90px;
  left: 72px;
  width: 700px;
  z-index: 5;
}

.metaphor-text {
  font-family: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', serif;
  font-size: 14px;
  color: #8B7355;
  font-style: italic;
  line-height: 1.6;
  padding-left: 16px;
  border-left: 3px solid #8B7355;
}
</style>

    <li>落后的<em>发展中国家</em>：制度土壤尚在生成之中</li>
    <li>知识财产观念形成尚需时间——历史积淀不足</li>
    <li>开放之初选择了<em>知识财产弱保护</em>的副作用</li>
    <li>合规缺乏监管：规则写了，但无人执行</li>
    <li>（网络）<em>社会契约精神</em>的匮乏</li>

  </ul>

  <div class="metaphor-text">
    几何碎裂 · 下坠趋势 · 裂开的基座——<br>
