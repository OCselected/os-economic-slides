<style>

html, body { width: 1600px; height: 900px; overflow: hidden; margin: 0; }
body {
  background: #1B3B6B;

  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;

/* Bauhaus geometric decorations */
.circle-1 {
  position: absolute;
  width: 280px;
  height: 280px;
  border-radius: 50%;
  border: 2px solid rgba(200, 170, 100, 0.15);
  top: 60px;
  right: 120px;
}
.circle-2 {
  position: absolute;
  width: 180px;
  height: 180px;
  border-radius: 50%;
  background: rgba(200, 170, 100, 0.06);
  bottom: 100px;
  left: 80px;
}
.circle-3 {
  position: absolute;
  width: 60px;
  height: 60px;
  border-radius: 50%;
  background: rgba(200, 170, 100, 0.12);
  top: 180px;
  left: 200px;
}
.square-1 {
  position: absolute;
  width: 140px;
  height: 140px;
  border: 1.5px solid rgba(200, 170, 100, 0.12);
  bottom: 140px;
  right: 200px;
  transform: rotate(45deg);
}
.square-2 {
  position: absolute;
  width: 60px;
  height: 60px;
  background: rgba(200, 170, 100, 0.07);
  top: 100px;
  left: 500px;
}
.line-h {
  position: absolute;
  height: 1px;
  background: rgba(200, 170, 100, 0.2);
}
.line-h-1 { width: 300px; top: 320px; left: 180px; }
.line-h-2 { width: 200px; bottom: 280px; right: 180px; }
.line-v {
  position: absolute;
  width: 1px;
  background: rgba(200, 170, 100, 0.15);
}
.line-v-1 { height: 160px; top: 100px; left: 1400px; }
.line-v-2 { height: 120px; bottom: 80px; left: 120px; }
.line-diag {
  position: absolute;
  width: 200px;
  height: 1px;
  background: rgba(200, 170, 100, 0.1);
  transform-origin: left center;
  transform: rotate(-35deg);
  bottom: 200px;
  left: 850px;
}
