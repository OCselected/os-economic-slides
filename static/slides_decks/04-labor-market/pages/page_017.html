

<!DOCTYPE html>
<html><!-- source_hash: edef2a88cfdb6764 -->
<head>
<meta charset="UTF-8">
<title>第 04 期 · 软件开发劳动力市场 — 教育市场</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1600px;
    height: 900px;
    overflow: hidden;
    margin: 0;
    background: #F5F0E8;
  }
  body {
    font-family: 'Noto Sans SC', 'PingFang SC', sans-serif;
    color: #1B3B6B;
    position: relative;
  }

  /* Parchment texture overlay */
  .texture {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: radial-gradient(ellipse at 30% 20%, rgba(139,115,85,0.03) 0%, transparent 60%),
                radial-gradient(ellipse at 70% 80%, rgba(27,59,107,0.02) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  /* Top header bar */
  .header {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 52px;
    display: flex;
    align-items: center;
    padding: 0 60px;
    border-bottom: 2px solid #1B3B6B;
    z-index: 10;
  }
  .header .dot {
    width: 12px;
    height: 12px;
    background: #1B3B6B;
    border-radius: 50%;
    margin-right: 14px;
    flex-shrink: 0;
  }
  .header .label {
    font-family: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', serif;
    font-size: 13px;
    color: #555;
    letter-spacing: 2px;
  }
  .header .lecture-num {
    margin-left: auto;
    font-family: 'Noto Serif SC', serif;
    font-size: 13px;
    color: #8B7355;
    letter-spacing: 1px;
  }

  /* Bottom bar */
  .footer {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 36px;
    display: flex;
    align-items: center;
    padding: 0 60px;
    border-top: 1px solid rgba(27,59,107,0.2);
    z-index: 10;
  }
  .footer .page {
    font-size: 11px;
    color: #8B7355;
    letter-spacing: 2px;
    font-family: 'Noto Serif SC', serif;
  }
  .footer .footer-line {
    flex: 1;
    height: 1px;
    background: rgba(27,59,107,0.1);
    margin: 0 20px;
  }
  .footer .footer-right {
    font-size: 11px;
    color: #8B7355;
    letter-spacing: 1px;
  }

  /* Main content area */
  .content {
    position: absolute;
    top: 52px;
    left: 0;
    right: 0;
    bottom: 36px;
    display: flex;
    z-index: 5;
  }

  /* Left visual panel */
  .visual-panel {
    width: 580px;
    height: 100%;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    border-right: 1px solid rgba(27,59,107,0.12);
  }

  /* Eye / city visual */
  .eye-container {
    position: relative;
    width: 480px;
    height: 480px;
  }

  /* Outer ring */
  .outer-ring {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 460px;
    height: 460px;
    border: 1.5px solid rgba(27,59,107,0.15);
    border-radius: 50%;
  }

  /* Middle ring */
  .middle-ring {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 360px;
    height: 360px;
    border: 2px solid rgba(27,59,107,0.3);
    border-radius: 50%;
  }

  /* Inner ring (iris) */
  .iris-ring {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 220px;
    height: 220px;
    border: 3px solid #1B3B6B;
    border-radius: 50%;
  }

  /* Pupil */
  .pupil {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 90px;
    height: 90px;
    background: #1B3B6B;
    border-radius: 50%;
  }

  /* Pupil highlight */
  .pupil-highlight {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 28px;
    height: 28px;
    background: #F5F0E8;
    border-radius: 50%;
    margin-top: -18px;
    margin-left: 12px;
  }

  /* Radial roads */
  .radial-road {
    position: absolute;
    top: 50%; left: 50%;
    width: 2px;
    height: 220px;
    background: linear-gradient(to top, #1B3B6B 0%, transparent 100%);
    transform-origin: bottom center;
  }

  /* Small dots at road ends */
  .road-dot {
    position: absolute;
    width: 6px;
    height: 6px;
    background: #1B3B6B;
    border-radius: 50%;
  }

  /* Light river - flowing curve */
  .light-river {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 300px;
    height: 8px;
    background: linear-gradient(90deg, transparent 0%, #8B7355 20%, #1B3B6B 50%, #8B7355 80%, transparent 100%);
    border-radius: 4px;
    opacity: 0.6;
    margin-top: 80px;
  }
  .light-river-2 {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 340px;
    height: 4px;
    background: linear-gradient(90deg, transparent 0%, #8B7355 30%, rgba(27,59,107,0.4) 50%, #8B7355 70%, transparent 100%);
    border-radius: 2px;
    opacity: 0.4;
    margin-top: 110px;
  }

  /* Bauhaus geometric decorations on visual panel */
  .geo-square {
    position: absolute;
    width: 40px;
    height: 40px;
    border: 2px solid #1B3B6B;
  }
  .geo-square-1 {
    top: 50px;
    left: 40px;
    background: rgba(27,59,107,0.08);
  }
  .geo-square-2 {
    bottom: 60px;
    right: 30px;
    width: 24px;
    height: 24px;
    background: #1B3B6B;
  }
  .geo-circle-deco {
    position: absolute;
    width: 50px;
    height: 50px;
    border: 2px solid #8B7355;
    border-radius: 50%;
  }
  .geo-circle-deco-1 {
    bottom: 40px;
    left: 50px;
    opacity: 0.6;
  }
  .geo-line-deco {
    position: absolute;
    width: 80px;
    height: 2px;
    background: #1B3B6B;
  }
  .geo-line-deco-1 {
    top: 80px;
    right: 20px;
    transform: rotate(-45deg);
    opacity: 0.4;
  }

  /* Right text panel */
  .text-panel {
    flex: 1;
    padding: 50px 60px 50px 55px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    position: relative;
  }

  /* Section label */
  .section-label {
    font-family: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', serif;
    font-size: 12px;
    color: #8B7355;
    letter-spacing: 4px;
    margin-bottom: 12px;
    text-transform: uppercase;
  }

  /* Main title */
  .slide-title {
    font-family: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', serif;
    font-size: 36px;
    color: #1B3B6B;
    line-height: 1.3;
    margin-bottom: 10px;
    font-weight: 700;
  }

  /* Subtitle */
  .slide-subtitle {
    font-family: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', serif;
    font-size: 16px;
    color: #8B7355;
    line-height: 1.6;
    margin-bottom: 32px;
    letter-spacing: 0.5px;
  }

  /* Divider */
  .divider {
    width: 60px;
    height: 3px;
    background: #1B3B6B;
    margin-bottom: 28px;
  }

  /* Bullet points */
  .bullet-list {
    list-style: none;
    padding: 0;
    margin: 0;
  }
  .bullet-list li {
    font-size: 16px;
    line-height: 2;
    color: #1B3B6B;
    padding-left: 24px;
    position: relative;
    font-weight: 400;
  }
  .bullet-list li::before {
    content: '';
    position: absolute;
    left: 0;
    top: 50%;
    transform: translateY(-50%);
    width: 8px;
    height: 8px;
    background: #8B7355;
  }
  .bullet-list li:nth-child(even)::before {
    background: #1B3B6B;
    border-radius: 50%;
  }

  /* Emphasis on last bullet */
  .bullet-list li:last-child {
    font-weight: 600;
    color: #1B3B6B;
    font-size: 17px;
    margin-top: 4px;
  }
  .bullet-list li:last-child::before {
    width: 10px;
    height: 10px;
    background: #1B3B6B;
  }

  /* Vertical accent line */
  .vertical-accent {
    position: absolute;
    left: 30px;
    top: 50px;
    bottom: 50px;
    width: 1px;
    background: linear-gradient(to bottom, transparent 0%, #1B3B6B 20%, #1B3B6B 80%, transparent 100%);
    opacity: 0.2;
  }

  /* Number decoration */
  .num-deco {
    position: absolute;
    right: 40px;
    bottom: 40px;
    font-family: 'Noto Serif SC', serif;
    font-size: 80px;
    color: rgba(27,59,107,0.06);
    font-weight: 700;
    line-height: 1;
  }
</style>
</head>
<body>
  <div class="texture"></div>

  <!-- Header -->
  <div class="header">
    <div class="dot"></div>
    <span class="label">开源之道 · 新制度经济学视角</span>
    <span class="lecture-num">第 04 期 · 软件开发劳动力市场</span>
  </div>

  <!-- Main Content -->
  <div class="content">
    <!-- Left: Visual Metaphor -->
    <div class="visual-panel">
      <div class="geo-square geo-square-1"></div>
      <div class="geo-square geo-square-2"></div>
      <div class="geo-circle-deco geo-circle-deco-1"></div>
      <div class="geo-line-deco geo-line-deco-1"></div>

      <div class="eye-container">
        <div class="outer-ring"></div>
        <div class="middle-ring"></div>
        <div class="iris-ring"></div>
        <div class="pupil"></div>
        <div class="pupil-highlight"></div>

        <!-- Radial roads (12 spokes) -->
        <div class="radial-road" style="transform: rotate(0deg);"></div>
        <div class="radial-road" style="transform: rotate(30deg);"></div>
        <div class="radial-road" style="transform: rotate(60deg);"></div>
        <div class="radial-road" style="transform: rotate(90deg);"></div>
        <div class="radial-road" style="transform: rotate(120deg);"></div>
        <div class="radial-road" style="transform: rotate(150deg);"></div>
        <div class="radial-road" style="transform: rotate(180deg);"></div>
        <div class="radial-road" style="transform: rotate(210deg);"></div>
        <div class="radial-road" style="transform: rotate(240deg);"></div>
        <div class="radial-road" style="transform: rotate(270deg);"></div>
        <div class="radial-road" style="transform: rotate(300deg);"></div>
        <div class="radial-road" style="transform: rotate(330deg);"></div>

        <!-- Light rivers -->
        <div class="light-river"></div>
        <div class="light-river-2"></div>

        <!-- Road dots at cardinal points -->
        <div class="road-dot" style="top: 10px; left: 50%; transform: translateX(-50%);"></div>
        <div class="road-dot" style="bottom: 10px; left: 50%; transform: translateX(-50%);"></div>
        <div class="road-dot" style="top: 50%; left: 10px; transform: translateY(-50%);"></div>
        <div class="road-dot" style="top: 50%; right: 10px; transform: translateY(-50%);"></div>
      </div>
    </div>

    <!-- Right: Text Content -->
    <div class="text-panel">
      <div class="vertical-accent"></div>

      <div class="section-label">EDUCATION MARKET · 教育市场</div>
      <h1 class="slide-title">城市之眼：流动的光河</h1>
      <p class="slide-subtitle">放射状路网如瞳孔，聚焦开源教育的力量</p>

      <div class="divider"></div>

      <ul class="bullet-list">
        <li>拓展的教育市场 — 知识需求的无限纵深</li>
        <li>技术是公开可获取的</li>
        <li>无需任何的授权壁垒</li>
        <li>竞争的是口碑和影响力</li>
        <li>弥补教育的实践不足以及职场的过渡</li>
        <li>IT 职业教育堪称一绝，缔造上市公司</li>
      </ul>

      <div class="num-deco">04</div>
    </div>
  </div>

  <!-- Footer -->
  <div class="footer">
    <span class="page">14 / 26</span>
    <div class="footer-line"></div>
    <span class="footer-right">04-LABOR-MARKET · 软件开发劳动力市场</span>
  </div>
</body>
</html>
