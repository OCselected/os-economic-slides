

<!DOCTYPE html>
<html lang="zh-CN"><!-- source_hash: ef4f0cc99a72b13d -->
<head>
<meta charset="UTF-8">
<title>软件交付简史之初代</title>
<style>
html, body {
  width: 1600px;
  height: 900px;
  overflow: hidden;
  margin: 0;
  padding: 0;
  background: #F5F0E8;
  font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  color: #1B3B6B;
  position: relative;
}

/* subtle parchment texture */
body::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    rgba(139,115,85,0.015) 2px,
    rgba(139,115,85,0.015) 4px
  );
  pointer-events: none;
  z-index: 0;
}

.slide {
  position: absolute;
  top: 0; left: 0;
  width: 1600px;
  height: 900px;
  display: flex;
}

/* Left panel - visual metaphor area */
.left-panel {
  width: 720px;
  height: 900px;
  position: relative;
  background: #1B3B6B;
  overflow: hidden;
}

/* Vinyl record - large circle */
.vinyl {
  position: absolute;
  width: 460px;
  height: 460px;
  border-radius: 50%;
  background: #0D0D0D;
  top: 180px;
  left: 100px;
  border: 3px solid #1a1a1a;
  box-shadow: 0 0 0 8px #1a1a1a, 0 0 0 12px #0a0a0a;
}

/* Vinyl center label */
.vinyl-label {
  position: absolute;
  width: 120px;
  height: 120px;
  border-radius: 50%;
  background: #8B2020;
  top: 305px;
  left: 245px;
  border: 2px solid #6b1a1a;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Vinyl spindle */
.vinyl-spindle {
  position: absolute;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: #1a1a1a;
  top: 383px;
  left: 323px;
  border: 1px solid #333;
}

/* Vinyl grooves */
.groove-ring {
  position: absolute;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.06);
  top: 180px;
  left: 100px;
}
.groove-ring:nth-child(1) { width: 340px; height: 340px; top: 240px; left: 160px; }
.groove-ring:nth-child(2) { width: 300px; height: 300px; top: 260px; left: 180px; }
.groove-ring:nth-child(3) { width: 260px; height: 260px; top: 280px; left: 200px; }
.groove-ring:nth-child(4) { width: 220px; height: 220px; top: 300px; left: 220px; }
.groove-ring:nth-child(5) { width: 180px; height: 180px; top: 320px; left: 240px; }
.groove-ring:nth-child(6) { width: 160px; height: 160px; top: 330px; left: 250px; }

/* Tonearm */
.tonearm-base {
  position: absolute;
  width: 30px;
  height: 30px;
  background: #C9302C;
  border-radius: 50%;
  top: 190px;
  left: 550px;
  border: 2px solid #a02522;
  z-index: 10;
}

.tonearm-arm {
  position: absolute;
  width: 4px;
  height: 220px;
  background: #C9302C;
  top: 200px;
  left: 563px;
  transform-origin: top center;
  transform: rotate(-35deg);
  border-radius: 2px;
  z-index: 9;
}

.tonearm-head {
  position: absolute;
  width: 16px;
  height: 24px;
  background: #8B7355;
  top: 395px;
  left: 465px;
  transform: rotate(-35deg);
  border-radius: 2px;
  z-index: 10;
}

/* Red portable case outline */
.player-case {
  position: absolute;
  width: 520px;
  height: 440px;
  border: 3px solid #C9302C;
  top: 160px;
  left: 60px;
  background: rgba(201,48,44,0.08);
  border-radius: 4px;
}

.player-case-corner {
  position: absolute;
  width: 12px;
  height: 12px;
  border: 2px solid #C9302C;
  background: transparent;
}
.case-tl { top: 156px; left: 56px; border-right: none; border-bottom: none; }
.case-tr { top: 156px; left: 576px; border-left: none; border-bottom: none; }
.case-bl { top: 596px; left: 56px; border-right: none; border-top: none; }
.case-br { top: 596px; left: 576px; border-left: none; border-top: none; }

/* Bauhaus decorative elements on left */
.deco-circle-white {
  position: absolute;
  width: 80px;
  height: 80px;
  border-radius: 50%;
  border: 3px solid rgba(255,255,255,0.12);
  top: 50px;
  left: 580px;
}

.deco-square {
  position: absolute;
  width: 40px;
  height: 40px;
  background: rgba(201,48,44,0.25);
  top: 60px;
  left: 40px;
}

.deco-line-h {
  position: absolute;
  width: 60px;
  height: 3px;
  background: rgba(255,255,255,0.15);
  top: 72px;
  left: 110px;
}

/* Label text on vinyl */
.vinyl-label-text {
  position: absolute;
  top: 350px;
  left: 270px;
  color: rgba(255,255,255,0.6);
  font-size: 10px;
  letter-spacing: 2px;
  text-align: center;
  width: 80px;
  font-family: 'Noto Serif SC', serif;
}

/* Caption below visual */
.visual-caption {
  position: absolute;
  bottom: 40px;
  left: 0;
  width: 720px;
  text-align: center;
  color: rgba(255,255,255,0.5);
  font-size: 14px;
  letter-spacing: 1px;
  font-style: italic;
  font-family: 'Noto Serif SC', serif;
}

/* Right panel - content */
.right-panel {
  width: 880px;
  height: 900px;
  padding: 70px 80px;
  position: relative;
}

/* Decorative geometric elements on right */
.deco-circle-blue {
  position: absolute;
  width: 120px;
  height: 120px;
  border-radius: 50%;
  border: 2px solid rgba(27,59,107,0.08);
  top: -30px;
  right: -30px;
}

.deco-square-copper {
  position: absolute;
  width: 60px;
  height: 60px;
  background: rgba(139,115,85,0.08);
  bottom: 80px;
  right: 60px;
}

.deco-line-v {
  position: absolute;
  width: 2px;
  height: 80px;
  background: rgba(27,59,107,0.12);
  top: 300px;
  left: 30px;
}

.deco-line-v2 {
  position: absolute;
  width: 2px;
  height: 60px;
  background: rgba(139,115,85,0.15);
  bottom: 200px;
  right: 30px;
}

/* Era marker */
.era-marker {
  position: absolute;
  top: 50px;
  left: 80px;
  font-family: 'Noto Serif SC', serif;
  font-size: 13px;
  letter-spacing: 3px;
  color: #8B7355;
  text-transform: uppercase;
}

.era-marker::before {
  content: '';
  display: inline-block;
  width: 30px;
  height: 1px;
  background: #8B7355;
  vertical-align: middle;
  margin-right: 12px;
}

/* Slide title */
.slide-title {
  font-family: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', serif;
  font-size: 42px;
  font-weight: 700;
  color: #1B3B6B;
  line-height: 1.3;
  margin: 30px 0 10px 0;
  letter-spacing: 2px;
}

.slide-subtitle {
  font-family: 'Noto Serif SC', serif;
  font-size: 16px;
  color: #8B7355;
  letter-spacing: 1px;
  margin-bottom: 40px;
}

/* Horizontal rule */
.hr-blue {
  width: 60px;
  height: 3px;
  background: #1B3B6B;
  margin: 0 0 35px 0;
}

/* Bullet points */
.bullet-list {
  list-style: none;
  padding: 0;
  margin: 0;
}

.bullet-item {
  display: flex;
  align-items: flex-start;
  margin-bottom: 22px;
  padding-left: 0;
}

.bullet-geo {
  flex-shrink: 0;
  width: 12px;
  height: 12px;
  margin-right: 16px;
  margin-top: 7px;
}

.bullet-geo.circle {
  border-radius: 50%;
  background: #1B3B6B;
}

.bullet-geo.square {
  background: #8B7355;
}

.bullet-geo.outline-circle {
  border-radius: 50%;
  border: 2px solid #1B3B6B;
  background: transparent;
}

.bullet-geo.outline-square {
  border: 2px solid #8B7355;
  background: transparent;
}

.bullet-geo.triangle {
  width: 0;
  height: 0;
  border-left: 7px solid transparent;
  border-right: 7px solid transparent;
  border-bottom: 12px solid #1B3B6B;
  background: transparent;
  margin-top: 6px;
}

.bullet-text {
  font-size: 18px;
  line-height: 1.7;
  color: #1B3B6B;
  letter-spacing: 0.5px;
}

.bullet-text .highlight {
  color: #8B7355;
  font-weight: 600;
}

/* Bottom annotation */
.bottom-annotation {
  position: absolute;
  bottom: 40px;
  right: 80px;
  font-family: 'Noto Serif SC', serif;
  font-size: 12px;
  color: #8B7355;
  letter-spacing: 1px;
  font-style: italic;
}

/* Large decorative circle on right panel */
.deco-large-circle {
  position: absolute;
  width: 300px;
  height: 300px;
  border-radius: 50%;
  border: 1px solid rgba(27,59,107,0.05);
  bottom: -100px;
  right: -80px;
}

.deco-small-square {
  position: absolute;
  width: 18px;
  height: 18px;
  background: #1B3B6B;
  opacity: 0.06;
  top: 180px;
  right: 40px;
}

/* Contrast label */
.contrast-label {
  position: absolute;
  bottom: 55px;
  right: 80px;
  font-size: 11px;
  color: rgba(139,115,85,0.7);
  letter-spacing: 2px;
}
</style>
</head>
<body>
<div class="slide">
  <!-- Left Panel: Visual Metaphor -->
  <div class="left-panel">
    <!-- Bauhaus decorations -->
    <div class="deco-square"></div>
    <div class="deco-line-h"></div>
    <div class="deco-circle-white"></div>

    <!-- Player case outline -->
    <div class="player-case"></div>
    <div class="player-case-corner case-tl"></div>
    <div class="player-case-corner case-tr"></div>
    <div class="player-case-corner case-bl"></div>
    <div class="player-case-corner case-br"></div>

    <!-- Vinyl record -->
    <div class="vinyl"></div>
    <div class="groove-ring" style="width:340px;height:340px;top:240px;left:160px;"></div>
    <div class="groove-ring" style="width:300px;height:300px;top:260px;left:180px;"></div>
    <div class="groove-ring" style="width:260px;height:260px;top:280px;left:200px;"></div>
    <div class="groove-ring" style="width:220px;height:220px;top:300px;left:220px;"></div>
    <div class="groove-ring" style="width:180px;height:180px;top:320px;left:240px;"></div>
    <div class="groove-ring" style="width:160px;height:160px;top:330px;left:250px;"></div>

    <!-- Center label -->
    <div class="vinyl-label"></div>
    <div class="vinyl-spindle"></div>
    <div class="vinyl-label-text">SIDE A</div>

    <!-- Tonearm -->
    <div class="tonearm-base"></div>
    <div class="tonearm-arm"></div>
    <div class="tonearm-head"></div>

    <!-- Caption -->
    <div class="visual-caption">模拟时代的仪式感 · 唱针划过沟槽的笃定</div>
  </div>

  <!-- Right Panel: Content -->
  <div class="right-panel">
    <!-- Decorations -->
    <div class="deco-circle-blue"></div>
    <div class="deco-square-copper"></div>
    <div class="deco-line-v"></div>
    <div class="deco-line-v2"></div>
    <div class="deco-large-circle"></div>
    <div class="deco-small-square"></div>

    <!-- Era marker -->
    <div class="era-marker">第 01 期 · 软件的生产、分销和消费</div>

    <!-- Title -->
    <h1 class="slide-title">软件交付简史之初代</h1>
    <div class="slide-subtitle">— 绑定于钢铁与电路的固件时代 —</div>

    <!-- Divider -->
    <div class="hr-blue"></div>

    <!-- Bullet points -->
    <ul class="bullet-list">
      <li class="bullet-item">
        <span class="bullet-geo circle"></span>
        <span class="bullet-text">软件<span class="highlight">与硬件不可分割</span>——代码即电路，交付即物理</span>
      </li>
      <li class="bullet-item">
        <span class="bullet-geo square"></span>
        <span class="bullet-text">大型机<span class="highlight">屈指可数</span>，部署门槛近乎天文数字</span>
      </li>
      <li class="bullet-item">
        <span class="bullet-geo outline-circle"></span>
        <span class="bullet-text"><span class="highlight">定制</span>占据很大比重——为每一个客户重写系统</span>
      </li>
      <li class="bullet-item">
        <span class="bullet-geo triangle"></span>
        <span class="bullet-text">安装调试<span class="highlight">像极了化工机械厂</span>——庞大、笨重、漫长</span>
      </li>
      <li class="bullet-item">
        <span class="bullet-geo outline-square"></span>
        <span class="bullet-text">用户需求<span class="highlight">高度异质</span>，不存在统一的标准品</span>
      </li>
    </ul>

    <!-- Bottom note -->
    <div class="bottom-annotation">如黑胶唱片之于唱机 · 软件之于大型机</div>
  </div>
</div>
</body>
</html>
