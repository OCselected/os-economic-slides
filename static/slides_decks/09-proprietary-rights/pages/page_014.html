

<!DOCTYPE html><html><!-- source_hash: 2cc9b70888dfa1ca --><head><meta charset="UTF-8"><title>第 09 期 · Copyleft 的制度设计</title><style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:1600px;height:900px;overflow:hidden;margin:0;}
body{background:#F5F0E8;font-family:'Noto Sans SC','Source Han Serif SC','Songti SC',serif;color:#1B3B6B;position:relative;}
#canvas{width:1600px;height:900px;position:relative;overflow:hidden;}
.parchment-texture{position:absolute;top:0;left:0;width:1600px;height:900px;background:
  radial-gradient(ellipse at 20% 30%, rgba(139,115,85,0.04) 0%, transparent 50%),
  radial-gradient(ellipse at 80% 70%, rgba(27,59,107,0.03) 0%, transparent 50%),
  radial-gradient(ellipse at 50% 50%, rgba(139,115,85,0.02) 0%, transparent 70%);
  pointer-events:none;}

/* Header */
.header{position:absolute;top:48px;left:80px;right:80px;display:flex;justify-content:space-between;align-items:flex-end;}
.lecture-tag{font-family:'Noto Serif SC','Source Han Serif SC',serif;font-size:13px;letter-spacing:3px;color:#8B7355;}
.slide-num{font-family:'Noto Serif SC',serif;font-size:13px;letter-spacing:3px;color:#8B7355;}

/* Main title area */
.title-block{position:absolute;top:108px;left:80px;width:820px;}
.title-main{font-family:'Noto Serif SC','Source Han Serif SC',serif;font-size:52px;font-weight:700;color:#1B3B6B;line-height:1.15;letter-spacing:1px;}
.title-underline{width:120px;height:4px;background:#1B3B6B;margin-top:20px;}
.title-sub{font-family:'Noto Serif SC',serif;font-size:18px;color:#8B7355;margin-top:14px;letter-spacing:1px;}

/* Left content */
.content-left{position:absolute;top:330px;left:80px;width:820px;}
.bullet{display:flex;align-items:flex-start;margin-bottom:22px;}
.bullet-dot{width:10px;height:10px;background:#1B3B6B;margin-top:9px;margin-right:18px;flex-shrink:0;}
.bullet-dot.copper{background:#8B7355;}
.bullet-text{font-family:'Noto Sans SC',sans-serif;font-size:19px;line-height:1.7;color:#1B3B6B;letter-spacing:0.5px;}
.bullet-text em{font-style:normal;color:#8B7355;font-weight:600;}
.bullet-text strong{font-weight:700;color:#1B3B6B;}

/* Visual right side - the seal stamp composition */
.visual-area{position:absolute;top:108px;right:60px;width:620px;height:720px;}

/* Document rectangle */
.doc-rect{position:absolute;top:40px;right:40px;width:520px;height:620px;background:#F5F0E8;border:2px solid #1B3B6B;}
.doc-lines{position:absolute;top:80px;right:70px;width:470px;}
.doc-line{height:2px;background:#1B3B6B;opacity:0.35;margin-bottom:18px;}
.doc-line.short{width:60%;}
.doc-line.medium{width:80%;}

/* Central seal */
.seal-center{position:absolute;top:220px;right:220px;width:180px;height:180px;}
.seal-outer{position:absolute;top:0;left:0;width:180px;height:180px;border:3px solid #1B3B6B;border-radius:50%;}
.seal-inner{position:absolute;top:20px;left:20px;width:140px;height:140px;border:2px solid #1B3B6B;border-radius:50%;}
.seal-core{position:absolute;top:50px;left:50px;width:80px;height:80px;background:#1B3B6B;border-radius:50%;display:flex;align-items:center;justify-content:center;}
.seal-core-text{font-family:'Noto Serif SC',serif;font-size:18px;color:#F5F0E8;letter-spacing:2px;font-weight:700;}
.seal-cross-h{position:absolute;top:87px;left:-20px;width:220px;height:3px;background:#1B3B6B;}
.seal-cross-v{position:absolute;top:-20px;left:87px;width:3px;height:220px;background:#1B3B6B;}

/* Infectious spread patterns - concentric circles around the seal */
.spread-ring{position:absolute;top:220px;right:220px;width:180px;height:180px;border:1px solid #1B3B6B;border-radius:50%;opacity:0.25;}
.spread-ring.r2{width:260px;height:260px;top:180px;right:180px;opacity:0.18;}
.spread-ring.r3{width:340px;height:340px;top:140px;right:140px;opacity:0.12;}
.spread-ring.r4{width:420px;height:420px;top:100px;right:100px;opacity:0.08;}

/* Small stamp copies spreading */
.mini-stamp{position:absolute;width:50px;height:50px;border:2px solid #1B3B6B;border-radius:50%;opacity:0.5;}
.mini-stamp::before{content:'';position:absolute;top:12px;left:12px;width:26px;height:26px;background:#1B3B6B;border-radius:50%;opacity:0.7;}
.ms1{top:130px;right:130px;}
.ms2{top:150px;right:480px;opacity:0.35;}
.ms3{top:470px;right:130px;opacity:0.4;}
.ms4{top:470px;right:460px;opacity:0.3;}
.ms5{top:620px;right:300px;opacity:0.25;width:40px;height:40px;}
.ms5::before{top:10px;left:10px;width:20px;height:20px;}

/* Connecting lines from seal */
.spread-line{position:absolute;background:#1B3B6B;height:1px;opacity:0.2;}
.sl1{top:220px;right:200px;width:200px;transform:rotate(45deg);transform-origin:left center;}
.sl2{top:400px;right:200px;width:280px;opacity:0.15;}
.sl3{top:220px;right:420px;width:200px;transform:rotate(-45deg);transform-origin:left center;}

/* Bauhaus geometric accents */
.geo-square{position:absolute;top:70px;right:20px;width:20px;height:20px;background:#1B3B6B;}
.geo-circle{position:absolute;top:100px;right:30px;width:14px;height:14px;border:2px solid #8B7355;border-radius:50%;}

/* Footer */
.footer{position:absolute;bottom:40px;left:80px;right:80px;display:flex;justify-content:space-between;align-items:center;}
.footer-left{font-family:'Noto Serif SC',serif;font-size:12px;color:#8B7355;letter-spacing:2px;}
.footer-right{font-family:'Noto Serif SC',serif;font-size:12px;color:#8B7355;letter-spacing:2px;}

/* Decorative vertical line */
.vline-left{position:absolute;top:108px;left:64px;width:2px;height:680px;background:#1B3B6B;opacity:0.15;}
.vline-right{position:absolute;top:108px;right:44px;width:2px;height:680px;background:#1B3B6B;opacity:0.15;}

/* Big Bauhaus circle decoration top-right corner */
.corner-circle{position:absolute;top:20px;right:20px;width:50px;height:50px;border:3px solid #1B3B6B;border-radius:50%;}

/* Number element */
.big-number{position:absolute;bottom:100px;right:60px;font-family:'Noto Serif SC',serif;font-size:14px;color:#8B7355;letter-spacing:3px;}
</style></head><body><div id="canvas"><div class="parchment-texture"></div>

  <div class="bullet">

<div class="visual-area">
  <div class="doc-rect">
    <div class="geo-square"></div>
    <div class="geo-circle"></div>
    <div class="doc-lines">
      <div class="doc-line"></div>

    <div class="spread-line sl1"></div>

<div class="footer">
