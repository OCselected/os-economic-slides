

<!DOCTYPE html>
<html><!-- source_hash: 1842d2962571fcfa -->
<head>
<meta charset="UTF-8">
<title>第 03 期 · 商业模式：无形财产与交易秩序</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;600&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 1600px;
  height: 900px;
  overflow: hidden;
  margin: 0;
}

body {
  background: #F5F0E8;
  position: relative;
  font-family: 'Noto Sans SC', sans-serif;
  color: #1B3B6B;
}

/* Subtle parchment texture */
body::before {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 1600px; height: 900px;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 3px,
    rgba(139, 115, 85, 0.015) 3px,
    rgba(139, 115, 85, 0.015) 4px
  ),
  repeating-linear-gradient(
    90deg,
    transparent,
    transparent 5px,
    rgba(139, 115, 85, 0.01) 5px,
    rgba(139, 115, 85, 0.01) 6px
  );
  pointer-events: none;
  z-index: 1;
}

/* Header */
.header {
  position: absolute;
  top: 50px;
  left: 80px;
  right: 80px;
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  z-index: 10;
}

.header-title {
  font-family: 'Noto Serif SC', 'Source Han Serif SC', serif;
  font-size: 14px;
  font-weight: 500;
  color: #8B7355;
  letter-spacing: 2px;
}

.header-num {
  font-family: 'Noto Serif SC', serif;
  font-size: 13px;
  color: #8B7355;
  letter-spacing: 1px;
}

/* Main geometric composition area */
.composition {
  position: absolute;
  top: 110px;
  left: 80px;
  width: 620px;
  height: 700px;
  z-index: 5;
}

/* Perspective lines - suggesting supermarket aisle */
.aisle-line {
  position: absolute;
  background: #1B3B6B;
  opacity: 0.15;
}

.line-1 { top: 700px; left: 50px; width: 520px; height: 1.5px; transform-origin: left center; transform: rotate(-12deg); }
.line-2 { top: 720px; left: 50px; width: 520px; height: 1px; transform-origin: left center; transform: rotate(-14deg); }
.line-3 { top: 680px; left: 50px; width: 520px; height: 1px; transform-origin: left center; transform: rotate(-10deg); }

/* Vanishing point dot */
.vanishing-dot {
  position: absolute;
  top: 300px;
  left: 295px;
  width: 8px;
  height: 8px;
  background: #1B3B6B;
  border-radius: 50%;
  opacity: 0.6;
}

/* Cart handle - first person perspective arc */
.cart-arc {
  position: absolute;
  bottom: 60px;
  left: 150px;
  width: 320px;
  height: 160px;
  border: 3px solid #1B3B6B;
  border-bottom: none;
  border-radius: 50% 50% 0 0;
  opacity: 0.5;
}

/* Cart basket - trapezoid shape */
.cart-basket {
  position: absolute;
  bottom: 20px;
  left: 130px;
  width: 360px;
  height: 120px;
  border: 3px solid #1B3B6B;
  border-top: none;
  border-radius: 0 0 10px 10px;
  opacity: 0.4;
}

/* Cart wheels */
.cart-wheel {
  position: absolute;
  bottom: 0px;
  width: 30px;
  height: 30px;
  border: 3px solid #1B3B6B;
  border-radius: 50%;
  opacity: 0.5;
}

.wheel-left { left: 145px; }
.wheel-right { right: 145px; }

/* Shelf blocks - rectangular elements suggesting goods */
.shelf-block {
  position: absolute;
  background: #1B3B6B;
  opacity: 0.08;
}

.shelf-1 { top: 200px; left: 80px; width: 100px; height: 180px; }
.shelf-2 { top: 180px; left: 210px; width: 80px; height: 200px; }
.shelf-3 { top: 220px; left: 320px; width: 90px; height: 160px; }
.shelf-4 { top: 250px; left: 440px; width: 110px; height: 130px; }

/* Floating circles - products/goods */
.product-circle {
  position: absolute;
  border-radius: 50%;
  border: 2px solid #8B7355;
  opacity: 0.4;
}

.pc-1 { top: 180px; left: 350px; width: 50px; height: 50px; }
.pc-2 { top: 320px; left: 420px; width: 35px; height: 35px; }
.pc-3 { top: 400px; left: 180px; width: 60px; height: 60px; }
.pc-4 { top: 280px; left: 500px; width: 40px; height: 40px; }

/* Small filled circles - accents */
.dot-accent {
  position: absolute;
  border-radius: 50%;
  background: #1B3B6B;
}

.dot-1 { top: 150px; left: 450px; width: 12px; height: 12px; opacity: 0.7; }
.dot-2 { top: 450px; left: 380px; width: 18px; height: 18px; opacity: 0.5; }
.dot-3 { top: 500px; left: 200px; width: 10px; height: 10px; opacity: 0.6; }

/* Diagonal line accent */
.diagonal-accent {
  position: absolute;
  background: #8B7355;
  opacity: 0.3;
}

.diag-1 { top: 50px; left: 550px; width: 200px; height: 1.5px; transform: rotate(35deg); transform-origin: left center; }
.diag-2 { top: 580px; left: 50px; width: 120px; height: 2px; transform: rotate(-25deg); transform-origin: left center; }

/* Large square - background element */
.bg-square {
  position: absolute;
  top: 100px;
  right: 40px;
  width: 200px;
  height: 200px;
  border: 2px solid #1B3B6B;
  opacity: 0.06;
}

/* Right side content */
.content-area {
  position: absolute;
  top: 130px;
  right: 80px;
  width: 780px;
  z-index: 10;
}

.slide-title {
  font-family: 'Noto Serif SC', 'Source Han Serif SC', serif;
  font-size: 42px;
  font-weight: 700;
  color: #1B3B6B;
  line-height: 1.4;
  margin-bottom: 12px;
  letter-spacing: 1px;
}

.slide-subtitle {
  font-family: 'Noto Serif SC', serif;
  font-size: 16px;
  color: #8B7355;
  margin-bottom: 40px;
  letter-spacing: 2px;
  font-weight: 400;
}

/* Divider line */
.divider {
  width: 60px;
  height: 3px;
  background: #1B3B6B;
  margin-bottom: 35px;
  opacity: 0.7;
}

/* Content points */
.points {
  list-style: none;
  padding: 0;
}

.points li {
  font-family: 'Noto Sans SC', sans-serif;
  font-size: 19px;
  color: #1B3B6B;
  line-height: 2.2;
  padding-left: 30px;
  position: relative;
  font-weight: 400;
}

.points li::before {
  content: '';
  position: absolute;
  left: 0;
  top: 50%;
  transform: translateY(-50%);
  width: 12px;
  height: 12px;
  background: #8B7355;
  opacity: 0.6;
}

.points li.highlight {
  font-weight: 600;
  color: #1B3B6B;
}

.points li.highlight::before {
  background: #1B3B6B;
  opacity: 1;
  border-radius: 50%;
}

/* Footnote / context */
.footnote {
  position: absolute;
  bottom: 45px;
  left: 80px;
  right: 80px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  z-index: 10;
}

.footnote-left {
  font-family: 'Noto Sans SC', sans-serif;
  font-size: 12px;
  color: #8B7355;
  letter-spacing: 1px;
}

.footnote-right {
  font-family: 'Noto Serif SC', serif;
  font-size: 12px;
  color: #8B7355;
  letter-spacing: 1px;
}

/* Bottom border accent */
.bottom-accent {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 4px;
  background: #1B3B6B;
  opacity: 0.1;
  z-index: 2;
}

/* Left vertical line */
.left-line {
  position: absolute;
  top: 110px;
  left: 60px;
  width: 1.5px;
  height: 700px;
  background: #1B3B6B;
  opacity: 0.12;
}

/* Category label */
.category-label {
  position: absolute;
  top: 130px;
  right: 80px;
  font-family: 'Noto Serif SC', serif;
  font-size: 11px;
  color: #8B7355;
  letter-spacing: 3px;
  text-transform: uppercase;
  opacity: 0.7;
  z-index: 11;
}

/* Perspective triangle suggesting floor/ground */
.floor-triangle {
  position: absolute;
  bottom: 20px;
  left: 80px;
  width: 0;
  height: 0;
  border-left: 310px solid transparent;
  border-right: 310px solid transparent;
  border-bottom: 60px solid rgba(27, 59, 107, 0.04);
}

/* Grid dots pattern */
.grid-pattern {
  position: absolute;
  top: 550px;
  left: 80px;
  display: grid;
  grid-template-columns: repeat(5, 8px);
  gap: 15px;
  z-index: 3;
}

.grid-dot {
  width: 4px;
  height: 4px;
  background: #8B7355;
  border-radius: 50%;
  opacity: 0.3;
}

</style>
</head>

<div class="left-line"></div>

<!-- Footnote -->

  <div class="footnote-left">包豪斯几何构成 · 消费选择与获取商品的旅程</div>

</div>

<!-- Bottom accent bar -->
<div class="bottom-accent"></div>
