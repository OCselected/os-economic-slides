

<!DOCTYPE html>
<html lang="zh-CN"><!-- source_hash: 115069ba51847630 -->
<head>
<meta charset="UTF-8">
<title>第十期 · 排他权与容他权、比例原则与 Copyleft</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1600px;
    height: 900px;
    overflow: hidden;
    background: #1B3B6B;
    font-family: 'Noto Sans SC', sans-serif;
  }

  .canvas {
    position: relative;
    width: 1600px;
    height: 900px;
    background: #1B3B6B;
  }

  /* Subtle parchment texture overlay */
  .texture {
    position: absolute;
    top: 0; left: 0;
    width: 1600px;
    height: 900px;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(255,255,255,0.008) 2px,
      rgba(255,255,255,0.008) 4px
    );
    pointer-events: none;
  }

  /* Bauhaus geometric elements */
  .circle-large {
    position: absolute;
    width: 520px;
    height: 520px;
    border-radius: 50%;
    border: 1.5px solid rgba(201, 178, 130, 0.15);
    top: -120px;
    right: -80px;
  }

  .circle-medium {
    position: absolute;
    width: 320px;
    height: 320px;
    border-radius: 50%;
    background: rgba(201, 178, 130, 0.04);
    border: 1px solid rgba(201, 178, 130, 0.1);
    bottom: -60px;
    left: -60px;
  }

  .circle-small {
    position: absolute;
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: rgba(201, 178, 130, 0.08);
    top: 180px;
    left: 200px;
  }

  .square-deco {
    position: absolute;
    width: 180px;
    height: 180px;
    border: 1px solid rgba(201, 178, 130, 0.12);
    bottom: 200px;
    right: 180px;
    transform: rotate(0deg);
  }

  .square-fill {
    position: absolute;
    width: 40px;
    height: 40px;
    background: rgba(201, 178, 130, 0.12);
    top: 300px;
    left: 120px;
  }

  .line-h {
    position: absolute;
    height: 1px;
    background: rgba(201, 178, 130, 0.2);
    width: 400px;
    top: 420px;
    left: 480px;
  }

  .line-h-short {
    position: absolute;
    height: 1px;
    background: rgba(201, 178, 130, 0.15);
    width: 200px;
    top: 560px;
    left: 480px;
  }

  .line-v {
    position: absolute;
    width: 1px;
    background: rgba(201, 178, 130, 0.12);
    height: 300px;
    top: 100px;
    left: 440px;
  }

  .line-v-right {
    position: absolute;
    width: 1px;
    background: rgba(201, 178, 130, 0.1);
    height: 500px;
    top: 200px;
    right: 120px;
  }

  /* Content */
  .content {
    position: absolute;
    top: 240px;
    left: 480px;
    width: 900px;
  }

  .series-label {
    font-family: 'Noto Sans SC', sans-serif;
    font-size: 14px;
    letter-spacing: 6px;
    color: rgba(201, 178, 130, 0.6);
    text-transform: uppercase;
    margin-bottom: 28px;
  }

  .lecture-number {
    font-family: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', serif;
    font-size: 180px;
    font-weight: 700;
    color: rgba(201, 178, 130, 0.95);
    line-height: 0.85;
    letter-spacing: -4px;
    margin-bottom: 36px;
  }

  .lecture-number sup {
    font-size: 48px;
    vertical-align: super;
    font-weight: 400;
    opacity: 0.7;
  }

  .main-title {
    font-family: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', serif;
    font-size: 42px;
    font-weight: 600;
    color: #F5F0E8;
    line-height: 1.5;
    margin-bottom: 20px;
    letter-spacing: 2px;
  }

  .deck-info {
    font-family: 'Noto Sans SC', sans-serif;
    font-size: 16px;
    color: rgba(245, 240, 232, 0.55);
    letter-spacing: 3px;
    line-height: 1.8;
  }

  .footer {
    position: absolute;
    bottom: 60px;
    left: 480px;
    font-family: 'Noto Sans SC', sans-serif;
    font-size: 14px;
    color: rgba(201, 178, 130, 0.45);
    letter-spacing: 4px;
  }

  /* Large decorative X for the 10 */
  .deco-x {
    position: absolute;
    font-family: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', serif;
    font-size: 400px;
    color: rgba(201, 178, 130, 0.04);
    line-height: 1;
    top: 80px;
    right: 80px;
    font-weight: 700;
    user-select: none;
  }

  /* Corner marks */
  .corner-tl {
    position: absolute;
    top: 40px;
    left: 40px;
    width: 24px;
    height: 24px;
    border-top: 1px solid rgba(201, 178, 130, 0.3);
    border-left: 1px solid rgba(201, 178, 130, 0.3);
  }

  .corner-br {
    position: absolute;
    bottom: 40px;
    right: 40px;
    width: 24px;
    height: 24px;
    border-bottom: 1px solid rgba(201, 178, 130, 0.3);
    border-right: 1px solid rgba(201, 178, 130, 0.3);
  }

  /* Triangle accent */
  .triangle {
    position: absolute;
    width: 0;
    height: 0;
    border-left: 30px solid transparent;
    border-right: 30px solid transparent;
    border-bottom: 52px solid rgba(201, 178, 130, 0.06);
    bottom: 320px;
    right: 280px;
  }
</style>
</head>
<body>
<div class="canvas">
  <div class="texture"></div>

  <!-- Bauhaus geometric decorations -->
  <div class="circle-large"></div>
  <div class="circle-medium"></div>
  <div class="circle-small"></div>
  <div class="square-deco"></div>
  <div class="square-fill"></div>
  <div class="line-h"></div>
  <div class="line-h-short"></div>
  <div class="line-v"></div>
  <div class="line-v-right"></div>
  <div class="triangle"></div>
  <div class="corner-tl"></div>
  <div class="corner-br"></div>

  <!-- Ghost number -->
  <div class="deco-x">10</div>

  <!-- Main content -->
  <div class="content">
    <div class="series-label">OPEN SOURCE ECONOMICS · 开源经济学</div>
    <div class="lecture-number">10<sup>th</sup></div>
    <div class="main-title">排他权与容他权<br>比例原则与 Copyleft</div>
    <div class="deck-info">「开源之道」· 开源的经济学 &nbsp;·&nbsp; 12 讲座 · 第十期</div>
  </div>

  <!-- Footer -->
  <div class="footer">「开源之道」· 适兕</div>
</div>
</body>
</html>
