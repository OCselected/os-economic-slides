

<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<title>关于讲座的规则说明</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body, html {
  width: 1600px;
  height: 900px;
  overflow: hidden;
  margin: 0;
  background: #F5F0E8;
}

body {
  font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  color: #1B3B6B;
  position: relative;
}

/* Subtle parchment texture via layered gradients */
body::before {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 1600px; height: 900px;
  background: 
    radial-gradient(ellipse at 20% 80%, rgba(139,115,85,0.03) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 20%, rgba(27,59,107,0.02) 0%, transparent 50%);
  pointer-events: none;
  z-index: 0;
}

/* Header area */
.header {
  position: absolute;
  top: 60px;
  left: 80px;
  width: 1440px;
  z-index: 10;
}

.header-line {
  width: 80px;
  height: 3px;
  background: #1B3B6B;
  margin-bottom: 20px;
}

.lecture-tag {
  font-family: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', serif;
  font-size: 14px;
  letter-spacing: 4px;
  color: #8B7355;
  margin-bottom: 16px;
}

h1 {
  font-family: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', serif;
  font-size: 42px;
  font-weight: 700;
  color: #1B3B6B;
  line-height: 1.3;
  letter-spacing: 2px;
}

/* Visual metaphor - Moai geometric abstraction */
.visual-panel {
  position: absolute;
  top: 240px;
  left: 80px;
  width: 480px;
  height: 560px;
  z-index: 5;
}

/* Moai body - main rectangle */
.moai-body {
  position: absolute;
  bottom: 60px;
  left: 120px;
  width: 200px;
  height: 320px;
  background: #1B3B6B;
  border-radius: 0;
}

/* Moai head - rounded rectangle on top of body */
.moai-head {
  position: absolute;
  bottom: 370px;
  left: 140px;
  width: 160px;
  height: 120px;
  background: #1B3B6B;
  border-radius: 30px 30px 10px 10px;
}

/* Moai eyes - simple rectangles */
.moai-eye-left {
  position: absolute;
  bottom: 430px;
  left: 175px;
  width: 22px;
  height: 10px;
  background: #F5F0E8;
  border-radius: 2px;
}

.moai-eye-right {
  position: absolute;
  bottom: 430px;
  left: 225px;
  width: 22px;
  height: 10px;
  background: #F5F0E8;
  border-radius: 2px;
}

/* Moai nose - thin rectangle */
.moai-nose {
  position: absolute;
  bottom: 395px;
  left: 205px;
  width: 10px;
  height: 35px;
  background: #2a4f7f;
}

/* Moai mouth - horizontal line */
.moai-mouth {
  position: absolute;
  bottom: 385px;
  left: 185px;
  width: 50px;
  height: 4px;
  background: #F5F0E8;
  border-radius: 2px;
}

/* Pukao - the red hat cylinder */
.pukao {
  position: absolute;
  bottom: 480px;
  left: 150px;
  width: 140px;
  height: 35px;
  background: #8B3A2F;
  border-radius: 3px 3px 0 0;
}

.pukao-shadow {
  position: absolute;
  bottom: 478px;
  left: 155px;
  width: 130px;
  height: 6px;
  background: #6B2A22;
  border-radius: 2px;
}

/* Geometric decorative elements */
.geo-circle-large {
  position: absolute;
  top: 280px;
  right: 60px;
  width: 200px;
  height: 200px;
  border: 3px solid #8B7355;
  border-radius: 50%;
  opacity: 0.15;
  z-index: 1;
}

.geo-square-deco {
  position: absolute;
  top: 380px;
  left: 30px;
  width: 60px;
  height: 60px;
  background: #8B7355;
  opacity: 0.12;
  transform: rotate(45deg);
  z-index: 1;
}

.geo-line-vert {
  position: absolute;
  top: 240px;
  left: 590px;
  width: 2px;
  height: 560px;
  background: #1B3B6B;
  opacity: 0.15;
  z-index: 2;
}

.geo-circle-small {
  position: absolute;
  top: 720px;
  left: 40px;
  width: 80px;
  height: 80px;
  border: 2px solid #1B3B6B;
  border-radius: 50%;
  opacity: 0.1;
  z-index: 1;
}

/* Base/pedestal for Moai */
.moai-base {
  position: absolute;
  bottom: 30px;
  left: 80px;
  width: 280px;
  height: 30px;
  background: #555;
  opacity: 0.3;
}

/* Content rules area */
.rules-panel {
  position: absolute;
  top: 270px;
  left: 650px;
  width: 850px;
  z-index: 10;
}

.rule-item {
  display: flex;
  align-items: flex-start;
  margin-bottom: 28px;
  padding-left: 0;
}

.rule-number {
  font-family: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', serif;
  font-size: 22px;
  font-weight: 700;
  color: #8B7355;
  width: 44px;
  flex-shrink: 0;
  line-height: 1.6;
}

.rule-content {
  flex: 1;
}

.rule-title {
  font-family: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', serif;
  font-size: 22px;
  font-weight: 600;
  color: #1B3B6B;
  line-height: 1.5;
  margin-bottom: 4px;
}

.rule-desc {
  font-size: 15px;
  color: #555;
  line-height: 1.7;
  letter-spacing: 0.5px;
}

/* Footer */
.footer {
  position: absolute;
  bottom: 40px;
  left: 80px;
  width: 1440px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  z-index: 10;
}

.footer-left {
  font-size: 12px;
  color: #8B7355;
  letter-spacing: 2px;
}

.footer-right {
  font-family: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', serif;
  font-size: 12px;
  color: #8B7355;
  letter-spacing: 1px;
}

/* Small decorative dot pattern */
.dot-row {
  position: absolute;
  bottom: 42px;
  left: 640px;
  display: flex;
  gap: 8px;
  z-index: 10;
}

.dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #8B7355;
  opacity: 0.4;
}

/* Horizontal accent line */
.accent-line {
  position: absolute;
  top: 230px;
  left: 650px;
  width: 850px;
  height: 1px;
  background: #1B3B6B;
  opacity: 0.2;
}

/* Subtitle in visual panel */
.visual-caption {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 480px;
  text-align: center;
  font-family: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', serif;
  font-size: 14px;
  color: #8B7355;
  letter-spacing: 2px;
  line-height: 1.6;
}

/* Circle accent near title */
.circle-accent {
  position: absolute;
  top: 70px;
  right: 80px;
  width: 30px;
  height: 30px;
  border: 2px solid #8B7355;
  border-radius: 50%;
  opacity: 0.5;
  z-index: 10;
}

/* Small square accent */
.square-accent {
  position: absolute;
  top: 78px;
  right: 130px;
  width: 14px;
  height: 14px;
  background: #1B3B6B;
  opacity: 0.3;
  z-index: 10;
}
</style>

<body>

<!-- Decorative geometric elements -->
<div class="geo-circle-large"></div>
<div class="geo-square-deco"></div>
<div class="geo-circle-small"></div>

<!-- Header -->

  <div class="header-line"></div>
  <div class="lecture-tag">第 11 期 · 文化的重要作用</div>
  <h1>关于讲座的规则说明</h1>
</div>

<div class="circle-accent"></div>
<div class="square-accent"></div>

  <div class="pukao-shadow"></div>

  <div class="moai-eye-left"></div>

  <div class="moai-nose"></div>
  <div class="moai-mouth"></div>
  <div class="moai-body"></div>

  <div class="visual-caption">文化制度中地位与权力的可视化</div>
</div>

<!-- Vertical separator -->
<div class="geo-line-vert"></div>

<!-- Horizontal accent -->
<div class="accent-line"></div>

<!-- Rules Content -->

    <div class="rule-number">01</div>
    <div class="rule-content">
      <div class="rule-title">随时交流或提问</div>
      <div class="rule-desc">不必等到最后，灵感闪现即刻言说</div>
    </div>
  </div>
  <div class="rule-item">
    <div class="rule-number">02</div>
    <div class="rule-content">
      <div class="rule-title">指出错误有奖励</div>
      <div class="rule-desc">每一处纠谬都是共建知识的贡献</div>
    </div>
  </div>
  <div class="rule-item">
    <div class="rule-number">03</div>
    <div class="rule-content">
      <div class="rule-title">所有的错误，我个人负责</div>
      <div class="rule-desc">不承担道德压力，鼓励坦率交流</div>

  </div>
  <div class="rule-item">
    <div class="rule-number">04</div>
    <div class="rule-content">
      <div class="rule-title">个人的视角是有限的，协作更佳</div>
      <div class="rule-desc">开放地接纳多元认知框架</div>
    </div>
  </div>
  <div class="rule-item">
    <div class="rule-number">05</div>
    <div class="rule-content">
      <div class="rule-title">项目开始，就没有结束</div>
      <div class="rule-desc">持续迭代，在开放中生长</div>
    </div>
  </div>
  <div class="rule-item">
    <div class="rule-number">06</div>
    <div class="rule-content">
      <div class="rule-title">遵循「开源之道」</div>
      <div class="rule-desc">透明、协作、贡献、共享</div>
    </div>
  </div>
</div>

<!-- Footer -->
<div class="footer">
  <div class="footer-left">OPEN SOURCE ECONOMIC LECTURES</div>
  <div class="dot-row">
