<head>
<meta charset="UTF-8">
<title>推荐阅读 · 第08期</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1600px; height: 900px; overflow: hidden; }
  body {
    background: #F5F0E8;
    position: relative;
    font-family: 'Noto Sans SC', sans-serif;
  }
  /* Subtle parchment texture */
  body::before {
    content: '';
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(139,115,85,0.02) 2px,
      rgba(139,115,85,0.02) 4px
    );
    pointer-events: none;
    z-index: 0;
  }
  /* Left vertical line */
  .v-line-left {
    position: absolute;
    top: 0; left: 80px;
    width: 2px; height: 900px;
    background: #1B3B6B;
    opacity: 0.15;
  }
  /* Right vertical line */
  .v-line-right {
    position: absolute;
    top: 0; right: 80px;
    width: 2px; height: 900px;
    background: #1B3B6B;
    opacity: 0.15;
  }
  /* Top horizontal line */
  .h-line-top {
    position: absolute;
    top: 50px; left: 80px;
    width: 1440px; height: 2px;
    background: #1B3B6B;
    opacity: 0.1;
  }
  /* Decorative circle - top left */
  .circle-top {
    position: absolute;
    top: -60px; left: 120px;
    width: 120px; height: 120px;
    border-radius: 50%;
    border: 2px solid #1B3B6B;
    opacity: 0.08;
  }
  /* Decorative circle - bottom right */
  .circle-bottom {
    position: absolute;
    bottom: -80px; right: 150px;
    width: 160px; height: 160px;
    border-radius: 50%;
    background: #8B7355;
    opacity: 0.06;
  }
  /* Lecture tag */
  .lecture-tag {
    position: absolute;
    top: 30px; left: 120px;
    font-family: 'Noto Sans SC', sans-serif;
    font-size: 13px;
    color: #1B3B6B;
    opacity: 0.6;
    letter-spacing: 2px;
  }
  /* Slide number */
  .slide-num {
    position: absolute;
    top: 30px; right: 120px;
    font-family: 'Noto Sans SC', sans-serif;
    font-size: 13px;
    color: #8B7355;
    opacity: 0.7;
    letter-spacing: 1px;
  }
  /* Main title */
  .main-title {
    position: absolute;
    top: 90px; left: 130px;
    font-family: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', serif;

    letter-spacing: 2px;
  }
  .title-underline {
    position: absolute;
    top: 152px; left: 130px;
    width: 80px; height: 3px;
    background: #8B7355;
  }
  /* Bookshelf container */
  .bookshelf {
    position: absolute;
    top: 210px; left: 130px;
    width: 1340px; height: 620px;
  }
  /* Shelf rows */
  .shelf-row {
    position: relative;
    display: flex;
    align-items: flex-end;
    gap: 12px;
    margin-bottom: 10px;
    padding-bottom: 6px;
    border-bottom: 4px solid #1B3B6B;
  }
  .shelf-row::after {
    content: '';
    position: absolute;
    bottom: -8px; left: 0;
    width: 100%; height: 4px;
    background: #8B7355;
    opacity: 0.3;
  }
  /* Book styles */
  .book {
    position: relative;
    border-radius: 2px 2px 1px 1px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 16px 10px;
    box-shadow: 2px 2px 6px rgba(27,59,107,0.15);
  }
  .book-spine-line {
    position: absolute;
    top: 12px; left: 50%;
    width: 1px; height: 20px;
    background: rgba(255,255,255,0.3);
    transform: translateX(-50%);

  .book-title {
    font-family: 'Noto Serif SC', 'Source Han Serif SC', serif;
    font-size: 14px;
    line-height: 1.5;
    color: #F5F0E8;
    font-weight: 600;
    letter-spacing: 0.5px;
    text-align: center;
  }
  .book-author {
    font-family: 'Noto Sans SC', sans-serif;
    font-size: 11px;
    color: rgba(245,240,232,0.7);
    text-align: center;
    margin-top: 8px;
    letter-spacing: 0.5px;
  }
  /* Book 1 */
  .book-1 {
    width: 120px;
    height: 280px;
    background: #1B3B6B;
  }
  .book-1 .book-title { font-size: 15px; }
  /* Book 2 */

    width: 110px;
    height: 260px;
    background: #2C4A7A;
  }
  /* Book 3 */

    width: 125px;
    height: 270px;
    background: #15305A;
  }
  .book-3 .book-title { font-size: 15px; }
  /* Book 4 */
  .book-4 {
    width: 105px;
    height: 255px;
    background: #1B3B6B;
  }
  /* Spacer / decorative block */
  .shelf-block {
    display: flex;
    align-items: flex-end;
    gap: 14px;
  }
  /* Decorative small square */
  .deco-square {
    width: 40px;
    height: 60px;
    background: #8B7355;
    opacity: 0.4;
    border-radius: 1px;
    margin-left: 20px;
  }
  /* Accent circle on shelf */
  .shelf-circle {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: #8B7355;
    opacity: 0.35;
    margin-bottom: 0;
    margin-left: 15px;
    flex-shrink: 0;
  }
  /* Right side label */
  .side-label {
    position: absolute;
    right: 0;
    top: 0;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 8px;
    padding-top: 20px;
  }
  .side-label .label-text {
    font-family: 'Noto Serif SC', serif;
    font-size: 18px;
    color: #1B3B6B;
    opacity: 0.4;
    writing-mode: vertical-rl;
    letter-spacing: 4px;
  }
  /* Bottom decoration line */
  .bottom-line {
    position: absolute;
    bottom: 50px; left: 80px;
    width: 1440px; height: 1px;
    background: #1B3B6B;
    opacity: 0.1;
  }
  /* Footer text */
  .footer-text {
    position: absolute;
    bottom: 25px; left: 130px;
    font-family: 'Noto Sans SC', sans-serif;
    font-size: 12px;
    color: #555;
    opacity: 0.6;
    letter-spacing: 1px;
  }
  /* Decorative large square background */
  .deco-large-square {
    position: absolute;

    border: 2px solid #1B3B6B;
    opacity: 0.04;
    transform: rotate(15deg);
  }
  /* Number labels on books */
  .book-number {
    position: absolute;
    top: 10px; left: 50%;

    font-family: 'Noto Sans SC', sans-serif;
    font-size: 11px;
    color: rgba(245,240,232,0.5);
    letter-spacing: 1px;
  }
  /* Geometric accent - diagonal line */
  .diag-line {
    position: absolute;
    top: 180px; right: 130px;
    width: 80px; height: 1px;
    background: #8B7355;
    opacity: 0.3;
    transform: rotate(-30deg);
  }
  /* Geometric accent - small filled square */
  .filled-square {
    position: absolute;
    top: 170px; right: 180px;
    width: 12px; height: 12px;
    background: #1B3B6B;
    opacity: 0.2;
  }
</style>
