<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1600px; height: 900px; overflow: hidden; }
body {
  background: #F5F0E8;
  font-family: 'Noto Sans SC', 'Source Han Sans SC', sans-serif;
  color: #1B3B6B;
  position: relative;
}

/* Parchment texture overlay */
body::before {
  content: '';
  position: absolute;
  top: 0; left: 0; width: 1600px; height: 900px;
  background: 
    repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(139,115,85,0.015) 3px, rgba(139,115,85,0.015) 4px),
    repeating-linear-gradient(90deg, transparent, transparent 5px, rgba(139,115,85,0.01) 5px, rgba(139,115,85,0.01) 6px);
  pointer-events: none;
  z-index: 1;
}

/* Bauhaus decorative elements */
.deco-circle-top {
  position: absolute;
  width: 120px; height: 120px;
  border-radius: 50%;
  border: 3px solid #1B3B6B;
  top: -40px; right: -40px;
  opacity: 0.12;
}
.deco-square-bl {
  position: absolute;
  width: 80px; height: 80px;
  background: #8B7355;
  bottom: 30px; left: 30px;
  opacity: 0.15;
}
.deco-line-vert {
  position: absolute;
  width: 2px; height: 900px;
  background: #1B3B6B;
  opacity: 0.06;
  left: 720px;
}
.deco-circle-small {
  position: absolute;
  width: 24px; height: 24px;
  border-radius: 50%;
  background: #8B7355;
  opacity: 0.4;
}
.deco-hline {
  position: absolute;
  height: 2px;
  background: #1B3B6B;
  opacity: 0.1;
}

/* Header */
.header {
  position: absolute;
  top: 50px; left: 80px; right: 80px;
  z-index: 10;
}
.lecture-tag {
  font-size: 13px;
  letter-spacing: 3px;
  color: #8B7355;
  text-transform: uppercase;
  margin-bottom: 12px;
  font-weight: 400;
}
.slide-title {
  font-family: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', serif;
  font-size: 42px;
  font-weight: 700;
  color: #1B3B6B;
  letter-spacing: 2px;
  line-height: 1.3;
}
.slide-subtitle {
  font-size: 16px;
  color: #555;
  margin-top: 10px;
  letter-spacing: 1px;
  font-weight: 300;
}

/* Left panel - visual metaphor */
.visual-panel {
  position: absolute;
  top: 210px;
  left: 80px;
  width: 560px;
  height: 620px;
  z-index: 10;
}

/* Geometric raised hands composition */
.hands-scene {
  position: relative;
  width: 560px;
  height: 520px;
}

/* Desk line */
.desk-line {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 560px;
  height: 3px;
  background: #1B3B6B;
  opacity: 0.3;
}

/* Figure silhouettes as abstract geometric shapes */
.figure {
  position: absolute;
  bottom: 3px;
}
.figure .head {
  width: 30px; height: 30px;
  border-radius: 50%;
  background: #1B3B6B;
  opacity: 0.7;
}
.figure .body {
  width: 40px; height: 60px;
  background: #1B3B6B;
  opacity: 0.5;
  margin: -4px auto 0;
}
.figure .arm-left {
  position: absolute;
  width: 8px;
  background: #1B3B6B;
  opacity: 0.6;
  bottom: 55px;
  left: -8px;
}
.figure .arm-right {
  position: absolute;
  width: 8px;
  background: #1B3B6B;
  opacity: 0.6;
  bottom: 55px;
  right: -8px;
}
.figure .hand {
  width: 14px; height: 14px;
  border-radius: 50%;
  background: #8B7355;
}

/* Individual figures */
.fig-1 { left: 60px; }
.fig-1 .arm-left { height: 220px; transform: rotate(-10deg); transform-origin: bottom; }
.fig-1 .arm-right { height: 160px; transform: rotate(8deg); transform-origin: bottom; }
.fig-1 .hand { position: absolute; top: -14px; left: -4px; }

.fig-2 { left: 180px; }
.fig-2 .arm-left { height: 180px; transform: rotate(5deg); transform-origin: bottom; }
.fig-2 .arm-right { height: 240px; transform: rotate(-5deg); transform-origin: bottom; }
.fig-2 .head { opacity: 0.8; }

.fig-3 { left: 300px; }
.fig-3 .arm-left { height: 260px; transform: rotate(-12deg); transform-origin: bottom; }
.fig-3 .arm-right { height: 130px; transform: rotate(15deg); transform-origin: bottom; }
.fig-3 .head { opacity: 0.65; }

.fig-4 { left: 420px; }
.fig-4 .arm-left { height: 150px; transform: rotate(6deg); transform-origin: bottom; }
.fig-4 .arm-right { height: 280px; transform: rotate(-8deg); transform-origin: bottom; }
.fig-4 .head { opacity: 0.75; }

/* Large abstract circle as a sun/idea */
.idea-circle {
  position: absolute;
  width: 140px; height: 140px;
  border-radius: 50%;
  border: 4px solid #8B7355;
  opacity: 0.25;
  top: 20px;
  right: 40px;
}
.idea-circle-inner {
  position: absolute;
  width: 60px; height: 60px;
  border-radius: 50%;
  background: #1B3B6B;
  opacity: 0.2;
  top: 65px;
  right: 95px;
}

/* Caption for visual */
.visual-caption {
  position: absolute;
  bottom: 0;
  left: 0;
  font-size: 13px;
  color: #8B7355;
  letter-spacing: 1px;
  font-style: italic;
  opacity: 0.8;
}

/* Right panel - agenda */
.agenda-panel {
  position: absolute;
  top: 220px;
  left: 760px;
  right: 80px;
  z-index: 10;
}
.agenda-label {
  font-size: 14px;
  letter-spacing: 4px;
  color: #8B7355;
  margin-bottom: 30px;
  font-weight: 500;
}
.agenda-divider {
  width: 50px;
  height: 3px;
  background: #1B3B6B;
  margin-bottom: 30px;
}

.agenda-list {
  list-style: none;
}
.agenda-item {
  display: flex;
  align-items: flex-start;
  margin-bottom: 22px;
}
.agenda-num {
  font-family: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', serif;
  font-size: 18px;
  color: #8B7355;
  width: 40px;
  flex-shrink: 0;
  font-weight: 600;
  line-height: 1.5;
}
.agenda-text {
  font-size: 17px;
  color: #1B3B6B;
  line-height: 1.6;
  letter-spacing: 0.5px;
}

/* Bottom bar */
.bottom-bar {
  position: absolute;
  bottom: 30px;
  left: 80px;
  right: 80px;
  display: flex;
  justify-content: space-between;
  align-items: center;

}
.page-info {

  color: #8B7355;
  letter-spacing: 2px;
  opacity: 0.7;
}
.theme-info {
  font-size: 12px;
  color: #555;
  letter-spacing: 1px;
  opacity: 0.6;
}
