

<!DOCTYPE html>
<html lang="zh-CN"><!-- source_hash: 9d6eec446d462b90 -->
<head>
<meta charset="UTF-8">
<title>第 03 期 · 商业模式：规则下的具体操作</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@400;600;700;900&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 1600px;
  height: 900px;
  overflow: hidden;
  margin: 0;
  background: #F5F0E8;
  font-family: 'Noto Sans SC', sans-serif;
  color: #1B3B6B;
  position: relative;
}

body::before {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 1600px; height: 900px;
  background:
    radial-gradient(ellipse at 18% 45%, rgba(139,115,85,0.04) 0%, transparent 50%),
    radial-gradient(ellipse at 82% 28%, rgba(139,115,85,0.025) 0%, transparent 40%);
  pointer-events: none;
  z-index: 0;
}

.hdr {
  position: absolute;
  top: 38px;
  left: 64px;
  right: 64px;
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  z-index: 10;
}

.hdr-l {
  font-family: 'Noto Serif SC', serif;
  font-size: 13px;
  color: #8B7355;
  letter-spacing: 3px;
}

.hdr-r {
  font-size: 13px;
  color: #555;
  letter-spacing: 2px;
}

.hdr-line {
  position: absolute;
  top: 64px;
  left: 64px;
  right: 64px;
  height: 1px;
  background: #8B7355;
  opacity: 0.25;
  z-index: 10;
}

/* === VISUAL AREA === */
.viz {
  position: absolute;
  top: 92px;
  left: 64px;
  width: 540px;
  height: 700px;
  overflow: hidden;
  z-index: 5;
}

.pl {
  position: absolute;
  border-radius: 1px;
}

.bd {
  position: absolute;
  border-left: 1px dashed #1B3B6B;
  opacity: 0.3;
}

.bd-lbl {
  position: absolute;
  font-family: 'Noto Serif SC', serif;
  font-size: 10px;
  color: #1B3B6B;
  opacity: 0.45;
  letter-spacing: 2px;
  writing-mode: vertical-rl;
  text-orientation: upright;
}

.sp {
  position: absolute;
  border-radius: 50%;
  background: #1B3B6B;
}

.spr {
  position: absolute;
  border-radius: 50%;
  border: 1.5px solid #1B3B6B;
  background: transparent;
}

.dp {
  position: absolute;
  border-radius: 50%;
  background: #1B3B6B;
}

.fp {
  position: absolute;
  background: #1B3B6B;
  border-radius: 40%;
}

.dc {
  position: absolute;
  border: 2px solid #1B3B6B;
  border-radius: 50%;
  opacity: 0.08;
}

.ds {
  position: absolute;
  background: #8B7355;
  opacity: 0.12;
}

.wv {
  position: absolute;
  height: 1px;
  background: #1B3B6B;
  opacity: 0.12;
}

.cap {
  position: absolute;
  bottom: 18px;
  left: 0;
  right: 0;
  text-align: center;
  font-family: 'Noto Serif SC', serif;
  font-size: 11px;
  color: #8B7355;
  opacity: 0.5;
  letter-spacing: 2px;
  font-style: italic;
}

/* === CONTENT AREA === */
.ct {
  position: absolute;
  top: 92px;
  left: 670px;
  right: 64px;
  height: 700px;
  z-index: 5;
}

.ct-bg1 {
  position: absolute;
  right: -40px;
  top: -60px;
  width: 200px;
  height: 200px;
  border: 2px solid #1B3B6B;
  border-radius: 50%;

.ct-bg2 {

  height: 100px;

}

.ct-title {

  font-size: 38px;
  font-weight: 700;
  color: #1B3B6B;
  line-height: 1.5;
  margin-bottom: 8px;
}

.ct-underline {
  width: 72px;
  height: 3px;
  background: #1B3B6B;
  margin-bottom: 28px;
}

.ctx {
  margin-bottom: 28px;
}

.ctx-item {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 10px;
  font-size: 15px;
  color: #555;
  font-weight: 400;
}

.ctx-dot {
  width: 6px;
  height: 6px;
  background: #8B7355;
  flex-shrink: 0;
}

.ctx-divider {
  width: 100%;
  height: 1px;
  background: #8B7355;
  opacity: 0.2;
  margin-bottom: 28px;
}

.cols {
  display: flex;
  gap: 36px;
  position: relative;
}

.col-divider {
  position: absolute;
  left: 50%;
  top: 0;
  bottom: 0;
  width: 1px;
  background: #8B7355;
  opacity: 0.15;
}

.col {
  flex: 1;
}

.col-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 8px;
}

.col-marker {
  width: 12px;
  height: 12px;
  background: #1B3B6B;
  flex-shrink: 0;
}

.col-marker.round {
  border-radius: 50%;
}

.col-name {
  font-family: 'Noto Serif SC', serif;
  font-size: 17px;
  font-weight: 700;
  color: #1B3B6B;
  letter-spacing: 1px;
}

.col-desc {
  font-size: 13px;
  color: #8B7355;
  margin-bottom: 18px;
  letter-spacing: 0.5px;
}

.entity-list {
  list-style: none;
}

.entity-item {
  font-size: 14px;
  color: #333;
  line-height: 2;
  padding-left: 16px;
  position: relative;
}

.entity-item::before {
  content: '';
  position: absolute;
  left: 0;
  top: 11px;
  width: 8px;
  height: 1px;
  background: #8B7355;
}

/* === FOOTER === */
.ftr {
  position: absolute;
  bottom: 28px;
  left: 64px;
  right: 64px;
  display: flex;
  justify-content: space-between;

}

.ftr-line {

  top: -14px;

  right: 0;
  height: 1px;

}

.ftr-c {

  color: #8B7355;

}

.ftr-r {

  font-size: 12px;
  color: #8B7355;
  opacity: 0.6;
}
</style>
