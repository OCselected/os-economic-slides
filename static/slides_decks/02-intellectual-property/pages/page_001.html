

<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<title>前情提要 · 第02期</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 1600px;
  height: 900px;
  overflow: hidden;
  margin: 0;
  background: #F5F0E8;
}

body {
  font-family: 'Noto Sans SC', sans-serif;
  color: #1B3B6B;
  position: relative;
}

/* Parchment texture overlay */
.parchment-texture {
  position: absolute;
  top: 0; left: 0;
  width: 1600px; height: 900px;
  background: 
    radial-gradient(ellipse at 20% 50%, rgba(139,115,85,0.03) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 30%, rgba(27,59,107,0.02) 0%, transparent 40%),
    radial-gradient(ellipse at 50% 80%, rgba(139,115,85,0.025) 0%, transparent 45%);
  pointer-events: none;
}

/* Decorative geometric elements */
.deco-circle-large {
  position: absolute;
  width: 420px;
  height: 420px;
  border-radius: 50%;
  border: 2px solid rgba(27,59,107,0.08);
  right: 80px;
  top: 120px;
}

.deco-circle-small {
  position: absolute;
  width: 120px;
  height: 120px;
  border-radius: 50%;
  background: rgba(27,59,107,0.04);
  right: 160px;
  top: 460px;
}

.deco-square-1 {
  position: absolute;
  width: 60px;
  height: 60px;
  border: 1.5px solid rgba(139,115,85,0.2);
  top: 60px;
  left: 80px;
}

.deco-square-2 {
  position: absolute;
  width: 30px;
  height: 30px;
  background: rgba(139,115,85,0.12);
  top: 80px;
  left: 100px;
}

.deco-line-h {
  position: absolute;
  height: 1px;
  background: rgba(27,59,107,0.12);
}

.deco-line-1 {
  top: 30px;
  left: 80px;
  width: 200px;
}

.deco-line-2 {
  top: 860px;
  left: 80px;
  width: 1440px;
  background: rgba(27,59,107,0.08);
}

.deco-line-v {
  position: absolute;
  width: 1px;
  background: rgba(27,59,107,0.06);
}

.deco-line-v-1 {
  top: 200px;
  left: 80px;
  height: 680px;
}

/* Header section */
.header {
  position: absolute;
  top: 50px;
  left: 80px;
  display: flex;
  align-items: center;
  gap: 16px;
}

.header-tag {
  font-size: 11px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: rgba(139,115,85,0.8);
  font-weight: 500;
}

.header-divider {
  width: 40px;
  height: 1px;
  background: rgba(139,115,85,0.4);
}

/* Main title area - center left */
.title-block {
  position: absolute;
  top: 180px;
  left: 120px;
  width: 600px;
}

.title-label {
  font-size: 13px;
  letter-spacing: 4px;
  color: rgba(139,115,85,0.7);
  margin-bottom: 20px;
  font-weight: 400;
}

.title-main {
  font-family: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', serif;
  font-size: 72px;
  font-weight: 700;
  color: #1B3B6B;
  letter-spacing: 8px;
  line-height: 1.2;
  position: relative;
}

.title-main::after {
  content: '';
  position: absolute;
  bottom: -16px;
  left: 0;
  width: 80px;
  height: 3px;
  background: #1B3B6B;
}

.title-subtitle {
  font-family: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', serif;
  font-size: 18px;
  color: rgba(27,59,107,0.55);
  margin-top: 40px;
  letter-spacing: 2px;
  font-weight: 400;
}

/* Center visual - "开源" characters on parchment */
.center-visual {
  position: absolute;
  top: 200px;
  left: 860px;
  width: 480px;
  height: 480px;
}

.visual-frame {
  position: absolute;
  top: 0; left: 0;
  width: 480px;
  height: 480px;
  background: rgba(245,240,232,0.6);
  border: 1px solid rgba(139,115,85,0.15);
}

.visual-frame-inner {
  position: absolute;
  top: 24px; left: 24px;
  width: 432px;
  height: 432px;
  border: 1px solid rgba(27,59,107,0.06);
}

.char-visual {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-family: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', serif;
  font-size: 180px;
  font-weight: 700;
  color: rgba(27,59,107,0.07);
  letter-spacing: 16px;
  white-space: nowrap;
}

/* Bottom content - recap items */
.recap-section {
  position: absolute;
  bottom: 120px;
  left: 120px;
  width: 1360px;
  display: flex;
  gap: 40px;
}

.recap-item {
  flex: 1;
  padding: 28px 28px 24px 28px;
  border-top: 2px solid rgba(27,59,107,0.15);
  position: relative;
}

.recap-item.active {
  border-top-color: #1B3B6B;
}

.recap-num {
  position: absolute;
  top: -14px;
  left: 0;
  background: #F5F0E8;
  padding-right: 12px;
  font-size: 12px;
  letter-spacing: 2px;
  color: rgba(139,115,85,0.7);
  font-weight: 500;
}

.recap-item.active .recap-num {
  color: #1B3B6B;
}

.recap-title {
  font-family: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', serif;
  font-size: 20px;
  font-weight: 600;
  color: #1B3B6B;
  margin-bottom: 10px;
  line-height: 1.4;
}

.recap-desc {
  font-size: 13px;
  color: rgba(85,85,85,0.75);
  line-height: 1.7;
}

/* Geometric accent dots */
.dot-cluster {
  position: absolute;
  display: flex;
  gap: 8px;
}

.dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: rgba(27,59,107,0.2);
}

.dot-cluster-1 {
  bottom: 60px;
  right: 100px;
}

/* Additional geometric decorations */
.deco-triangle {
  position: absolute;
  width: 0;
  height: 0;
  border-left: 20px solid transparent;
  border-right: 20px solid transparent;
  border-bottom: 34px solid rgba(139,115,85,0.08);
  top: 100px;
  right: 40px;
}

.deco-ring {
  position: absolute;
  width: 80px;
  height: 80px;
  border-radius: 50%;
  border: 3px solid rgba(139,115,85,0.1);
  bottom: 300px;
  left: 840px;
}

.deco-half-circle {
  position: absolute;
  width: 100px;
  height: 50px;
  border-radius: 100px 100px 0 0;
  background: rgba(27,59,107,0.03);
  top: 750px;
  left: 750px;
}

/* Current lecture indicator */
.current-indicator {
  position: absolute;
  bottom: 120px;
  left: 120px;
  width: 1360px;
  padding: 28px 28px 24px 28px;
  border-top: 2px solid rgba(27,59,107,0.15);
  position: absolute;
  display: flex;
  gap: 40px;
}

/* Footer */
.footer {
  position: absolute;
  bottom: 40px;
  left: 80px;
  right: 80px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.footer-left {
  font-size: 11px;
  letter-spacing: 2px;
  color: rgba(139,115,85,0.5);
}

.footer-right {
  font-size: 11px;
  letter-spacing: 2px;
  color: rgba(139,115,85,0.5);
}

/* Vertical text decoration */
.vertical-text {
  position: absolute;
  writing-mode: vertical-rl;
  font-size: 11px;
  letter-spacing: 4px;
  color: rgba(139,115,85,0.25);
  top: 300px;
  left: 40px;
}

/* Open source characters with layering effect */
.os-char-layer {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-family: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', serif;
  font-weight: 700;
  letter-spacing: 16px;
  white-space: nowrap;
  line-height: 1;
}

.os-char-back {
  font-size: 200px;
  color: rgba(27,59,107,0.03);
  top: calc(50% + 8px);
  left: calc(50% + 6px);
}

.os-char-mid {
  font-size: 180px;
  color: rgba(27,59,107,0.06);
  top: calc(50% - 2px);
  left: calc(50% - 2px);
}

.os-char-front {
  font-size: 160px;
  color: rgba(27,59,107,0.14);
}

</style>
</head>
