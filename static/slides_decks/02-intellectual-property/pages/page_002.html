

<!DOCTYPE html>
<html><!-- source_hash: 3da5d8f742bda446 -->
<head>
<meta charset="UTF-8">
<title>第02期 · 前情提要</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1600px;
    height: 900px;
    overflow: hidden;
    margin: 0;
    background: #F5F0E8;
  }
  body {
    font-family: 'Noto Sans SC', 'Source Han Sans SC', 'PingFang SC', sans-serif;
    color: #1B3B6B;
    position: relative;
  }

  /* Parchment texture overlay */
  .parchment-texture {
    position: absolute;
    top: 0; left: 0;
    width: 1600px; height: 900px;
    background: 
      repeating-linear-gradient(
        0deg,
        transparent,
        transparent 40px,
        rgba(139, 115, 85, 0.02) 40px,
        rgba(139, 115, 85, 0.02) 41px
      ),
      repeating-linear-gradient(
        90deg,
        transparent,
        transparent 60px,
        rgba(139, 115, 85, 0.015) 60px,
        rgba(139, 115, 85, 0.015) 61px
      );
    pointer-events: none;
    z-index: 0;
  }

  /* Bauhaus geometric elements */
  .geo-circle-large {
    position: absolute;
    width: 520px;
    height: 520px;
    border-radius: 50%;
    border: 2px solid rgba(27, 59, 107, 0.12);
    top: 180px;
    left: -120px;
    z-index: 1;
  }

  .geo-circle-small {
    position: absolute;
    width: 180px;
    height: 180px;
    border-radius: 50%;
    background: rgba(27, 59, 107, 0.06);
    top: 80px;
    right: 120px;
    z-index: 1;
  }

  .geo-square {
    position: absolute;
    width: 90px;
    height: 90px;
    background: rgba(139, 115, 85, 0.1);
    bottom: 140px;
    right: 200px;
    z-index: 1;
  }

  .geo-line-h {
    position: absolute;
    width: 320px;
    height: 2px;
    background: #1B3B6B;
    bottom: 240px;
    right: 200px;
    z-index: 2;
  }

  .geo-line-v {
    position: absolute;
    width: 2px;
    height: 200px;
    background: rgba(139, 115, 85, 0.4);
    top: 200px;
    right: 240px;
    z-index: 2;
  }

  .geo-circle-accent {
    position: absolute;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: #8B7355;
    bottom: 238px;
    right: 196px;
    z-index: 3;
  }

  .geo-square-small {
    position: absolute;
    width: 30px;
    height: 30px;
    background: #1B3B6B;
    opacity: 0.15;
    top: 700px;
    left: 80px;
    transform: rotate(45deg);
    z-index: 1;
  }

  .geo-line-diag {
    position: absolute;
    width: 2px;
    height: 160px;
    background: rgba(27, 59, 107, 0.2);
    top: 60px;
    left: 520px;
    transform: rotate(25deg);
    transform-origin: top left;
    z-index: 1;
  }

  /* Header */
  .header {
    position: absolute;
    top: 60px;
    left: 80px;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .lecture-number {
    font-family: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', serif;
    font-size: 22px;
    color: #8B7355;
    letter-spacing: 2px;
  }

  .lecture-divider {
    width: 40px;
    height: 1px;
    background: #8B7355;
  }

  .lecture-topic {
    font-size: 14px;
    color: #555;
    letter-spacing: 1px;
  }

  /* Main content area */
  .main-content {
    position: absolute;
    top: 160px;
    left: 120px;
    width: 900px;
    z-index: 10;
  }

  .section-label {
    font-family: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', serif;
    font-size: 16px;
    color: #8B7355;
    letter-spacing: 6px;
    margin-bottom: 20px;
    text-transform: uppercase;
  }

  .main-title {
    font-family: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', serif;
    font-size: 88px;
    font-weight: 700;
    color: #1B3B6B;
    line-height: 1.2;
    margin-bottom: 16px;
    letter-spacing: 4px;
  }

  .subtitle-note {
    font-size: 18px;
    color: #555;
    line-height: 1.6;
    margin-bottom: 60px;
    max-width: 600px;
    letter-spacing: 0.5px;
  }

  /* Lecture items */
  .lecture-list {
    list-style: none;
    padding: 0;
    margin: 0;
  }

  .lecture-item {
    display: flex;
    align-items: baseline;
    gap: 24px;
    padding: 24px 0;
    border-bottom: 1px solid rgba(139, 115, 85, 0.2);
  }

  .lecture-item:last-child {
    border-bottom: none;
  }

  .lecture-item-num {
    font-family: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', serif;
    font-size: 14px;
    color: #8B7355;
    min-width: 56px;
    letter-spacing: 2px;
    font-weight: 600;
  }

  .lecture-item-title {
    font-family: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', serif;
    font-size: 26px;
    color: #1B3B6B;
    font-weight: 600;
    letter-spacing: 1px;
  }

  .lecture-item-desc {
    font-size: 14px;
    color: #777;
    margin-top: 6px;
    line-height: 1.5;
    letter-spacing: 0.3px;
  }

  /* Right panel - visual metaphor */
  .right-panel {
    position: absolute;
    top: 200px;
    right: 100px;
    width: 340px;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .character-frame {
    width: 280px;
    height: 280px;
    border: 1px solid rgba(27, 59, 107, 0.25);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    background: rgba(245, 240, 232, 0.6);
  }

  .character-frame::before {
    content: '';
    position: absolute;
    top: 12px;
    left: 12px;
    right: 12px;
    bottom: 12px;
    border: 1px solid rgba(139, 115, 85, 0.15);
  }

  .character-text {
    font-family: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', serif;
    font-size: 96px;
    color: #1B3B6B;
    font-weight: 700;
    letter-spacing: 8px;
    line-height: 1;
  }

  .character-caption {
    margin-top: 24px;
    font-size: 13px;
    color: #8B7355;
    letter-spacing: 3px;
    text-align: center;
    line-height: 1.8;
  }

  /* Decorative corner marks */
  .corner-mark {
    position: absolute;
    width: 20px;
    height: 20px;
    z-index: 5;
  }

  .corner-mark-tl {
    top: 40px;
    left: 40px;
    border-top: 1px solid rgba(27, 59, 107, 0.3);
    border-left: 1px solid rgba(27, 59, 107, 0.3);
  }

  .corner-mark-br {
    bottom: 40px;
    right: 40px;
    border-bottom: 1px solid rgba(27, 59, 107, 0.3);
    border-right: 1px solid rgba(27, 59, 107, 0.3);
  }

  /* Footer */
  .footer {
    position: absolute;
    bottom: 40px;
    left: 80px;
    display: flex;
    align-items: center;
    gap: 16px;
    z-index: 10;
  }

  .footer-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #8B7355;
  }

  .footer-text {
    font-size: 12px;
    color: #8B7355;
    letter-spacing: 2px;
  }

  /* Slide number */
  .slide-number {
    position: absolute;
    bottom: 40px;
    right: 80px;
    font-family: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', serif;
    font-size: 13px;
    color: #8B7355;
    letter-spacing: 1px;
    z-index: 10;
  }
</style>

<body>

  <div class="parchment-texture"></div>

  <!-- Bauhaus geometric decorations -->
  <div class="geo-circle-large"></div>

  <div class="geo-square"></div>
  <div class="geo-line-h"></div>
  <div class="geo-line-v"></div>
  <div class="geo-circle-accent"></div>
  <div class="geo-square-small"></div>
  <div class="geo-line-diag"></div>

  <!-- Corner marks -->
  <div class="corner-mark corner-mark-tl"></div>
  <div class="corner-mark corner-mark-br"></div>

  <!-- Header -->
  <div class="header">
    <span class="lecture-number">第 02 期</span>

  <div class="main-content">

          <div class="lecture-item-title">软件的生产、分销和消费</div>

  <!-- Right panel - visual metaphor -->
  <div class="right-panel">
    <div class="character-frame">
      <span class="character-text">开源</span>

    <div class="character-caption">一次思想的开启<br>A PARCHMENT OPENING</div>
  </div>

  <!-- Footer -->
  <div class="footer">
    <span class="footer-dot"></span>
