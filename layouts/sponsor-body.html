<style>
.tiers{padding:4rem clamp(2rem,5vw,6rem);}
.tiers-header{
  display:flex;align-items:baseline;gap:1.5rem;
  margin-bottom:2.5rem;border-bottom:1px solid var(--copper);
  padding-bottom:1rem;
}
.tiers-header h2{font-size:1.6rem;color:var(--cream);font-weight:600;}
.tiers-header .note{font-size:0.8rem;color:var(--copper);font-style:italic;}
.tier-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.5rem;}
@media(max-width:900px){.tier-grid{grid-template-columns:1fr}}

.tier{
  padding:2rem 1.5rem;
  background:rgba(27,59,107,0.4);
  border:2px solid var(--copper);border-radius:6px;
  position:relative;
}
.tier.featured{border-color:var(--amber);background:rgba(212,168,83,0.08);}
.tier.featured::before{
  content:'推荐';position:absolute;top:-12px;right:16px;
  background:var(--amber);color:#0F1B2D;
  font-size:0.7rem;font-weight:600;letter-spacing:0.1em;
  padding:3px 10px;border-radius:3px;
}
.tier-name{
  font-size:0.85rem;color:var(--amber);
  font-style:italic;font-weight:300;
  letter-spacing:0.1em;margin-bottom:0.5rem;
}
.tier-title{font-size:1.3rem;font-weight:700;color:var(--cream);margin-bottom:0.5rem;}
.tier-price{
  font-family:'Source Serif 4',serif;
  font-size:1.8rem;font-weight:300;color:var(--amber);margin-bottom:1rem;
}
.tier-price .unit{font-size:0.8rem;color:var(--muted);font-weight:400;margin-left:0.3rem;}
.tier-features{list-style:none;padding:0;border-top:1px solid rgba(212,168,83,0.2);padding-top:1rem;}
.tier-features li{
  padding:0.4rem 0 0.4rem 1.5rem;position:relative;
  font-size:0.85rem;color:var(--cream);line-height:1.6;
}
.tier-features li::before{
  content:'▸';position:absolute;left:0;top:0.4rem;
  color:var(--amber);font-size:0.75rem;
}
.tier-cta{
  margin-top:1.5rem;padding:0.7rem 1.2rem;
  background:var(--copper);color:#0F1B2D;
  font-family:inherit;font-size:0.85rem;
  border:none;border-radius:4px;
  cursor:pointer;width:100%;text-align:center;
  display:block;text-decoration:none;
  letter-spacing:0.05em;transition:background 0.2s;
}
.tier-cta:hover{background:var(--amber)}

.contact{
  padding:3rem clamp(2rem,5vw,6rem);
  background:rgba(27,59,107,0.5);
  text-align:center;
  border-top:1px solid var(--copper);
  border-bottom:1px solid var(--copper);
}
.contact h2{font-size:1.3rem;color:var(--cream);margin-bottom:0.8rem;}
.contact p{font-size:0.9rem;color:var(--muted);margin-bottom:1.5rem;}
.contact-links{display:flex;justify-content:center;gap:2rem;flex-wrap:wrap;}
.contact-links a{
  color:var(--amber);text-decoration:none;
  font-size:0.9rem;padding:0.5rem 1rem;
  border:1px solid var(--copper);border-radius:4px;
  transition:all 0.2s;
}
.contact-links a:hover{background:var(--copper);color:#0F1B2D}

.footer{
  padding:1.5rem clamp(2rem,5vw,6rem);
  background:rgba(15,27,45,0.8);
  color:var(--copper);
  display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:1rem;
  font-size:0.75rem;
}
.footer a{color:var(--copper);text-decoration:none;}
.footer a:hover{color:var(--amber)}
</style>
