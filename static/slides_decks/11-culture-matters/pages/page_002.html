<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body, html {
  width: 1600px;

}

.parchment-texture {

  width: 1600px;
  height: 900px;

  z-index: 0;
}

.parchment-texture::before {
  content: '';

  top: 0; left: 0;
  width: 1600px;
  height: 900px;
  background:

    radial-gradient(ellipse at 80% 30%, rgba(27,59,107,0.02) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 80%, rgba(139,115,85,0.02) 0%, transparent 40%);
}

/* Bauhaus geometric decorations */
.deco-square-1 {
  position: absolute;
  top: 60px;

  height: 120px;
  border: 3px solid #1B3B6B;

}

.deco-square-2 {

.deco-line-1 {

  height: 200px;

.round-table-scene {

  top: 160px;
  left: 50%;
  transform: translateX(-50%);
  width: 700px;
  height: 400px;
  z-index: 2;
}

.table-circle {
  position: absolute;
  top: 50%;
  left: 50%;

  width: 280px;
  height: 280px;
  border-radius: 50%;
  border: 3px solid #1B3B6B;
  opacity: 0.7;
}

.table-circle-inner {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 200px;
  height: 200px;
  border-radius: 50%;
  border: 1px solid #1B3B6B;
  opacity: 0.3;
}

/* People around the table - abstract geometric figures */
.figure {
  position: absolute;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: #1B3B6B;
  opacity: 0.85;
}

.figure-head {
  position: absolute;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  top: -22px;
  left: 50%;
  transform: translateX(-50%);
  background: #1B3B6B;
  opacity: 0.7;
}

/* Positioned figures around the table */
.fig-1 { top: 30px; left: 50%; transform: translateX(-50%); }
.fig-2 { top: 80px; left: 150px; }
.fig-3 { bottom: 80px; left: 100px; }
.fig-4 { bottom: 30px; left: 50%; transform: translateX(-50%); }
.fig-5 { bottom: 80px; right: 100px; }
.fig-6 { top: 80px; right: 150px; }
.fig-7 { top: 50%; left: 20px; transform: translateY(-50%); }
.fig-8 { top: 50%; right: 20px; transform: translateY(-50%); }

.figure-triangle {
  position: absolute;
  width: 0;
  height: 0;
  border-left: 14px solid transparent;
  border-right: 14px solid transparent;
  border-bottom: 24px solid #8B7355;
  opacity: 0.7;
}

.tri-1 { bottom: 160px; left: 200px; transform: rotate(-20deg); }
.tri-2 { top: 180px; right: 180px; transform: rotate(30deg); }
.tri-3 { bottom: 100px; right: 250px; transform: rotate(-10deg); }

.connection-line {
  position: absolute;
  background: #1B3B6B;
  opacity: 0.2;
  transform-origin: center;
}

.lecture-badge {

  transform: translateX(-50%);

  font-size: 14px;
  color: #8B7355;
  letter-spacing: 4px;
  text-transform: uppercase;
  z-index: 5;
}

/* Main content area */
.content-area {
  position: absolute;
  bottom: 120px;
  left: 0;
  width: 1600px;
  text-align: center;
  z-index: 5;
}

.main-title {
  font-family: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', serif;

  color: #1B3B6B;
  font-weight: 700;
  letter-spacing: 6px;

}

.subtitle-line {

}

.subtitle-text {

}

.highlight-text {

}

.speaker-info {

/* Bottom decorative elements */
.bottom-bar {

}

.corner-square {

}
